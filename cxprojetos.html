                </div>`, 'form-membro', 'Adicionar membro');
        }

        function modalTarefa(projetoId = '', cronId = '') {
            if (!state.projetos.some(p => p.status !== 'arquivado')) {
                toast('Crie um projeto antes de adicionar tarefas.', 'info'); modalProjeto(); return;
            }
            const pid = projetoId || state.filtros.projeto || state.projetos.find(p => p.status !== 'arquivado').id;
            abrirModal('Nova Tarefa', `
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div><label class="lbl">Projeto *</label><select id="nt-projeto" class="inp" required>${optionsProjetos(pid)}</select></div>
                    <div><label class="lbl">Cronograma</label><select id="nt-cron" class="inp">${optionsCron(pid, cronId) || '<option value="">Geral (será criado)</option>'}</select></div>
                    <div class="sm:col-span-2"><label class="lbl">Título *</label><input id="nt-titulo" class="inp" required maxlength="140"></div>
                    <div class="sm:col-span-2"><label class="lbl">Descrição / observações</label><textarea id="nt-desc" rows="3" class="inp"></textarea></div>
                    <div><label class="lbl">Responsável *</label><select id="nt-resp" class="inp" required><option value="">Selecione...</option>${optionsMembros()}</select></div>
                    <div><label class="lbl">Prazo *</label><input id="nt-prazo" type="date" class="inp" required value=""></div>
                    <div><label class="lbl">Prioridade</label><select id="nt-prio" class="inp">${PRIORIDADES.map(p => `<option ${p === 'Média' ? 'selected' : ''}>${p}</option>`).join('')}</select></div>
                    <div><label class="lbl">Status inicial</label><select id="nt-status" class="inp">${STATUS.map(s => `<option>${s}</option>`).join('')}</select></div>
                </div>
                <p class="text-xs text-gray-400 mt-3"><i class="far fa-envelope mr-1"></i>O responsável receberá um e-mail automático ao ser atribuído.</p>`, 'form-tarefa', 'Criar tarefa', 'max-w-2xl');
        }

        // ==========================================================
        // DRAWER: DETALHE DA TAREFA + COLABORAÇÃO
        // ==========================================================
        function abrirDrawer(id) {
            const t = getTarefa(id);
            if (!t) return;
            state.drawerTaskId = id;
            const p = getProjeto(t.projetoId);
            const hist = (t.historicoPrazos || []).length;
            $('#drawer-panel').innerHTML = `
                <div class="px-5 py-3 border-b flex items-center justify-between gap-2 bg-gray-50 shrink-0">
                    <div class="flex items-center gap-2 min-w-0">${chipProjeto(p)}<span id="dr-situacao">${badgeSituacao(t)}</span></div>
                    <div class="flex items-center gap-1">
                        ${podeExcluirTarefa(t) ? `<button data-action="excluir-tarefa" data-id="${esc(t.id)}" class="w-8 h-8 rounded-lg text-gray-400 hover:text-red-500 hover:bg-red-50" title="Excluir tarefa"><i class="fas fa-trash"></i></button>` : ''}
                        <button data-action="fechar-drawer" class="w-8 h-8 rounded-lg text-gray-500 hover:bg-gray-200"><i class="fas fa-times"></i></button>
                    </div>
                </div>
                <div class="flex-1 overflow-y-auto">
                    <div class="p-5 border-b">
                        <input id="dt-titulo" class="w-full text-xl font-bold text-leveros-verde1 border-0 border-b border-transparent hover:border-gray-300 focus:border-leveros-azul focus:outline-none pb-1 mb-4" value="${esc(t.titulo)}" maxlength="140">
                        <div class="grid grid-cols-2 gap-3">
                            <div><label class="lbl">Responsável</label><select id="dt-resp" class="inp">${optionsMembros(t.responsavelEmail)}</select></div>
                            <div><label class="lbl">Status</label><select id="dt-status" class="inp">${STATUS.map(s => `<option ${s === t.status ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
                            <div><label class="lbl">Prazo</label><input id="dt-prazo" type="date" class="inp" value="${esc(t.prazo || '')}"></div>
                            <div><label class="lbl">Prioridade</label><select id="dt-prio" class="inp">${PRIORIDADES.map(s => `<option ${s === (t.prioridade || 'Média') ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
                            <div class="col-span-2"><label class="lbl">Cronograma</label><select id="dt-cron" class="inp">${optionsCron(t.projetoId, t.cronogramaId)}</select></div>
                            <div id="dt-motivo-wrap" class="col-span-2 hidden"><label class="lbl">Motivo da alteração de prazo <span class="font-normal normal-case text-gray-400">(fica registrado no histórico)</span></label><input id="dt-motivo" class="inp bg-yellow-50" placeholder="Ex: aguardando retorno do fornecedor"></div>
                            <div class="col-span-2"><label class="lbl">Descrição</label><textarea id="dt-desc" rows="3" class="inp">${esc(t.descricao || '')}</textarea></div>
                        </div>
                        <div class="flex items-center justify-between mt-4 flex-wrap gap-2">
                            <span class="text-[11px] text-gray-400">Criada por ${esc(getMembro(t.criadoPorEmail).nome)} em ${t.criadoEm ? fmtDataHora(tsMillis(t.criadoEm)) : '—'}${hist ? ` · prazo alterado ${hist}×` : ''}</span>
                            <button data-action="salvar-tarefa" data-id="${esc(t.id)}" class="px-4 py-2 bg-leveros-verde1 text-white rounded-lg hover:bg-leveros-verde2 font-medium text-sm"><i class="fas fa-save mr-1"></i> Salvar alterações</button>
                        </div>
                    </div>
                    <div class="p-5">
                        <h4 class="font-bold text-gray-700 mb-3 text-sm"><i class="far fa-comments text-leveros-verde2 mr-1"></i> Observações e questionamentos</h4>
                        <div id="feed" class="flex flex-col gap-3 mb-3"><div class="loader" style="width:24px;height:24px;border-width:3px"></div></div>
                    </div>
                </div>
                <div class="border-t p-3 bg-white shrink-0">
                    <div class="flex gap-2 items-end">
                        <textarea id="dt-comentario" rows="2" class="inp resize-none" placeholder="Escreva uma observação ou pergunta... (Enter envia, Shift+Enter quebra linha)"></textarea>
                        <button data-action="enviar-comentario" data-id="${esc(t.id)}" class="h-10 w-10 shrink-0 bg-leveros-azul text-leveros-verde1 rounded-lg hover:bg-leveros-verde3 font-bold" title="Enviar"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>`;
            const d = $('#drawer'); d.classList.remove('hidden');

            if (state.unsubFeed) state.unsubFeed();
            state.unsubFeed = onSnapshot(query(collection(db, 'tarefas', id, 'comentarios'), orderBy('criadoEm', 'asc')), (snap) => {
                const feed = $('#feed'); if (!feed || state.drawerTaskId !== id) return;
                const itens = snap.docs.map(x => ({ id: x.id, ...x.data() }));
                feed.innerHTML = itens.length ? itens.map(feedItemHTML).join('') : '<p class="text-xs text-gray-400 text-center py-4">Nenhuma observação ainda. Use este espaço no lugar das threads de e-mail.</p>';
                const cont = feed.closest('.overflow-y-auto'); if (cont) cont.scrollTop = cont.scrollHeight;
            }, (err) => { console.error(err); $('#feed').innerHTML = '<p class="text-xs text-red-500">Não foi possível carregar o histórico (verifique as regras do Firestore).</p>'; });
        }

        function feedItemHTML(c) {
            const quando = fmtDataHora(tsMillis(c.criadoEm));
            if (c.tipo === 'sistema') {
                return `<div class="flex items-start gap-2 text-xs text-gray-500 bg-gray-50 rounded-lg px-3 py-2"><i class="fas fa-clock-rotate-left mt-0.5 text-gray-400"></i><div><span class="font-semibold">${esc(getMembro(c.autorEmail).nome)}</span> ${esc(c.texto)} <span class="text-gray-400">· ${quando}</span></div></div>`;
            }
            const minha = c.autorEmail === state.user.email;
            return `<div class="flex gap-2.5 ${minha ? 'flex-row-reverse' : ''}">
                ${avatar(c.autorEmail, 'w-8 h-8 text-xs')}
                <div class="max-w-[80%] ${minha ? 'bg-leveros-verde4/60' : 'bg-gray-100'} rounded-xl px-3 py-2">
                    <div class="text-[11px] font-bold text-leveros-verde2">${esc(getMembro(c.autorEmail).nome)} <span class="text-gray-400 font-normal">· ${quando}</span></div>
                    <div class="text-sm text-gray-800 whitespace-pre-wrap break-words">${esc(c.texto)}</div>
                </div></div>`;
        }

        function fecharDrawer() {
            state.drawerTaskId = null;
            if (state.unsubFeed) { state.unsubFeed(); state.unsubFeed = null; }
            const d = $('#drawer'); if (d) d.classList.add('hidden');
        }

        // ==========================================================
        // AÇÕES DE DADOS
        // ==========================================================
        async function logAtividade(tarefaId, texto, tipo = 'sistema') {
            await addDoc(collection(db, 'tarefas', tarefaId, 'comentarios'), {
                tipo, texto, autorEmail: state.user.email, autorNome: state.user.nome, criadoEm: serverTimestamp()
            });
            if (tipo === 'comentario') await updateDoc(doc(db, 'tarefas', tarefaId), { comentariosCount: increment(1) });
        }

        async function notificarAtribuicao(tarefa, projeto) {
            const para = tarefa.responsavelEmail;
            if (!para || para === state.user.email) return; // não notifica a si mesmo
            const membro = getMembro(para);
            const link = window.location.href.split('#')[0];
            const assunto = `[Projetos] Nova tarefa atribuída a você: ${tarefa.titulo}`;
            const html = `<div style="font-family:Segoe UI,Arial,sans-serif;max-width:560px;margin:auto;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden">
                <div style="background:#002D32;color:#fff;padding:16px 20px"><strong>Nova tarefa atribuída a você</strong></div>
                <div style="padding:20px;color:#1f2937">
                  <p>Olá, ${esc(primeiroNome(membro.nome))}! <strong>${esc(state.user.nome)}</strong> atribuiu uma tarefa a você.</p>
                  <table style="width:100%;font-size:14px;margin:12px 0">
                    <tr><td style="color:#6b7280;width:90px">Tarefa</td><td><strong>${esc(tarefa.titulo)}</strong></td></tr>
                    <tr><td style="color:#6b7280">Projeto</td><td>${esc(projeto?.nome || '—')}</td></tr>
                    <tr><td style="color:#6b7280">Prazo</td><td>${fmtBR(tarefa.prazo)}</td></tr>
                    ${tarefa.descricao ? `<tr><td style="color:#6b7280;vertical-align:top">Detalhes</td><td>${esc(tarefa.descricao)}</td></tr>` : ''}
                  </table>
                  <a href="${esc(link)}" style="display:inline-block;background:#005A64;color:#fff;padding:10px 18px;border-radius:8px;text-decoration:none">Abrir no portal</a>
                </div></div>`;
            try {
                if (EMAIL_CONFIG.provider === 'firestore-mail') {
                    await addDoc(collection(db, 'mail'), { to: [para], message: { subject: assunto, html } });
                } else if (EMAIL_CONFIG.provider === 'emailjs') {
                    const c = EMAIL_CONFIG.emailjs;
                    const resp = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            service_id: c.serviceId, template_id: c.templateId, user_id: c.publicKey,
                            template_params: {
                                to_email: para, to_name: membro.nome, subject: assunto, task_title: tarefa.titulo,
                                project_name: projeto?.nome || '', due_date: fmtBR(tarefa.prazo), assigned_by: state.user.nome,
                                description: tarefa.descricao || '', link
                            }
                        })
                    });
                    if (!resp.ok) throw new Error(await resp.text());
                } else {
                    console.info('[E-MAIL SIMULADO]', { para, assunto, html });
                    toast(`(Simulação) e-mail enviado para ${membro.nome}`, 'info');
                    return;
                }
                toast(`E-mail de atribuição enviado para ${membro.nome}`);
            } catch (e) {
                console.error('Falha ao enviar e-mail:', e);
                toast('Tarefa salva, mas o e-mail de notificação falhou.', 'erro');
            }
        }

        async function moverStatus(id, novo) {
            const t = getTarefa(id);
            if (!t || t.status === novo) return;
            try {
                await updateDoc(doc(db, 'tarefas', id), { status: novo, atualizadoEm: serverTimestamp() });
                await logAtividade(id, `moveu a tarefa de "${t.status}" para "${novo}"`);
            } catch (e) { console.error(e); toast('Não foi possível mover a tarefa.', 'erro'); }
        }

        async function salvarTarefa(id) {
            const t = getTarefa(id); if (!t) return;
            const novo = {
                titulo: $('#dt-titulo').value.trim(),
                descricao: $('#dt-desc').value.trim(),
                responsavelEmail: $('#dt-resp').value,
                prazo: $('#dt-prazo').value,
                prioridade: $('#dt-prio').value,
                status: $('#dt-status').value,
                cronogramaId: $('#dt-cron').value
            };
            if (!novo.titulo) return toast('O título não pode ficar vazio.', 'erro');
            if (!novo.prazo) return toast('Informe o prazo.', 'erro');
            novo.responsavelNome = getMembro(novo.responsavelEmail).nome;
            const motivo = $('#dt-motivo').value.trim();
            const upd = { ...novo, atualizadoEm: serverTimestamp() };
            const logs = [];

            if (novo.prazo !== t.prazo) {
                upd.historicoPrazos = arrayUnion({ de: t.prazo || '', para: novo.prazo, por: state.user.email, em: Date.now(), motivo });
                logs.push(`alterou o prazo de ${fmtBR(t.prazo)} para ${fmtBR(novo.prazo)}${motivo ? ` — Motivo: ${motivo}` : ''}`);
            }
            if (novo.responsavelEmail !== t.responsavelEmail) logs.push(`reatribuiu a tarefa de ${getMembro(t.responsavelEmail).nome} para ${novo.responsavelNome}`);
            if (novo.status !== t.status) logs.push(`alterou o status de "${t.status}" para "${novo.status}"`);
            if (novo.prioridade !== (t.prioridade || 'Média')) logs.push(`alterou a prioridade para ${novo.prioridade}`);
            if (novo.titulo !== t.titulo) logs.push('renomeou a tarefa');
            if (novo.descricao !== (t.descricao || '')) logs.push('atualizou a descrição');

            try {
                await updateDoc(doc(db, 'tarefas', id), upd);
                for (const l of logs) await logAtividade(id, l);
                if (novo.responsavelEmail !== t.responsavelEmail) await notificarAtribuicao({ ...t, ...novo }, getProjeto(t.projetoId));
                toast('Tarefa atualizada.');
                $('#dt-motivo-wrap').classList.add('hidden'); $('#dt-motivo').value = '';
                $('#dr-situacao').innerHTML = badgeSituacao({ ...t, ...novo });
            } catch (e) { console.error(e); toast('Erro ao salvar a tarefa.', 'erro'); }
        }

        async function enviarComentario(id) {
            const ta = $('#dt-comentario'); const texto = ta.value.trim();
            if (!texto) return;
            ta.value = ''; ta.focus();
            try { await logAtividade(id, texto, 'comentario'); }
            catch (e) { console.error(e); ta.value = texto; toast('Não foi possível enviar a observação.', 'erro'); }
        }

        async function excluirTarefa(id) {
            const t = getTarefa(id); if (!t) return;
            if (!confirm(`Excluir a tarefa "${t.titulo}"? Essa ação não pode ser desfeita.`)) return;
            try { await deleteDoc(doc(db, 'tarefas', id)); fecharDrawer(); toast('Tarefa excluída.'); }
            catch (e) { console.error(e); toast('Sem permissão para excluir esta tarefa.', 'erro'); }
        }

        async function excluirCronograma(id) {
            const cr = state.cronogramas.find(c => c.id === id); if (!cr) return;
            const ts = state.tarefas.filter(t => t.cronogramaId === id);
            if (!confirm(`Excluir o cronograma "${cr.nome}" e suas ${ts.length} tarefa(s)?`)) return;
            try {
                const b = writeBatch(db);
                ts.forEach(t => b.delete(doc(db, 'tarefas', t.id)));
                b.delete(doc(db, 'cronogramas', id));
                await b.commit(); toast('Cronograma excluído.');
            } catch (e) { console.error(e); toast('Sem permissão para excluir tudo isso.', 'erro'); }
        }

        async function excluirProjeto(id) {
            const p = getProjeto(id); if (!p) return;
            const ts = state.tarefas.filter(t => t.projetoId === id);
            const cs = state.cronogramas.filter(c => c.projetoId === id);
            if (!confirm(`Excluir o projeto "${p.nome}" com ${cs.length} cronograma(s) e ${ts.length} tarefa(s)? Essa ação não pode ser desfeita.`)) return;
            try {
                const itens = [...ts.map(t => doc(db, 'tarefas', t.id)), ...cs.map(c => doc(db, 'cronogramas', c.id)), doc(db, 'projetos', id)];
                for (let i = 0; i < itens.length; i += 400) {
                    const b = writeBatch(db); itens.slice(i, i + 400).forEach(r => b.delete(r)); await b.commit();
                }
                toast('Projeto excluído.'); navegar('projetos');
            } catch (e) { console.error(e); toast('Sem permissão para excluir o projeto.', 'erro'); }
        }

        // ==========================================================
        // SUBMITS DE FORMULÁRIOS
        // ==========================================================
        document.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type=submit]');
            const original = btn?.innerHTML;
            if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Salvando...'; }
            try {
                if (e.target.id === 'form-projeto') {
                    const nome = $('#np-nome').value.trim();
                    const cor = document.querySelector('input[name=np-cor]:checked')?.value || PALETA[0];
                    const ref = await addDoc(collection(db, 'projetos'), {
                        nome, descricao: $('#np-desc').value.trim(), cor, status: 'ativo',
                        criadoPorEmail: state.user.email, criadoPorNome: state.user.nome, criadoEm: serverTimestamp()
                    });
                    const nCron = $('#np-cron').value.trim();
                    if (nCron) await addDoc(collection(db, 'cronogramas'), { projetoId: ref.id, nome: nCron, criadoPorEmail: state.user.email, criadoEm: serverTimestamp() });
                    fecharModal(); toast('Projeto criado.'); navegar('projeto', ref.id);
                }
                else if (e.target.id === 'form-cronograma') {
                    await addDoc(collection(db, 'cronogramas'), {
                        projetoId: $('#nc-projeto').value, nome: $('#nc-nome').value.trim(),
                        criadoPorEmail: state.user.email, criadoEm: serverTimestamp()
                    });
                    fecharModal(); toast('Cronograma criado.');
                }
                else if (e.target.id === 'form-membro') {
                    const email = $('#nm-email').value.trim().toLowerCase();
                    if (!email.endsWith(DOMINIO)) throw new Error(`Use um e-mail ${DOMINIO}`);
                    await setDoc(doc(db, 'proj_membros', email), { email, nome: $('#nm-nome').value.trim(), foto: '', preCadastro: true }, { merge: true });
                    fecharModal(); toast('Membro adicionado à equipe.');
                }
                else if (e.target.id === 'form-tarefa') {
                    const projetoId = $('#nt-projeto').value;
                    let cronogramaId = $('#nt-cron').value;
                    if (!cronogramaId) {
                        const r = await addDoc(collection(db, 'cronogramas'), { projetoId, nome: 'Geral', criadoPorEmail: state.user.email, criadoEm: serverTimestamp() });
                        cronogramaId = r.id;
                    }
                    const respEmail = $('#nt-resp').value;
                    const dados = {
                        projetoId, cronogramaId,
                        titulo: $('#nt-titulo').value.trim(), descricao: $('#nt-desc').value.trim(),
                        responsavelEmail: respEmail, responsavelNome: getMembro(respEmail).nome,
                        prazo: $('#nt-prazo').value, prioridade: $('#nt-prio').value, status: $('#nt-status').value,
                        historicoPrazos: [], comentariosCount: 0,
                        criadoPorEmail: state.user.email, criadoPorNome: state.user.nome,
                        criadoEm: serverTimestamp(), atualizadoEm: serverTimestamp()
                    };
                    const ref = await addDoc(collection(db, 'tarefas'), dados);
                    await logAtividade(ref.id, `criou a tarefa e atribuiu a ${dados.responsavelNome} (prazo ${fmtBR(dados.prazo)})`);
                    fecharModal(); toast('Tarefa criada.');
                    await notificarAtribuicao(dados, getProjeto(projetoId));
                }
            } catch (err) {
                console.error(err);
                toast(err.message?.startsWith('Use um') ? err.message : 'Erro ao salvar. Verifique permissões e conexão.', 'erro');
                if (btn) { btn.disabled = false; btn.innerHTML = original; }
            }
        });

        // ==========================================================
        // DELEGAÇÃO DE EVENTOS
        // ==========================================================
        document.addEventListener('click', async (e) => {
            const el = e.target.closest('[data-action]');
            if (!el) return;
            const a = el.dataset.action; const d = el.dataset;
            switch (a) {
                case 'login':
                    $('#login-error').classList.add('hidden');
                    signInWithPopup(auth, provider).catch((err) => { console.error(err); mostrarErroLogin('Não foi possível entrar. Tente novamente.'); });
                    break;
                case 'logout': if (confirm('Deseja sair?')) signOut(auth); break;
                case 'nav': navegar(d.view); break;
                case 'abrir-projeto': navegar('projeto', d.id); break;
                case 'abrir-tarefa': abrirDrawer(d.id); break;
                case 'fechar-drawer': fecharDrawer(); break;
                case 'fechar-modal': fecharModal(); break;
                case 'novo-projeto': modalProjeto(); break;
                case 'novo-cronograma': modalCronograma(d.projeto); break;
                case 'novo-membro': modalMembro(); break;
                case 'nova-tarefa': modalTarefa(d.projeto || '', d.cron || ''); break;
                case 'mudar-status': await moverStatus(d.id, d.status); break;
                case 'toggle-concluidas': state.minhasMostrarConcluidas = !state.minhasMostrarConcluidas; render(true); break;
                case 'ver-quadro': state.filtros = { projeto: d.projeto, resp: '', q: '' }; navegar('quadro'); break;
                case 'filtro-minhas': state.filtros.resp = state.user.email; navegar('quadro'); break;
                case 'limpar-filtros': state.filtros = { projeto: '', resp: '', q: '' }; navegar('quadro'); break;
                case 'salvar-tarefa': await salvarTarefa(d.id); break;
                case 'enviar-comentario': await enviarComentario(d.id); break;
                case 'excluir-tarefa': await excluirTarefa(d.id); break;
                case 'excluir-cronograma': await excluirCronograma(d.id); break;
                case 'excluir-projeto': await excluirProjeto(d.id); break;
                case 'arquivar-projeto': {
                    const p = getProjeto(d.id);
                    await updateDoc(doc(db, 'projetos', d.id), { status: p.status === 'arquivado' ? 'ativo' : 'arquivado' });
                    toast(p.status === 'arquivado' ? 'Projeto reativado.' : 'Projeto arquivado.');
                    break;
                }
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { if (!$('#modal').classList.contains('hidden')) fecharModal(); else fecharDrawer(); }
            if (e.target.id === 'dt-comentario' && e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault(); if (state.drawerTaskId) enviarComentario(state.drawerTaskId);
            }
        });

        document.addEventListener('input', (e) => {
            if (e.target.id === 'f-q') { state.filtros.q = e.target.value; $('#board').innerHTML = boardHTML(); }
        });

        document.addEventListener('change', (e) => {
            const id = e.target.id;
            if (id === 'f-projeto') { state.filtros.projeto = e.target.value; $('#board').innerHTML = boardHTML(); }
            if (id === 'f-resp') { state.filtros.resp = e.target.value; $('#board').innerHTML = boardHTML(); }
            if (id === 'nt-projeto') {
                $('#nt-cron').innerHTML = optionsCron(e.target.value) || '<option value="">Geral (será criado)</option>';
            }
            if (id === 'dt-prazo') {
                const t = getTarefa(state.drawerTaskId);
                $('#dt-motivo-wrap').classList.toggle('hidden', !t || e.target.value === t.prazo);
            }
        });

        // Drag & drop do Kanban
        document.addEventListener('dragstart', (e) => {
            const card = e.target.closest?.('.task-card'); if (!card) return;
            e.dataTransfer.setData('text/plain', card.dataset.id);
            e.dataTransfer.effectAllowed = 'move';
            setTimeout(() => card.classList.add('dragging'), 0);
        });
        document.addEventListener('dragend', (e) => {
            e.target.closest?.('.task-card')?.classList.remove('dragging');
            document.querySelectorAll('.drop-over').forEach(x => x.classList.remove('drop-over'));
        });
        document.addEventListener('dragover', (e) => {
            const z = e.target.closest?.('[data-drop]'); if (!z) return;
            e.preventDefault();
            document.querySelectorAll('.drop-over').forEach(x => { if (x !== z) x.classList.remove('drop-over'); });
            z.classList.add('drop-over');
        });
        document.addEventListener('drop', async (e) => {
            const z = e.target.closest?.('[data-drop]'); if (!z) return;
            e.preventDefault(); z.classList.remove('drop-over');
            const id = e.dataTransfer.getData('text/plain');
            if (id) await moverStatus(id, z.dataset.drop);
        });
    </script>
</body>
</html>
