<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle Gerencial - Leveros</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        verde1: '#002D32',
                        verde2: '#005A64',
                        azul: '#4CDDDD',
                        verde3: '#6FFFAF',
                        verde4: '#CEFFAE',
                        amarelo: '#FFCE00',
                        background: '#f8fafc',
                        surface: '#ffffff',
                        danger: '#ef4444' // Keeping red for potential error states
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .drag-over {
            background-color: #f1f5f9;
            border: 2px dashed #005A64;
        }
    </style>
</head>
<body class="bg-background text-gray-800 font-sans h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-verde1 text-white flex flex-col hidden md:flex z-20 shadow-lg">
        <div class="h-16 flex items-center px-6 border-b border-verde2">
            <i class="fa-solid fa-leaf text-azul text-xl mr-3"></i>
            <span class="font-bold text-lg">Leveros Flow</span>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="#" onclick="app.switchTab('dashboard')" id="nav-dashboard" class="nav-item flex items-center px-4 py-3 bg-verde2 text-azul rounded-lg transition-colors">
                <i class="fa-solid fa-house w-6"></i>
                <span class="font-medium">Dashboard</span>
            </a>
            <a href="#" onclick="app.switchTab('tasks')" id="nav-tasks" class="nav-item flex items-center px-4 py-3 text-gray-300 hover:bg-verde2 hover:text-white rounded-lg transition-colors">
                <i class="fa-solid fa-list-check w-6"></i>
                <span class="font-medium">Atividades</span>
            </a>
            <a href="#" onclick="app.openProjectModal()" class="flex items-center px-4 py-3 text-gray-300 hover:bg-verde2 hover:text-white rounded-lg transition-colors">
                <i class="fa-solid fa-folder-plus w-6"></i>
                <span class="font-medium">Novo Projeto</span>
            </a>
        </nav>
        <div class="p-4 border-t border-verde2 bg-verde1">
            <div class="flex items-center">
                <div class="w-10 h-10 rounded-full bg-azul text-verde1 flex items-center justify-center font-bold">
                    AS
                </div>
                <div class="ml-3">
                    <p class="text-sm font-medium text-white">Ariany Santos</p>
                    <p class="text-xs text-azul">Administrador</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <!-- Header -->
        <header class="h-16 bg-surface border-b border-gray-200 flex items-center justify-between px-6 z-10 shadow-sm">
            <div class="flex items-center md:hidden">
                <i class="fa-solid fa-leaf text-verde1 text-xl mr-2"></i>
                <span class="font-bold text-lg text-verde1">Leveros Flow</span>
            </div>
            <h1 id="page-title" class="text-xl font-semibold text-verde1 hidden md:block">Visão Geral</h1>
            <div class="flex items-center space-x-4">
                <button onclick="app.openModal()" class="bg-azul hover:bg-teal-400 text-verde1 px-4 py-2 rounded-lg text-sm font-bold transition-colors shadow-sm flex items-center">
                    <i class="fa-solid fa-plus mr-2"></i> Nova Atividade
                </button>
            </div>
        </header>

        <!-- Dynamic Content Area -->
        <div id="content-area" class="flex-1 overflow-y-auto p-6">
            <!-- Content injected via JS -->
        </div>
    </main>

    <!-- Modal Form (Task) -->
    <div id="task-modal" class="fixed inset-0 bg-verde1 bg-opacity-80 hidden flex items-center justify-center z-50 transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl mx-4 overflow-hidden max-h-[90vh] flex flex-col">
            <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-verde1 text-white">
                <h3 class="text-lg font-semibold">Distribuir Nova Atividade</h3>
                <button onclick="app.closeModal()" class="text-gray-300 hover:text-white transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div class="overflow-y-auto flex-1">
                <form id="task-form" class="p-6 space-y-4" onsubmit="app.submitTask(event)">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="md:col-span-2">
                            <label class="block text-sm font-bold text-verde1 mb-1">Título da Atividade</label>
                            <input type="text" id="task-title" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-azul focus:border-transparent">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-bold text-verde1 mb-1">Projeto</label>
                            <select id="task-project" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-azul">
                                <!-- Injected via JS -->
                            </select>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-bold text-verde1 mb-1">Responsável</label>
                            <select id="task-assignee" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-azul">
                                <!-- Injected via JS -->
                            </select>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-bold text-verde1 mb-1">Status Inicial</label>
                            <select id="task-status" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-azul">
                                <option value="pending">Pendente</option>
                                <option value="in-progress">Em Andamento</option>
                                <option value="validated">Validado</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-verde1 mb-1">Prazo de Entrega</label>
                            <input type="date" id="task-date" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-azul">
                        </div>

                        <div class="md:col-span-2">
                            <label class="block text-sm font-bold text-verde1 mb-1">Observações</label>
                            <textarea id="task-obs" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-azul" placeholder="Detalhes ou observações da atividade..."></textarea>
                        </div>

                        <div class="md:col-span-2">
                            <label class="block text-sm font-bold text-verde1 mb-1">Sugestões de Melhorias</label>
                            <textarea id="task-sug" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-azul" placeholder="Ideias para otimizar este processo..."></textarea>
                        </div>
                    </div>

                    <div class="pt-4 flex justify-end space-x-3 border-t border-gray-100 mt-6">
                        <button type="button" onclick="app.closeModal()" class="px-4 py-2 text-sm font-bold text-verde2 bg-gray-100 border border-gray-300 rounded-lg hover:bg-gray-200 focus:outline-none">
                            Cancelar
                        </button>
                        <button type="submit" class="px-4 py-2 text-sm font-bold text-verde1 bg-azul rounded-lg hover:bg-teal-400 focus:outline-none shadow">
                            Salvar Atividade
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Form (Project) -->
    <div id="project-modal" class="fixed inset-0 bg-verde1 bg-opacity-80 hidden flex items-center justify-center z-50 transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm mx-4 overflow-hidden flex flex-col">
            <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-verde2 text-white">
                <h3 class="text-lg font-semibold">Novo Projeto</h3>
                <button onclick="app.closeProjectModal()" class="text-gray-300 hover:text-white transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <form id="project-form" class="p-6 space-y-4" onsubmit="app.submitProject(event)">
                <div>
                    <label class="block text-sm font-bold text-verde1 mb-1">Nome do Projeto</label>
                    <input type="text" id="project-name" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-azul">
                </div>
                <div class="pt-4 flex justify-end space-x-3">
                    <button type="button" onclick="app.closeProjectModal()" class="px-4 py-2 text-sm font-bold text-verde2 bg-gray-100 border border-gray-300 rounded-lg hover:bg-gray-200 focus:outline-none">
                        Cancelar
                    </button>
                    <button type="submit" class="px-4 py-2 text-sm font-bold text-verde1 bg-azul rounded-lg hover:bg-teal-400 focus:outline-none shadow">
                        Adicionar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const app = {
            state: {
                currentTab: 'dashboard',
                users: ['Ariany Santos', 'Priscila Baldo', 'Matheus Alves', 'Alessandra Mincov'],
                projects: ['Otimização de Frota', 'Expansão B2B', 'Campanha Black Friday'],
                tasks: [
                    { id: 'T1', title: 'Mapeamento de Rotas', project: 'Otimização de Frota', assignee: 'Matheus Alves', status: 'pending', date: '2026-10-25', obs: 'Verificar planilhas antigas.', sug: 'Integrar API do Maps.' },
                    { id: 'T2', title: 'Análise de Concorrência', project: 'Expansão B2B', assignee: 'Priscila Baldo', status: 'in-progress', date: '2026-10-22', obs: '', sug: '' },
                    { id: 'T3', title: 'Revisão de Criativos', project: 'Campanha Black Friday', assignee: 'Ariany Santos', status: 'validated', date: '2026-10-18', obs: 'Aprovado pela diretoria.', sug: 'Criar templates no Figma.' },
                    { id: 'T4', title: 'Levantamento de Leads', project: 'Expansão B2B', assignee: 'Alessandra Mincov', status: 'pending', date: '2026-10-26', obs: '', sug: '' }
                ]
            },

            init() {
                this.render();
            },

            switchTab(tab) {
                this.state.currentTab = tab;
                document.querySelectorAll('.nav-item').forEach(el => {
                    el.classList.remove('bg-verde2', 'text-azul');
                    el.classList.add('text-gray-300');
                });
                const activeNav = document.getElementById(`nav-${tab}`);
                if(activeNav) {
                    activeNav.classList.remove('text-gray-300', 'hover:bg-verde2', 'hover:text-white');
                    activeNav.classList.add('bg-verde2', 'text-azul');
                }
                document.getElementById('page-title').innerText = tab === 'dashboard' ? 'Visão Geral' : 'Controle de Atividades (Kanban)';
                this.render();
            },

            render() {
                const contentArea = document.getElementById('content-area');
                if (this.state.currentTab === 'dashboard') {
                    contentArea.innerHTML = this.getDashboardHTML();
                } else if (this.state.currentTab === 'tasks') {
                    contentArea.innerHTML = this.getKanbanHTML();
                    this.setupDragAndDrop();
                }
            },

            getDashboardHTML() {
                const pending = this.state.tasks.filter(t => t.status === 'pending').length;
                const inProgress = this.state.tasks.filter(t => t.status === 'in-progress').length;
                const validated = this.state.tasks.filter(t => t.status === 'validated').length;
                const total = this.state.tasks.length;

                return `
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                        <div class="bg-white rounded-xl shadow-md p-6 border-l-4 border-verde1">
                            <div class="flex justify-between items-start">
                                <div><p class="text-sm font-bold text-gray-500">Total Atividades</p><h3 class="text-3xl font-black text-verde1 mt-1">${total}</h3></div>
                                <div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-verde1"><i class="fa-solid fa-layer-group"></i></div>
                            </div>
                        </div>
                        <div class="bg-white rounded-xl shadow-md p-6 border-l-4 border-amarelo">
                            <div class="flex justify-between items-start">
                                <div><p class="text-sm font-bold text-gray-500">Pendentes</p><h3 class="text-3xl font-black text-verde1 mt-1">${pending}</h3></div>
                                <div class="w-10 h-10 rounded-full bg-yellow-50 flex items-center justify-center text-yellow-600"><i class="fa-regular fa-clock"></i></div>
                            </div>
                        </div>
                        <div class="bg-white rounded-xl shadow-md p-6 border-l-4 border-azul">
                            <div class="flex justify-between items-start">
                                <div><p class="text-sm font-bold text-gray-500">Em Andamento</p><h3 class="text-3xl font-black text-verde1 mt-1">${inProgress}</h3></div>
                                <div class="w-10 h-10 rounded-full bg-teal-50 flex items-center justify-center text-teal-600"><i class="fa-solid fa-spinner"></i></div>
                            </div>
                        </div>
                        <div class="bg-white rounded-xl shadow-md p-6 border-l-4 border-verde3">
                            <div class="flex justify-between items-start">
                                <div><p class="text-sm font-bold text-gray-500">Validados</p><h3 class="text-3xl font-black text-verde1 mt-1">${validated}</h3></div>
                                <div class="w-10 h-10 rounded-full bg-green-50 flex items-center justify-center text-green-600"><i class="fa-solid fa-check-double"></i></div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-xl shadow-md border border-gray-100 overflow-hidden">
                        <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                            <h3 class="text-lg font-bold text-verde1">Atividades Recentes</h3>
                            <button onclick="app.switchTab('tasks')" class="text-sm text-verde2 hover:text-azul font-bold">Ver Kanban</button>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-verde1 text-white text-sm uppercase tracking-wider">
                                        <th class="px-6 py-3 font-medium">Atividade</th>
                                        <th class="px-6 py-3 font-medium">Projeto</th>
                                        <th class="px-6 py-3 font-medium">Responsável</th>
                                        <th class="px-6 py-3 font-medium">Status</th>
                                        <th class="px-6 py-3 font-medium text-right">Prazo</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-200">
                                    ${this.state.tasks.slice(0,5).map(task => `
                                        <tr class="hover:bg-gray-50 transition-colors">
                                            <td class="px-6 py-4 text-sm font-bold text-verde1">${task.title}</td>
                                            <td class="px-6 py-4 text-sm text-gray-600">${task.project}</td>
                                            <td class="px-6 py-4 text-sm text-gray-600 flex items-center">
                                                <div class="w-6 h-6 rounded-full bg-verde2 text-azul flex items-center justify-center text-xs mr-2 font-bold">${task.assignee.charAt(0)}</div>
                                                ${task.assignee}
                                            </td>
                                            <td class="px-6 py-4 text-sm">${this.getStatusBadge(task.status)}</td>
                                            <td class="px-6 py-4 text-sm text-gray-500 text-right font-medium">${this.formatDate(task.date)}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            },

            getKanbanHTML() {
                const getColumnTasks = (status) => this.state.tasks.filter(t => t.status === status).map(t => this.getTaskCardHTML(t)).join('');
                return `
                    <div class="flex flex-col md:flex-row gap-6 h-full pb-4">
                        <!-- Pendentes -->
                        <div class="flex-1 flex flex-col bg-gray-50 rounded-xl overflow-hidden border border-gray-200 shadow-sm">
                            <div class="p-4 border-b-4 border-amarelo bg-white flex justify-between items-center">
                                <h3 class="font-bold text-verde1 flex items-center">Pendentes</h3>
                                <span class="bg-amarelo text-verde1 text-xs font-black px-2 py-1 rounded">${this.state.tasks.filter(t=>t.status==='pending').length}</span>
                            </div>
                            <div class="p-4 flex-1 overflow-y-auto space-y-4 kanban-column" data-status="pending">
                                ${getColumnTasks('pending')}
                            </div>
                        </div>

                        <!-- Em Andamento -->
                        <div class="flex-1 flex flex-col bg-gray-50 rounded-xl overflow-hidden border border-gray-200 shadow-sm">
                            <div class="p-4 border-b-4 border-azul bg-white flex justify-between items-center">
                                <h3 class="font-bold text-verde1 flex items-center">Em Andamento</h3>
                                <span class="bg-azul text-verde1 text-xs font-black px-2 py-1 rounded">${this.state.tasks.filter(t=>t.status==='in-progress').length}</span>
                            </div>
                            <div class="p-4 flex-1 overflow-y-auto space-y-4 kanban-column" data-status="in-progress">
                                ${getColumnTasks('in-progress')}
                            </div>
                        </div>

                        <!-- Validados -->
                        <div class="flex-1 flex flex-col bg-gray-50 rounded-xl overflow-hidden border border-gray-200 shadow-sm">
                            <div class="p-4 border-b-4 border-verde3 bg-white flex justify-between items-center">
                                <h3 class="font-bold text-verde1 flex items-center">Validados</h3>
                                <span class="bg-verde3 text-verde1 text-xs font-black px-2 py-1 rounded">${this.state.tasks.filter(t=>t.status==='validated').length}</span>
                            </div>
                            <div class="p-4 flex-1 overflow-y-auto space-y-4 kanban-column" data-status="validated">
                                ${getColumnTasks('validated')}
                            </div>
                        </div>
                    </div>
                `;
            },

            getTaskCardHTML(task) {
                let extraContent = '';
                if(task.obs) extraContent += `<p class="text-xs text-gray-500 mt-2 bg-gray-50 p-1.5 rounded"><span class="font-bold">Obs:</span> ${task.obs}</p>`;
                if(task.sug) extraContent += `<p class="text-xs text-verde2 mt-1 bg-verde4 p-1.5 rounded bg-opacity-30"><span class="font-bold">Sugestão:</span> ${task.sug}</p>`;

                return `
                    <div class="bg-white p-4 rounded-lg shadow border border-gray-200 cursor-grab hover:shadow-md transition-shadow task-card flex flex-col" draggable="true" data-id="${task.id}">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-[10px] font-bold px-2 py-1 bg-gray-100 text-verde2 rounded uppercase">${task.project}</span>
                            <span class="text-[10px] text-gray-400 font-bold">${this.formatDate(task.date)}</span>
                        </div>
                        <h4 class="font-bold text-verde1 mb-2 leading-snug">${task.title}</h4>
                        ${extraContent}
                        <div class="flex justify-between items-center mt-auto pt-3 border-t border-gray-100">
                            <div class="flex items-center" title="${task.assignee}">
                                <div class="w-6 h-6 rounded-full bg-verde1 text-white flex items-center justify-center text-xs font-bold">${task.assignee.charAt(0)}</div>
                                <span class="text-xs font-bold text-verde1 ml-2 truncate max-w-[100px]">${task.assignee.split(' ')[0]}</span>
                            </div>
                            <div class="flex space-x-1">
                                ${task.status !== 'pending' ? `<button onclick="app.moveTask('${task.id}', 'pending')" class="w-6 h-6 rounded bg-gray-100 text-gray-500 hover:bg-amarelo hover:text-verde1 flex items-center justify-center"><i class="fa-solid fa-arrow-left text-xs"></i></button>` : ''}
                                ${task.status === 'pending' ? `<button onclick="app.moveTask('${task.id}', 'in-progress')" class="w-6 h-6 rounded bg-gray-100 text-gray-500 hover:bg-azul hover:text-verde1 flex items-center justify-center"><i class="fa-solid fa-arrow-right text-xs"></i></button>` : ''}
                                ${task.status === 'in-progress' ? `<button onclick="app.moveTask('${task.id}', 'validated')" class="w-6 h-6 rounded bg-gray-100 text-gray-500 hover:bg-verde3 hover:text-verde1 flex items-center justify-center"><i class="fa-solid fa-check text-xs"></i></button>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            },

            getStatusBadge(status) {
                switch(status) {
                    case 'pending': return '<span class="px-2 py-1 bg-yellow-50 text-yellow-700 border border-amarelo rounded text-xs font-bold">Pendente</span>';
                    case 'in-progress': return '<span class="px-2 py-1 bg-teal-50 text-teal-700 border border-azul rounded text-xs font-bold">Em Andamento</span>';
                    case 'validated': return '<span class="px-2 py-1 bg-green-50 text-green-700 border border-verde3 rounded text-xs font-bold">Validado</span>';
                }
            },

            formatDate(dateString) {
                const options = { day: '2-digit', month: '2-digit', year: 'numeric' };
                return new Date(dateString).toLocaleDateString('pt-BR', options);
            },

            populateDropdowns() {
                const projSelect = document.getElementById('task-project');
                projSelect.innerHTML = this.state.projects.map(p => `<option value="${p}">${p}</option>`).join('');
                
                const userSelect = document.getElementById('task-assignee');
                userSelect.innerHTML = this.state.users.map(u => `<option value="${u}">${u}</option>`).join('');
            },

            openModal() {
                this.populateDropdowns();
                document.getElementById('task-date').valueAsDate = new Date();
                document.getElementById('task-modal').classList.remove('hidden');
            },
            closeModal() {
                document.getElementById('task-modal').classList.add('hidden');
                document.getElementById('task-form').reset();
            },

            openProjectModal() {
                document.getElementById('project-modal').classList.remove('hidden');
            },
            closeProjectModal() {
                document.getElementById('project-modal').classList.add('hidden');
                document.getElementById('project-form').reset();
            },

            submitTask(e) {
                e.preventDefault();
                const newTask = {
                    id: 'T' + (this.state.tasks.length + 1),
                    title: document.getElementById('task-title').value,
                    project: document.getElementById('task-project').value,
                    assignee: document.getElementById('task-assignee').value,
                    status: document.getElementById('task-status').value,
                    date: document.getElementById('task-date').value,
                    obs: document.getElementById('task-obs').value,
                    sug: document.getElementById('task-sug').value
                };
                this.state.tasks.unshift(newTask);
                this.closeModal();
                if(this.state.currentTab !== 'tasks') this.switchTab('tasks');
                else this.render();
            },

            submitProject(e) {
                e.preventDefault();
                const newProject = document.getElementById('project-name').value;
                if(newProject && !this.state.projects.includes(newProject)) {
                    this.state.projects.push(newProject);
                }
                this.closeProjectModal();
                alert(`Projeto "${newProject}" criado com sucesso!`);
            },

            moveTask(id, newStatus) {
                const task = this.state.tasks.find(t => t.id === id);
                if(task) { task.status = newStatus; this.render(); }
            },

            setupDragAndDrop() {
                const cards = document.querySelectorAll('.task-card');
                const columns = document.querySelectorAll('.kanban-column');

                cards.forEach(card => {
                    card.addEventListener('dragstart', (e) => {
                        e.dataTransfer.setData('text/plain', card.dataset.id);
                        setTimeout(() => card.classList.add('opacity-50'), 0);
                    });
                    card.addEventListener('dragend', () => {
                        card.classList.remove('opacity-50');
                        columns.forEach(col => col.classList.remove('drag-over'));
                    });
                });

                columns.forEach(col => {
                    col.addEventListener('dragover', (e) => {
                        e.preventDefault(); col.classList.add('drag-over');
                    });
                    col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
                    col.addEventListener('drop', (e) => {
                        e.preventDefault();
                        col.classList.remove('drag-over');
                        const id = e.dataTransfer.getData('text/plain');
                        this.moveTask(id, col.dataset.status);
                    });
                });
            }
        };

        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
