                        <div class="flex items-center justify-between mt-4 flex-wrap gap-2">
                            <span class="text-[11px] text-gray-400">Criada por ${esc(getMembro(t.criadoPorEmail).nome)} em ${t.criadoEm ? fmtDataHora(tsMillis(t.criadoEm)) : '—'}${hist ? ` · prazo alterado ${hist}×` : ''}</span>
                            ${atuar ? `<button data-action="salvar-tarefa" data-id="${esc(t.id)}" class="px-4 py-2 bg-leveros-verde1 text-white rounded-lg hover:bg-leveros-verde2 font-medium text-sm"><i class="fas fa-save mr-1"></i> Salvar alterações</button>` : ''}
                        </div>
                    </div>
                    <div class="p-5 border-b" id="dr-colab">${colabSectionHTML(t)}</div>
                    <div class="p-5">
                        <h4 class="font-bold text-gray-700 mb-3 text-sm"><i class="far fa-comments text-leveros-verde2 mr-1"></i> Observações e questionamentos</h4>
                        <div id="feed" class="flex flex-col gap-3 mb-3"><div class="loader" style="width:24px;height:24px;border-width:3px"></div></div>
                    </div>
                </div>
                <div class="border-t p-3 bg-white shrink-0">
                    <div class="flex gap-2 items-end">
                        <textarea id="dt-comentario" rows="2" class="inp resize-none" placeholder="Escreva uma observação ou pergunta... (Enter envia, Shift+Enter quebra linha)"></textarea>
                        <button data-action="enviar-comentario" data-id="${esc(t.id)}" class="h-10 w-10 shrink-0 bg-leveros-azul text-leveros-verde1 rounded-lg hover:bg-leveros-verde3 font-bold" title="Enviar"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>`;
            const d = $('#drawer'); d.classList.remove('hidden');

            if (state.unsubFeed) state.unsubFeed();
            state.unsubFeed = onSnapshot(query(collection(db, 'tarefas', id, 'comentarios'), orderBy('criadoEm', 'asc')), (snap) => {
                const feed = $('#feed'); if (!feed || state.drawerTaskId !== id) return;
                const itens = snap.docs.map(x => ({ id: x.id, ...x.data() }));
                feed.innerHTML = itens.length ? itens.map(feedItemHTML).join('') : '<p class="text-xs text-gray-400 text-center py-4">Nenhuma observação ainda. Use este espaço no lugar das threads de e-mail.</p>';
                const cont = feed.closest('.overflow-y-auto'); if (cont) cont.scrollTop = cont.scrollHeight;
            }, (err) => { console.error(err); $('#feed').innerHTML = '<p class="text-xs text-red-500">Não foi possível carregar o histórico (verifique as regras do Firestore).</p>'; });
        }

        function feedItemHTML(c) {
            const quando = fmtDataHora(tsMillis(c.criadoEm));
            if (c.tipo === 'sistema') {
                return `<div class="flex items-start gap-2 text-xs text-gray-500 bg-gray-50 rounded-lg px-3 py-2"><i class="fas fa-clock-rotate-left mt-0.5 text-gray-400"></i><div><span class="font-semibold">${esc(getMembro(c.autorEmail).nome)}</span> ${esc(c.texto)} <span class="text-gray-400">· ${quando}</span></div></div>`;
            }
            const minha = c.autorEmail === state.user.email;
            return `<div class="flex gap-2.5 ${minha ? 'flex-row-reverse' : ''}">
                ${avatar(c.autorEmail, 'w-8 h-8 text-xs')}
                <div class="max-w-[80%] ${minha ? 'bg-leveros-verde4/60' : 'bg-gray-100'} rounded-xl px-3 py-2">
                    <div class="text-[11px] font-bold text-leveros-verde2">${esc(getMembro(c.autorEmail).nome)} <span class="text-gray-400 font-normal">· ${quando}</span></div>
                    <div class="text-sm text-gray-800 whitespace-pre-wrap break-words">${esc(c.texto)}</div>
                </div></div>`;
        }

        function fecharDrawer() {
            state.drawerTaskId = null;
            if (state.unsubFeed) { state.unsubFeed(); state.unsubFeed = null; }
            const d = $('#drawer'); if (d) d.classList.add('hidden');
        }

        // ==========================================================
        // PERMISSÕES, COLABORAÇÃO E SOLICITAÇÕES
        // ==========================================================
        const ehResponsavel = (t) => t.responsavelEmail === state.user?.email;
        const ehColaborador = (t) => (t.colaboradoresEmails || []).includes(state.user?.email);
        const podeEditarTudo = (t) => ehResponsavel(t) || isAdmin();
        const podeAtuar = (t) => podeEditarTudo(t) || ehColaborador(t);
        const permKey = (t) => `${podeEditarTudo(t) ? 1 : 0}${podeAtuar(t) ? 1 : 0}`;
        const solicitacoesDa = (tid) => state.solicitacoes.filter(x => x.tarefaId === tid).sort((a, b) => tsMillis(a.criadoEm) - tsMillis(b.criadoEm));
        const solicitacoesRecebidas = () => state.solicitacoes.filter(x => { if (x.status !== 'pendente') return false; const t = getTarefa(x.tarefaId); return t && ehResponsavel(t); });
        const SOL_TIPOS = { prazo: 'Alterar o prazo', status: 'Alterar o status', reatribuir: 'Reatribuir a tarefa', colaboracao: 'Colaborar na tarefa' };

        function descSolicitacao(x, t) {
            if (x.tipo === 'prazo') return `alterar o prazo de ${fmtBR(t?.prazo)} para ${fmtBR(x.novoPrazo)}`;
            if (x.tipo === 'status') return `mudar o status de "${t?.status}" para "${x.novoStatus}"`;
            if (x.tipo === 'reatribuir') return `passar a tarefa para ${getMembro(x.novoResponsavelEmail).nome}`;
            if (x.tipo === 'colaboracao') return 'participar desta tarefa como colaborador(a)';
            return 'uma alteração';
        }

        function solicitacaoItemHTML(x, comTarefa = false) {
            const t = getTarefa(x.tarefaId); if (!t) return '';
            const minha = x.deEmail === state.user.email;
            const pode = podeEditarTudo(t);
            return `<div class="flex items-start gap-3 bg-yellow-50 border border-yellow-200 rounded-lg p-3">
                ${avatar(x.deEmail, 'w-8 h-8 text-xs')}
                <div class="flex-1 min-w-0 text-sm">
                    <div><span class="font-semibold">${esc(minha ? 'Você' : getMembro(x.deEmail).nome)}</span> ${minha ? 'pediu' : 'pede'} para ${esc(descSolicitacao(x, t))}</div>
                    ${comTarefa ? `<button data-action="abrir-tarefa" data-id="${esc(t.id)}" class="text-xs text-leveros-verde2 font-semibold hover:underline text-left">${esc(t.titulo)}</button>` : ''}
                    ${x.mensagem ? `<div class="text-xs text-gray-600 mt-1 italic">“${esc(x.mensagem)}”</div>` : ''}
                    ${!pode ? `<div class="text-[11px] text-gray-400 mt-1">Aguardando resposta de ${esc(getMembro(t.responsavelEmail).nome)}</div>` : ''}
                </div>
                <div class="flex flex-col sm:flex-row gap-1.5 shrink-0">
                    ${pode ? `<button data-action="responder-sol" data-id="${esc(x.id)}" data-aceitar="1" class="text-xs px-2.5 py-1 rounded-lg bg-green-600 text-white font-semibold hover:bg-green-700">Aceitar</button>
                    <button data-action="responder-sol" data-id="${esc(x.id)}" data-aceitar="0" class="text-xs px-2.5 py-1 rounded-lg border border-gray-300 text-gray-700 font-semibold hover:bg-gray-100">Recusar</button>` : ''}
                    ${minha ? `<button data-action="cancelar-sol" data-id="${esc(x.id)}" class="text-xs px-2.5 py-1 rounded-lg border border-red-200 text-red-500 hover:bg-red-50">Cancelar</button>` : ''}
                </div>
            </div>`;
        }

        function solicitacoesPainelHTML() {
            const rec = solicitacoesRecebidas().sort((a, b) => tsMillis(a.criadoEm) - tsMillis(b.criadoEm));
            const env = state.solicitacoes.filter(x => x.status === 'pendente' && x.deEmail === state.user.email && !rec.includes(x));
            if (!rec.length && !env.length) return '';
            return `<div class="mb-6 flex flex-col gap-4">
                ${rec.length ? `<section><h3 class="font-bold text-yellow-700 mb-2 text-sm">📨 Solicitações aguardando sua resposta <span class="text-gray-400 font-normal">(${rec.length})</span></h3><div class="flex flex-col gap-2">${rec.map(x => solicitacaoItemHTML(x, true)).join('')}</div></section>` : ''}
                ${env.length ? `<section><h3 class="font-bold text-gray-500 mb-2 text-sm">⏳ Suas solicitações pendentes <span class="font-normal">(${env.length})</span></h3><div class="flex flex-col gap-2">${env.map(x => solicitacaoItemHTML(x, true)).join('')}</div></section>` : ''}
            </div>`;
        }

        function colabSectionHTML(t) {
            const tudo = podeEditarTudo(t), atuar = podeAtuar(t);
            const colabs = t.colaboradoresEmails || [];
            const todas = solicitacoesDa(t.id);
            const pend = todas.filter(x => x.status === 'pendente');
            const hist = todas.filter(x => x.status !== 'pendente').slice(-3).reverse();
            const candidatos = state.membros.filter(m => m.email !== t.responsavelEmail && !colabs.includes(m.email)).sort((a, b) => a.nome.localeCompare(b.nome));
            const chip = (email, papel, removivel) => `<span class="inline-flex items-center gap-1.5 bg-gray-100 rounded-full pl-1 pr-2.5 py-1 text-xs">${avatar(email, 'w-5 h-5 text-[9px]')}<span class="font-semibold">${esc(primeiroNome(getMembro(email).nome))}</span><span class="text-gray-400">${papel}</span>${removivel ? `<button data-action="remover-colab" data-id="${esc(t.id)}" data-email="${esc(email)}" class="text-gray-400 hover:text-red-500 ml-1" title="Remover colaborador"><i class="fas fa-times"></i></button>` : ''}</span>`;
            return `
                <h4 class="font-bold text-gray-700 mb-3 text-sm"><i class="fas fa-user-group text-leveros-verde2 mr-1"></i> Colaboração</h4>
                <div class="flex flex-wrap gap-2 mb-3">${chip(t.responsavelEmail, 'responsável', false)}${colabs.map(e => chip(e, 'colaborador', tudo)).join('')}</div>
                ${tudo ? `<div class="flex gap-2 mb-3"><select id="dt-add-colab" class="inp"><option value="">Incluir colaborador...</option>${candidatos.map(m => `<option value="${esc(m.email)}">${esc(m.nome)}</option>`).join('')}</select><button data-action="add-colab" data-id="${esc(t.id)}" class="px-3 py-2 text-sm font-semibold bg-leveros-verde2 text-white rounded-lg hover:bg-leveros-verde1 shrink-0">Adicionar</button></div>` : ''}
                ${!tudo ? `<div class="flex gap-2 flex-wrap mb-3">
                    ${!atuar ? `<button data-action="solicitar" data-id="${esc(t.id)}" data-tipo="colaboracao" class="text-xs px-3 py-1.5 rounded-lg border border-indigo-300 text-indigo-700 font-semibold hover:bg-indigo-50"><i class="fas fa-hand mr-1"></i>Pedir para colaborar</button>` : ''}
                    <button data-action="solicitar" data-id="${esc(t.id)}" class="text-xs px-3 py-1.5 rounded-lg border border-gray-300 text-gray-700 font-semibold hover:bg-gray-50"><i class="fas fa-paper-plane mr-1"></i>Solicitar alteração ao responsável</button>
                </div>` : ''}
                ${pend.length ? `<div class="flex flex-col gap-2 mb-2">${pend.map(x => solicitacaoItemHTML(x)).join('')}</div>` : ''}
                ${hist.length ? `<div class="mt-2 text-[11px] text-gray-400 flex flex-col gap-0.5">${hist.map(x => `<div>${x.status === 'aceita' ? '✅' : '🚫'} ${esc(getMembro(x.deEmail).nome)}: ${esc(descSolicitacao(x, t))} — <b>${x.status === 'aceita' ? 'aceita' : 'recusada'}</b></div>`).join('')}</div>` : ''}`;
        }

        function modalSolicitacao(tarefaId, tipoInicial = '') {
            const t = getTarefa(tarefaId); if (!t) return;
            const atuar = podeAtuar(t);
            const tipos = atuar ? ['reatribuir'] : ['prazo', 'status', 'reatribuir', 'colaboracao'];
            const tipo = tipos.includes(tipoInicial) ? tipoInicial : tipos[0];
            abrirModal('Solicitar ao responsável', `
                <input type="hidden" id="sl-tarefa" value="${esc(tarefaId)}">
                <p class="text-sm text-gray-600 mb-4">A tarefa <b>${esc(t.titulo)}</b> está com <b>${esc(getMembro(t.responsavelEmail).nome)}</b>. A mudança só será aplicada se ele(a) aceitar.</p>
                <div class="grid gap-4">
                    <div><label class="lbl">O que você precisa?</label><select id="sl-tipo" class="inp">${tipos.map(k => `<option value="${k}" ${k === tipo ? 'selected' : ''}>${SOL_TIPOS[k]}</option>`).join('')}</select></div>
                    <div id="sl-prazo-wrap"><label class="lbl">Novo prazo</label><input id="sl-prazo" type="date" class="inp" value="${esc(t.prazo || '')}"></div>
                    <div id="sl-status-wrap"><label class="lbl">Novo status</label><select id="sl-status" class="inp">${STATUS.map(x => `<option ${x === t.status ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
                    <div id="sl-resp-wrap"><label class="lbl">Passar para</label><select id="sl-resp" class="inp">${state.membros.filter(m => m.email !== t.responsavelEmail).sort((a, b) => a.nome.localeCompare(b.nome)).map(m => `<option value="${esc(m.email)}">${esc(m.nome)}</option>`).join('')}</select></div>
                    <div><label class="lbl">Mensagem / justificativa</label><textarea id="sl-msg" rows="3" class="inp" maxlength="500" placeholder="Explique o motivo para facilitar a decisão..."></textarea></div>
                </div>`, 'form-solicitacao', 'Enviar solicitação');
            atualizarCamposSolicitacao();
        }

        function atualizarCamposSolicitacao() {
            const tipo = $('#sl-tipo')?.value; if (!tipo) return;
            $('#sl-prazo-wrap').classList.toggle('hidden', tipo !== 'prazo');
            $('#sl-status-wrap').classList.toggle('hidden', tipo !== 'status');
            $('#sl-resp-wrap').classList.toggle('hidden', tipo !== 'reatribuir');
        }

        async function criarSolicitacao() {
            const tid = $('#sl-tarefa').value; const t = getTarefa(tid);
            if (!t) throw new Error('Tarefa não encontrada.');
            const tipo = $('#sl-tipo').value;
            const dados = { tarefaId: tid, tipo, deEmail: state.user.email, deNome: state.user.nome, status: 'pendente', mensagem: $('#sl-msg').value.trim(), criadoEm: serverTimestamp() };
            if (tipo === 'prazo') {
                dados.novoPrazo = $('#sl-prazo').value;
                if (!dados.novoPrazo || dados.novoPrazo === t.prazo) throw new Error('Informe um prazo diferente do atual.');
            } else if (tipo === 'status') {
                dados.novoStatus = $('#sl-status').value;
                if (dados.novoStatus === t.status) throw new Error('Escolha um status diferente do atual.');
            } else if (tipo === 'reatribuir') {
                dados.novoResponsavelEmail = $('#sl-resp').value;
                if (!dados.novoResponsavelEmail) throw new Error('Selecione para quem passar a tarefa.');
            } else if (tipo === 'colaboracao' && ehColaborador(t)) throw new Error('Você já colabora nesta tarefa.');
            if (state.solicitacoes.some(x => x.tarefaId === tid && x.deEmail === state.user.email && x.tipo === tipo && x.status === 'pendente')) throw new Error('Você já tem uma solicitação desse tipo pendente nesta tarefa.');
            await addDoc(collection(db, 'solicitacoes'), dados);
            fecharModal(); toast('Solicitação enviada ao responsável.');
        }

        async function responderSolicitacao(sid, aceitar) {
            const x = state.solicitacoes.find(v => v.id === sid); const t = x && getTarefa(x.tarefaId);
            if (!x || !t) return;
            if (!podeEditarTudo(t)) return toast('Apenas o responsável pode responder.', 'erro');
            const nomeDe = getMembro(x.deEmail).nome;
            let texto = `${aceitar ? 'aceitou' : 'recusou'} a solicitação de ${nomeDe}: ${descSolicitacao(x, t)}`;
            try {
                const b = writeBatch(db);
                b.update(doc(db, 'solicitacoes', sid), { status: aceitar ? 'aceita' : 'recusada', resolvidoPor: state.user.email, resolvidoEm: serverTimestamp() });
                let novoResp = null;
                if (aceitar) {
                    const upd = { atualizadoEm: serverTimestamp() };
                    if (x.tipo === 'prazo') {
                        upd.prazo = x.novoPrazo;
                        upd.historicoPrazos = arrayUnion({ de: t.prazo || '', para: x.novoPrazo, por: x.deEmail, em: Date.now(), motivo: x.mensagem || '' });
                    } else if (x.tipo === 'status') upd.status = x.novoStatus;
                    else if (x.tipo === 'reatribuir') {
                        novoResp = x.novoResponsavelEmail;
                        upd.responsavelEmail = novoResp; upd.responsavelNome = getMembro(novoResp).nome;
                        upd.colaboradoresEmails = (t.colaboradoresEmails || []).filter(e => e !== novoResp);
                    } else if (x.tipo === 'colaboracao') upd.colaboradoresEmails = arrayUnion(x.deEmail);
                    b.update(doc(db, 'tarefas', t.id), upd);
                }
                b.set(doc(collection(db, 'tarefas', t.id, 'comentarios')), { tipo: 'sistema', texto, autorEmail: state.user.email, autorNome: state.user.nome, criadoEm: serverTimestamp() });
                await b.commit();
                toast(aceitar ? 'Solicitação aceita e aplicada.' : 'Solicitação recusada.');
                if (novoResp) await notificarAtribuicao({ ...t, responsavelEmail: novoResp }, getProjeto(t.projetoId));
            } catch (e) { console.error(e); toast('Não foi possível responder à solicitação.', 'erro'); }
        }

        async function cancelarSolicitacao(sid) {
            try { await deleteDoc(doc(db, 'solicitacoes', sid)); toast('Solicitação cancelada.'); }
            catch (e) { console.error(e); toast('Não foi possível cancelar.', 'erro'); }
        }

        async function adicionarColaborador(tid) {
            const t = getTarefa(tid); const email = $('#dt-add-colab')?.value;
            if (!t || !email || !podeEditarTudo(t)) return;
            try {
                const b = writeBatch(db);
                b.update(doc(db, 'tarefas', tid), { colaboradoresEmails: arrayUnion(email), atualizadoEm: serverTimestamp() });
                b.set(doc(collection(db, 'tarefas', tid, 'comentarios')), { tipo: 'sistema', texto: `incluiu ${getMembro(email).nome} como colaborador(a)`, autorEmail: state.user.email, autorNome: state.user.nome, criadoEm: serverTimestamp() });
                await b.commit(); toast('Colaborador incluído.');
            } catch (e) { console.error(e); toast('Não foi possível incluir o colaborador.', 'erro'); }
        }

        async function removerColaborador(tid, email) {
            const t = getTarefa(tid); if (!t || !podeEditarTudo(t)) return;
            try {
                const b = writeBatch(db);
                b.update(doc(db, 'tarefas', tid), { colaboradoresEmails: arrayRemove(email), atualizadoEm: serverTimestamp() });
                b.set(doc(collection(db, 'tarefas', tid, 'comentarios')), { tipo: 'sistema', texto: `removeu ${getMembro(email).nome} da colaboração`, autorEmail: state.user.email, autorNome: state.user.nome, criadoEm: serverTimestamp() });
                await b.commit(); toast('Colaborador removido.');
            } catch (e) { console.error(e); toast('Não foi possível remover o colaborador.', 'erro'); }
        }

        async function logAtividade(tarefaId, texto, tipo = 'sistema') {
            await addDoc(collection(db, 'tarefas', tarefaId, 'comentarios'), {
                tipo, texto, autorEmail: state.user.email, autorNome: state.user.nome, criadoEm: serverTimestamp()
            });
            if (tipo === 'comentario') await updateDoc(doc(db, 'tarefas', tarefaId), { comentariosCount: increment(1) });
        }

        async function notificarAtribuicao(tarefa, projeto) {
            const para = (tarefa.responsavelEmail || '').trim();
            if (!para) return;
            const membro = getMembro(para);
            const link = window.location.href.split('#')[0];
            const assunto = `[Projetos] Nova tarefa atribuída a você: ${tarefa.titulo}`;

            try {
                if (EMAIL_CONFIG.provider === 'emailjs') {
                    const c = EMAIL_CONFIG.emailjs;
                    const resp = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            service_id: c.serviceId, template_id: c.templateId, user_id: c.publicKey,
                            template_params: {
                                to_email: para,
                                to_name: membro.nome,
                                subject: assunto,
                                task_title: tarefa.titulo,
                                project_name: projeto?.nome || 'Projeto Geral',
                                due_date: fmtBR(tarefa.prazo),
                                assigned_by: state.user.nome,
                                description: tarefa.descricao || 'Sem detalhes adicionais.',
                                link: link
                            }
                        })
                    });
                    if (!resp.ok) throw new Error(await resp.text());
                    toast(`E-mail de atribuição enviado para ${membro.nome}`);
                }
            } catch (e) {
                console.error('Falha ao enviar e-mail via EmailJS:', e);
                toast('Tarefa salva, mas o e-mail de notificação falhou. Verifique o console (F12).', 'erro');
            }
        }

        async function moverStatus(id, novo) {
            const t = getTarefa(id);
            if (!t || t.status === novo) return;
            if (!podeAtuar(t)) return toast(`Somente ${getMembro(t.responsavelEmail).nome} (ou colaboradores) pode mudar o status. Abra a tarefa para enviar uma solicitação.`, 'info');
            try {
                const b = writeBatch(db);
                b.update(doc(db, 'tarefas', id), { status: novo, atualizadoEm: serverTimestamp() });
                b.set(doc(collection(db, 'tarefas', id, 'comentarios')), { tipo: 'sistema', texto: `moveu a tarefa de "${t.status}" para "${novo}"`, autorEmail: state.user.email, autorNome: state.user.nome, criadoEm: serverTimestamp() });
                await b.commit();
            } catch (e) { console.error(e); toast('Não foi possível mover a tarefa.', 'erro'); }
        }

        async function salvarTarefa(id) {
            const t = getTarefa(id); if (!t) return;
            const tudo = podeEditarTudo(t);
            if (!podeAtuar(t)) return toast('Você não tem permissão para alterar esta tarefa.', 'erro');
            const novo = {
                titulo: $('#dt-titulo').value.trim(), descricao: $('#dt-desc').value.trim(),
                prazo: $('#dt-prazo').value, prioridade: $('#dt-prio').value, status: $('#dt-status').value
            };
            if (tudo) {
                novo.responsavelEmail = $('#dt-resp').value;
                novo.responsavelNome = getMembro(novo.responsavelEmail).nome;
                novo.cronogramaId = $('#dt-cron').value;
            }
            if (!novo.titulo) return toast('O título não pode ficar vazio.', 'erro');
            if (!novo.prazo) return toast('Informe o prazo.', 'erro');
            const motivo = $('#dt-motivo').value.trim();
            const upd = { ...novo, atualizadoEm: serverTimestamp() };
            const logs = [];

            if (novo.prazo !== t.prazo) {
                upd.historicoPrazos = arrayUnion({ de: t.prazo || '', para: novo.prazo, por: state.user.email, em: Date.now(), motivo });
                logs.push(`alterou o prazo de ${fmtBR(t.prazo)} para ${fmtBR(novo.prazo)}${motivo ? ` — Motivo: ${motivo}` : ''}`);
            }
            const reatribuiu = tudo && novo.responsavelEmail !== t.responsavelEmail;
            if (reatribuiu) {
                logs.push(`reatribuiu a tarefa de ${getMembro(t.responsavelEmail).nome} para ${novo.responsavelNome}`);
                upd.colaboradoresEmails = (t.colaboradoresEmails || []).filter(e => e !== novo.responsavelEmail);
            }
            if (novo.status !== t.status) logs.push(`alterou o status de "${t.status}" para "${novo.status}"`);
            if (novo.prioridade !== (t.prioridade || 'Média')) logs.push(`alterou a prioridade para ${novo.prioridade}`);
            if (novo.titulo !== t.titulo) logs.push('renomeou a tarefa');
            if (novo.descricao !== (t.descricao || '')) logs.push('atualizou a descrição');

            try {
                const b = writeBatch(db);
                b.update(doc(db, 'tarefas', id), upd);
                logs.forEach(l => b.set(doc(collection(db, 'tarefas', id, 'comentarios')), { tipo: 'sistema', texto: l, autorEmail: state.user.email, autorNome: state.user.nome, criadoEm: serverTimestamp() }));
                await b.commit();
                if (reatribuiu) await notificarAtribuicao({ ...t, ...novo }, getProjeto(t.projetoId));
                toast('Tarefa atualizada.');
                $('#dt-motivo-wrap').classList.add('hidden'); $('#dt-motivo').value = '';
                $('#dr-situacao').innerHTML = badgeSituacao({ ...t, ...novo });
            } catch (e) { console.error(e); toast('Erro ao salvar a tarefa (verifique suas permissões).', 'erro'); }
        }

        async function enviarComentario(id) {
            const ta = $('#dt-comentario'); const texto = ta.value.trim();
            if (!texto) return;
            ta.value = ''; ta.focus();
            try { await logAtividade(id, texto, 'comentario'); }

        async function refsFilhosDasTarefas(tarefas) {
            const refs = [];
            for (const t of tarefas) {
                const snap = await getDocs(collection(db, 'tarefas', t.id, 'comentarios'));
                snap.docs.forEach(d => refs.push(d.ref));
                state.solicitacoes.filter(x => x.tarefaId === t.id).forEach(x => refs.push(doc(db, 'solicitacoes', x.id)));
            }
            return refs;
        }

        async function apagarEmLotes(refs) {
            for (let i = 0; i < refs.length; i += 400) {
                const b = writeBatch(db);
                refs.slice(i, i + 400).forEach(r => b.delete(r));
                await b.commit();
            }
        }

            const t = getTarefa(id); if (!t) return;
            if (!confirm(`Excluir a tarefa "${t.titulo}"? Essa ação não pode ser desfeita.`)) return;
            try {
                fecharDrawer();

        async function excluirCronograma(id) {
            const cr = state.cronogramas.find(c => c.id === id); if (!cr) return;
            const ts = state.tarefas.filter(t => t.cronogramaId === id);
            if (!confirm(`Excluir o cronograma "${cr.nome}" e suas ${ts.length} tarefa(s)?`)) return;
            try {
                if (ts.some(t => t.id === state.drawerTaskId)) fecharDrawer();
                const filhos = await refsFilhosDasTarefas(ts);
                await apagarEmLotes([...filhos, ...ts.map(t => doc(db, 'tarefas', t.id)), doc(db, 'cronogramas', id)]);
                toast('Cronograma excluído.');
            } catch (e) { console.error(e); toast('Sem permissão para excluir tudo isso.', 'erro'); }

        async function excluirProjeto(id) {
            const p = getProjeto(id); if (!p) return;
            const ts = state.tarefas.filter(t => t.projetoId === id);
            const cs = state.cronogramas.filter(c => c.projetoId === id);
            if (!confirm(`Excluir o projeto "${p.nome}" com ${cs.length} cronograma(s) e ${ts.length} tarefa(s)? Essa ação não pode ser desfeita.`)) return;
            try {
                if (ts.some(t => t.id === state.drawerTaskId)) fecharDrawer();
                const filhos = await refsFilhosDasTarefas(ts);
                await apagarEmLotes([...filhos, ...ts.map(t => doc(db, 'tarefas', t.id)), ...cs.map(c => doc(db, 'cronogramas', c.id)), doc(db, 'projetos', id)]);
                toast('Projeto excluído.'); navegar('projetos');
            } catch (e) { console.error(e); toast('Sem permissão para excluir o projeto.', 'erro'); }
        }

        // EXPORTAÇÃO EXCEL

        function exportarRelatorioExcel() {
            if (!state.projetos.length && !state.tarefas.length && !state.rotinas.length) {
                return toast('Não há dados para exportar.', 'erro');
            }
            toast('Gerando relatório Excel...', 'info');

            // 1. Organizar os dados dos Projetos
            const dadosProjetos = state.projetos.map(p => ({
                'Nome do Projeto': p.nome,
                'Status': p.status === 'arquivado' ? 'Arquivado' : 'Ativo',
                'Data Início': fmtBR(p.inicio),
                'Qual a dor?': p.dor || '-',
                'O que queremos sanar?': p.sanar || '-',
                'KPI a medir': p.kpi || '-',
                'Criado por': p.criadoPorEmail
            }));

            // 2. Organizar os dados das Tarefas
            const dadosTarefas = state.tarefas.map(t => {
                const p = getProjeto(t.projetoId);
                return {
                    'Projeto': p ? p.nome : 'Sem projeto',
                    'Título da Tarefa': t.titulo,
                    'Descrição': t.descricao || '',
                    'Status': t.status,
                    'Prazo': fmtBR(t.prazo),
                    'Prioridade': t.prioridade || 'Média',
                    'Responsável': t.responsavelEmail
                };
            });

            // 3. Organizar os dados das Rotinas Diárias
            const dadosRotinas = state.rotinas.map(r => ({
                'Data': fmtBR(r.data),
                'Categoria': r.categoria,
                'Status': r.status,
                'Título': r.titulo,
                'Responsável': r.responsavelEmail,
                'Observação': r.observacao || ''
            }));

            // Criar o arquivo (Workbook)
            const wb = XLSX.utils.book_new();

            // Adicionar as abas (Worksheets)
            if (dadosProjetos.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(dadosProjetos), "Projetos");
            if (dadosTarefas.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(dadosTarefas), "Tarefas");
            if (dadosRotinas.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(dadosRotinas), "Rotina Diária");

            // Fazer o download do arquivo
            XLSX.writeFile(wb, `Relatorio_CX_FLOW_${hojeISO()}.xlsx`);
            toast('Relatório exportado com sucesso!');
        }

        document.addEventListener('click', async (e) => {
            const el = e.target.closest('[data-action]');
            if (!el) return;
            const a = el.dataset.action; const d = el.dataset;
            switch (a) {
                case 'login':
                    $('#login-error').classList.add('hidden');
                    signInWithPopup(auth, provider).catch((err) => { console.error(err); mostrarErroLogin('Não foi possível entrar.'); });
                    break;
                case 'logout': if (confirm('Deseja sair?')) signOut(auth); break;
                case 'nav': navegar(d.view); break;
                case 'abrir-projeto': navegar('projeto', d.id); break;
                case 'abrir-tarefa': abrirDrawer(d.id); break;
                case 'fechar-drawer': fecharDrawer(); break;
                case 'fechar-modal': fecharModal(); break;
                case 'novo-projeto': modalProjeto(); break;
                case 'editar-projeto': modalEditarProjeto(d.id); break;
                case 'novo-cronograma': modalCronograma(d.projeto); break;
                case 'novo-membro': modalMembro(); break;
                case 'nova-tarefa': modalTarefa(d.projeto || '', d.cron || ''); break;
                case 'mudar-status': await moverStatus(d.id, d.status); break;
                case 'toggle-concluidas': state.minhasMostrarConcluidas = !state.minhasMostrarConcluidas; render(true); break;
                case 'ver-quadro': state.filtros = { ...state.filtros, projeto: d.projeto, resp: '', q: '', sit: '' }; navegar('quadro'); break;
                case 'filtrar-quadro': state.filtros = { ...state.filtros, projeto: d.projeto || '', resp: d.resp || '', q: '', sit: d.sit || '' }; navegar('quadro'); break;
                case 'filtro-minhas': state.filtros.resp = state.user.email; navegar('quadro'); break;
                case 'limpar-filtros': state.filtros = { ...state.filtros, projeto: '', resp: '', q: '', sit: '' }; navegar('quadro'); break;

                // EXPORTAÇÃO PARA EXCEL
                case 'exportar-excel':
                    exportarRelatorioExcel();
                    break;

                // EVENTOS ROTINA E FILTROS ROTINA
                case 'set-rotina-modo':
                    state.filtros.rotinaModo = d.modo;
                    if (d.modo === 'minhas') state.filtros.rotinaResp = state.user.email;
                    render(true);
                    break;
                case 'filtrar-rotina': state.filtros.rotinaResp = $('#filtro-rotina-resp').value; render(true); break;

                case 'toggle-ver-ocultas':
                    state.filtros.rotinaOcultas = !state.filtros.rotinaOcultas;
                    render(true);
                    break;

                case 'toggle-ocultar-rotina': {
                    const r = state.rotinas.find(x => x.id === d.id);
                    if (r) {
                        try {
                            const me = state.user.email;
                            const ocultaAgora = rotinaOcultaPara(r, me);
                            // Dono usa o campo "oculta"; colaborador oculta só para si em "ocultaPara"
                            const upd = r.responsavelEmail === me
                                ? { oculta: !ocultaAgora, atualizadoEm: serverTimestamp() }
                                : { ocultaPara: ocultaAgora ? arrayRemove(me) : arrayUnion(me) };
                            await updateDoc(doc(db, 'rotinas', d.id), upd);
                            toast(ocultaAgora ? 'Atividade visível novamente.' : 'Atividade oculta da lista.');
                        } catch (err) {
                            console.error(err);
                            toast('Erro ao ocultar atividade.', 'erro');
                        }
                    }
                    break;
                }

                case 'limpar-filtros-rotina':
                    state.filtros.rotinaBusca = '';
                    state.filtros.rotinaCat = '';
                    state.filtros.rotinaStatus = '';
                    state.filtros.rotinaOrdem = 'data-desc';
                    state.filtros.rotinaOcultas = false;
                    if($('#f-rotina-q')) $('#f-rotina-q').value = '';
                    render(true);
                    break;

                case 'toggle-rotina-form': {
                    const form = $('#form-rotina');
                    const icon = $('#icone-toggle-rotina');
                    if (form && icon) {
                        form.classList.toggle('hidden');
                        if (form.classList.contains('hidden')) {
                            icon.classList.replace('fa-chevron-up', 'fa-chevron-down');
                        } else {
                            icon.classList.replace('fa-chevron-down', 'fa-chevron-up');
                        }
                    }
                    break;
                }

                case 'solicitar': modalSolicitacao(d.id, d.tipo || ''); break;
                case 'responder-sol': await responderSolicitacao(d.id, d.aceitar === '1'); break;
                case 'cancelar-sol': await cancelarSolicitacao(d.id); break;
                case 'add-colab': await adicionarColaborador(d.id); break;
                case 'remover-colab': await removerColaborador(d.id, d.email); break;
                case 'salvar-tarefa': await salvarTarefa(d.id); break;
                case 'enviar-comentario': await enviarComentario(d.id); break;
                case 'excluir-tarefa': await excluirTarefa(d.id); break;
                case 'excluir-cronograma': await excluirCronograma(d.id); break;
                case 'excluir-projeto': await excluirProjeto(d.id); break;
                case 'excluir-membro': await excluirMembro(d.email); break;
                case 'editar-rotina': modalEditarRotina(d.id); break;
                case 'excluir-rotina': {
                    const r = state.rotinas.find(x => x.id === d.id);
                    if (!r || !podeGerirRotina(r)) { toast('Apenas o responsável pode excluir esta atividade.', 'erro'); break; }
                    if (confirm(rotinaColabs(r).length ? 'Esta atividade é compartilhada e será removida também da lista dos colaboradores. Excluir?' : 'Excluir esta atividade da rotina?')) {
                        try {

                            toast('Atividade avulsa excluída.');
                        } catch(err) { console.error(err); toast('Erro ao excluir rotina', 'erro'); }
                    }
                    break;
                }
                case 'rotina-toggle-status': {
                    const r = state.rotinas.find(x => x.id === d.id);
                    if(r) {
                        try {
                            const nv = r.status === 'Concluído' ? 'Pendente' : 'Concluído';

                    }

                case 'arquivar-projeto': {
                    const p = getProjeto(d.id);
                    await updateDoc(doc(db, 'projetos', d.id), { status: p.status === 'arquivado' ? 'ativo' : 'arquivado' });
                    toast(p.status === 'arquivado' ? 'Projeto reativado.' : 'Projeto arquivado.');
                    break;
                }
            }
        });

            const id = e.target.id;
            if (id === 'f-projeto') { state.filtros.projeto = e.target.value; $('#board').innerHTML = boardHTML(); }
            if (id === 'f-resp') { state.filtros.resp = e.target.value; $('#board').innerHTML = boardHTML(); }
            if (id === 'f-sit') { state.filtros.sit = e.target.value; $('#board').innerHTML = boardHTML(); }

            // FILTROS DA ROTINA
            if (id === 'f-rotina-cat') { state.filtros.rotinaCat = e.target.value; render(); }
            if (id === 'f-rotina-status') { state.filtros.rotinaStatus = e.target.value; render(); }
            if (id === 'f-rotina-ordem') { state.filtros.rotinaOrdem = e.target.value; render(); }

            if (id === 'sl-tipo') atualizarCamposSolicitacao();
            if (id === 'nt-projeto') {
                $('#nt-cron').innerHTML = optionsCron(e.target.value) || '<option value="">Geral (será criado)</option>';
            }
            // O responsável escolhido não pode ser também colaborador
            if (id === 'nt-resp') {
                document.querySelectorAll('input[name=nt-colab]').forEach(cb => {
                    const igual = cb.value === e.target.value;
                    if (igual) cb.checked = false;
                    cb.disabled = igual;
                    cb.closest('label').classList.toggle('opacity-40', igual);
                });
            }
            if (id === 'dt-prazo') {
                const t = getTarefa(state.drawerTaskId);
                $('#dt-motivo-wrap').classList.toggle('hidden', !t || e.target.value === t.prazo);
            }
        });

        // Drag & Drop
        document.addEventListener('dragstart', (e) => {
            const card = e.target.closest?.('.task-card'); if (!card) return;
            e.dataTransfer.setData('text/plain', card.dataset.id);
            e.dataTransfer.effectAllowed = 'move';
            setTimeout(() => card.classList.add('dragging'), 0);
        });
        document.addEventListener('dragend', (e) => {
            e.target.closest?.('.task-card')?.classList.remove('dragging');
            document.querySelectorAll('.drop-over').forEach(x => x.classList.remove('drop-over'));
        });
        document.addEventListener('dragover', (e) => {
            const z = e.target.closest?.('[data-drop]'); if (!z) return;
            e.preventDefault();
            document.querySelectorAll('.drop-over').forEach(x => { if (x !== z) x.classList.remove('drop-over'); });
            z.classList.add('drop-over');
        });
        document.addEventListener('drop', async (e) => {
            const z = e.target.closest?.('[data-drop]'); if (!z) return;
            e.preventDefault(); z.classList.remove('drop-over');
            const id = e.dataTransfer.getData('text/plain');
            if (id) await moverStatus(id, z.dataset.drop);
        });
    </script>
</body>
</html>
