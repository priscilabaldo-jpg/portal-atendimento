                            <button data-action="excluir-cronograma" data-id="${esc(cr.id)}" class="text-xs px-2.5 py-1.5 rounded-lg text-gray-400 hover:text-red-500 hover:bg-red-50" title="Excluir cronograma"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                    <div class="h-1 bg-gray-100"><div class="h-full" style="width:${pct}%;background:${c}"></div></div>
                    ${ts.length ? `<div class="divide-y overflow-x-auto">${ts.map(t => `
                        <div data-action="abrir-tarefa" data-id="${esc(t.id)}" class="px-5 py-2.5 flex items-center gap-3 hover:bg-gray-50 cursor-pointer min-w-[560px]">
                            <span class="text-[11px] px-1.5 py-0.5 rounded w-24 text-center shrink-0 ${STATUS_META[t.status]?.badge || ''}">${esc(t.status)}</span>
                            <span class="flex-1 text-sm font-medium truncate ${t.status === 'Validado' ? 'line-through text-gray-400' : ''}">${esc(t.titulo)}</span>
                            <span class="text-xs text-gray-500 w-20 shrink-0">${fmtBR(t.prazo)}</span>
                            <span class="shrink-0 w-44 text-right">${badgeSituacao(t)}</span>
                            <span class="shrink-0 flex items-center gap-1.5 w-28 text-xs text-gray-600">${avatar(t.responsavelEmail, 'w-6 h-6 text-[10px]')}<span class="truncate">${esc(primeiroNome(getMembro(t.responsavelEmail).nome))}</span></span>
                        </div>`).join('')}</div>` : '<p class="text-sm text-gray-400 text-center py-6">Nenhuma tarefa neste cronograma.</p>'}
                </section>`;
            }).join('');

            return `<div>
                <button data-action="nav" data-view="projetos" class="text-sm text-gray-500 hover:text-leveros-verde2 mb-3"><i class="fas fa-arrow-left mr-1"></i> Projetos</button>
                <div class="bg-white rounded-xl shadow-sm p-5 mb-5 border-t-4" style="border-color:${c}">
                    <div class="flex items-start justify-between gap-3 flex-wrap">
                        <div class="min-w-0 flex-1">
                            <h2 class="text-2xl font-bold text-leveros-verde1">${esc(p.nome)} ${p.status === 'arquivado' ? '<span class="text-xs bg-gray-200 text-gray-600 px-2 py-0.5 rounded-full align-middle">Arquivado</span>' : ''}</h2>
                            <p class="text-xs font-semibold text-gray-400 mt-1"><i class="far fa-calendar-alt mr-1"></i> Início: ${fmtBR(p.inicio) || 'Não definido'}</p>
                            <p class="text-sm text-gray-500 mt-1">${esc(p.descricao || 'Sem descrição')}</p>
                        </div>
                        <div class="flex gap-2 flex-wrap">
                            <button data-action="novo-cronograma" data-projeto="${esc(p.id)}" class="text-sm px-3 py-2 rounded-lg border border-gray-300 hover:bg-gray-50 font-semibold"><i class="fas fa-calendar-plus mr-1"></i> Cronograma</button>
                            <button data-action="ver-quadro" data-projeto="${esc(p.id)}" class="text-sm px-3 py-2 rounded-lg border border-leveros-verde2 text-leveros-verde2 hover:bg-leveros-verde4/40 font-semibold"><i class="fas fa-columns mr-1"></i> Ver no quadro</button>
                            ${donos ? `<button data-action="arquivar-projeto" data-id="${esc(p.id)}" class="text-sm px-3 py-2 rounded-lg border border-gray-300 hover:bg-gray-50" title="${p.status === 'arquivado' ? 'Reativar' : 'Arquivar'}"><i class="fas fa-box-archive"></i></button>
                            <button data-action="editar-projeto" data-id="${esc(p.id)}" class="text-sm px-3 py-2 rounded-lg border border-gray-300 hover:bg-gray-50" title="Editar Projeto"><i class="fas fa-edit"></i></button>
                            <button data-action="excluir-projeto" data-id="${esc(p.id)}" class="text-sm px-3 py-2 rounded-lg border border-red-200 text-red-500 hover:bg-red-50" title="Excluir projeto"><i class="fas fa-trash"></i></button>` : ''}
                        </div>
                    </div>

                    <div class="mt-4 grid grid-cols-1 md:grid-cols-3 gap-4 bg-gray-50 p-4 rounded-xl border border-gray-100">
                        <div>
                            <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wide mb-1"><i class="fas fa-heart-crack text-red-400 mr-1"></i> Qual a Dor?</h4>
                            <p class="text-sm text-gray-700">${esc(p.dor || 'Não informada')}</p>
                        </div>
                        <div>
                            <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wide mb-1"><i class="fas fa-bullseye text-blue-400 mr-1"></i> O Que Queremos Sanar?</h4>
                            <p class="text-sm text-gray-700">${esc(p.sanar || 'Não informado')}</p>
                        </div>
                        <div>
                            <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wide mb-1"><i class="fas fa-chart-line text-leveros-verde2 mr-1"></i> KPI a Medir</h4>
                            <p class="text-sm text-gray-700 font-semibold">${esc(p.kpi || 'Não informado')}</p>
                        </div>
                    </div>

                    <div class="mt-4 grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
                        <div data-action="filtrar-quadro" data-projeto="${esc(p.id)}" class="bg-gray-50 rounded-lg p-2 cursor-pointer hover:bg-leveros-verde4/40 transition-colors"><div class="text-xl font-bold text-leveros-verde1">${pr.pct}%</div><div class="text-[11px] text-gray-500">concluído</div></div>
                        <div data-action="filtrar-quadro" data-projeto="${esc(p.id)}" class="bg-gray-50 rounded-lg p-2 cursor-pointer hover:bg-leveros-verde4/40 transition-colors"><div class="text-xl font-bold text-leveros-verde1">${pr.total}</div><div class="text-[11px] text-gray-500">tarefas</div></div>
                        <div data-action="filtrar-quadro" data-projeto="${esc(p.id)}" data-sit="concluida" class="bg-gray-50 rounded-lg p-2 cursor-pointer hover:bg-leveros-verde4/40 transition-colors"><div class="text-xl font-bold text-leveros-verde1">${pr.feitas}</div><div class="text-[11px] text-gray-500">validadas</div></div>
                        <div data-action="filtrar-quadro" data-projeto="${esc(p.id)}" data-sit="atrasada" class="bg-gray-50 rounded-lg p-2 cursor-pointer hover:bg-red-50 transition-colors"><div class="text-xl font-bold ${pr.atrasadas ? 'text-red-600' : 'text-leveros-verde1'}">${pr.atrasadas}</div><div class="text-[11px] text-gray-500">atrasadas</div></div>
                    </div>
                    <div class="h-2.5 bg-gray-100 rounded-full overflow-hidden mt-4"><div class="h-full rounded-full transition-all" style="width:${pr.pct}%;background:${c}"></div></div>
                </div>
                ${cronHTML || '<div class="bg-white rounded-xl p-10 text-center text-gray-400">Este projeto ainda não tem cronogramas. Crie o primeiro no botão acima.</div>'}
            </div>`;
        }

        // ==========================================================
        // VIEW: ROTINA / AVULSAS (CARD LIST VIEW) — VISUAL ATUALIZADO
        // ==========================================================

        // Bloco de calendário (data inicial) — em destaque à esquerda do card
        function blocoDataRotina(r, concluido) {
            if (!r.data) return '';
            const dt = parseISO(r.data);
            const ehHoje = r.data === hojeISO();
            const base = concluido
                ? 'bg-gray-100 text-gray-400 border-gray-200'
                : ehHoje
                    ? 'bg-leveros-verde1 text-white border-leveros-verde1 shadow-md'
                    : 'bg-white text-leveros-verde1 border-gray-300';
            return `
            <div class="shrink-0 w-[62px] rounded-xl border-2 ${base} overflow-hidden text-center leading-none select-none" title="Data inicial: ${fmtBR(r.data)}">
                <div class="text-[9px] font-extrabold tracking-widest py-1 ${concluido ? 'bg-gray-200 text-gray-500' : ehHoje ? 'bg-leveros-amarelo text-leveros-verde1' : 'bg-leveros-verde2 text-white'}">${MESES_CURTOS[dt.getMonth()]}</div>
                <div class="text-2xl font-extrabold pt-1.5">${pad(dt.getDate())}</div>
                <div class="text-[10px] font-semibold uppercase pb-1.5 pt-0.5 ${concluido ? '' : ehHoje ? 'text-leveros-verde4' : 'text-gray-500'}">${ehHoje ? 'Hoje' : DIAS_SEMANA[dt.getDay()]}</div>
            </div>`;
        }

        // Caixa de PRAZO — destaque colorido conforme a urgência
        function renderPrazoRotina(r) {
            const caixa = (cls, icon, rotulo, linha1, linha2 = '') => `
                <div class="rounded-xl border px-3 py-2 min-w-[132px] text-left ${cls}" title="Prazo final">
                    <div class="text-[9px] font-extrabold uppercase tracking-widest opacity-70"><i class="fas ${icon} mr-1"></i>${rotulo}</div>
                    <div class="text-sm font-extrabold leading-tight">${linha1}</div>
                    ${linha2 ? `<div class="text-[11px] font-semibold leading-tight mt-0.5">${linha2}</div>` : ''}
                </div>`;

            if (r.status === 'Continua')
                return caixa('bg-teal-50 border-teal-200 text-teal-800', 'fa-sync-alt', 'Prazo', 'Contínua', 'sem data final');
            if (!r.prazo)
                return caixa('bg-gray-50 border-dashed border-gray-300 text-gray-400', 'fa-calendar', 'Prazo', 'Sem prazo');

            const dt = parseISO(r.prazo);
            const data = `${pad(dt.getDate())}/${pad(dt.getMonth() + 1)}/${dt.getFullYear()} <span class="font-semibold opacity-70">· ${DIAS_SEMANA[dt.getDay()]}</span>`;

            if (r.status === 'Concluído' || r.status === 'Concluído Parcial')
                return caixa('bg-gray-50 border-gray-200 text-gray-400', 'fa-check', 'Prazo', `<span class="line-through">${fmtBR(r.prazo)}</span>`, 'finalizada');

            const d = diasPara(r.prazo);
            if (d < 0)   return caixa('bg-red-600 border-red-700 text-white shadow-md', 'fa-exclamation-triangle', 'Prazo vencido', data, `Atrasada há ${-d} dia${-d > 1 ? 's' : ''}`);
            if (d === 0) return caixa('bg-leveros-amarelo border-yellow-500 text-leveros-verde1 shadow-md', 'fa-bolt', 'Prazo', data, 'VENCE HOJE');
            if (d === 1) return caixa('bg-yellow-100 border-yellow-400 text-yellow-900', 'fa-clock', 'Prazo', data, 'Vence amanhã');
            if (d <= 2)  return caixa('bg-yellow-50 border-yellow-300 text-yellow-800', 'fa-clock', 'Prazo', data, `Em ${d} dias`);
            return caixa('bg-green-50 border-green-200 text-green-800', 'fa-calendar-check', 'Prazo', data, `Em ${d} dias`);
        }

        function linhasTabelaRotina(lista, isMinhas, fResp) {
            if (!lista.length) return `<div class="p-10 text-center text-gray-400 bg-white rounded-xl border border-dashed border-gray-300 mt-2"><i class="fas fa-clipboard-check text-4xl mb-3 text-gray-300 block"></i>Nenhuma rotina pendente com estes filtros. Tudo limpo!</div>`;

            return lista.map(r => {
                const colabs = rotinaColabs(r);
                const oculta = rotinaOcultaPara(r, fResp);
                const compartilhada = r.responsavelEmail !== fResp;
                const concluido = r.status === 'Concluído' || r.status === 'Concluído Parcial';
                const cor = r.cor || '#9ca3af';

                // Faixa lateral = urgência (concluído = cinza, atrasado = vermelho, etc.)
                let faixa = cor;
                if (concluido) faixa = '#d1d5db';
                else if (r.status !== 'Continua' && r.prazo) {
                    const d = diasPara(r.prazo);
                    faixa = d < 0 ? '#dc2626' : d === 0 ? '#FFCE00' : d <= 2 ? '#facc15' : '#22c55e';
                }

                const fundo = (oculta || concluido) ? 'bg-gray-50 opacity-75' : 'bg-white';
                const titulo = concluido ? 'line-through text-gray-400' : 'text-gray-800';
                const btn = 'w-8 h-8 flex items-center justify-center rounded-lg text-gray-400 transition-colors';

                const btnOcultar = isMinhas ? `<button data-action="toggle-ocultar-rotina" data-id="${esc(r.id)}" class="${btn} hover:text-orange-500 hover:bg-orange-50" title="${oculta ? 'Mostrar Atividade' : 'Ocultar Atividade'}"><i class="fas ${oculta ? 'fa-eye' : 'fa-eye-slash'}"></i></button>` : '';
                const btnEditar = podeEditarRotina(r) ? `<button data-action="editar-rotina" data-id="${esc(r.id)}" class="${btn} hover:text-leveros-verde2 hover:bg-leveros-verde4/40" title="Editar Atividade"><i class="fas fa-edit"></i></button>` : '';
                const btnExcluir = podeGerirRotina(r) ? `<button data-action="excluir-rotina" data-id="${esc(r.id)}" class="${btn} hover:text-red-500 hover:bg-red-50" title="Excluir da rotina"><i class="fas fa-trash"></i></button>` : '';
                const btnLink = r.acesso ? `<a href="${esc(!r.acesso.startsWith('http') ? 'https://' + r.acesso : r.acesso)}" target="_blank" rel="noopener" class="${btn} !text-leveros-verde2 hover:bg-leveros-verde4/40" title="Acessar Link"><i class="fas fa-external-link-alt"></i></a>` : '';

                const statusBadge = (r.status !== 'Não iniciado' && r.status !== 'Concluído')
                    ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold border ${STATUS_ROTINA_META[r.status]}">${esc(r.status)}</span>` : '';

                return `
                <div class="group relative flex flex-col lg:flex-row lg:items-center gap-4 p-4 mb-3 rounded-2xl border border-gray-200 shadow-sm hover:shadow-lg hover:-translate-y-0.5 transition-all ${fundo}" style="border-left:6px solid ${faixa}">

                    <!-- DATA INICIAL (calendário) -->
                    ${blocoDataRotina(r, concluido)}

                    <!-- CHECK + CONTEÚDO -->
                    <div class="flex items-start gap-3 flex-1 min-w-0">
                        <button data-action="rotina-toggle-status" data-id="${esc(r.id)}" class="mt-0.5 shrink-0 text-2xl transition-transform hover:scale-110 ${concluido ? 'text-green-500' : 'text-gray-300 hover:text-green-400'}" title="${concluido ? 'Reabrir' : 'Marcar como concluída'}">
                            <i class="fas ${concluido ? 'fa-check-circle' : 'fa-circle'}"></i>
                        </button>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-1.5 flex-wrap mb-1.5">
                                <span class="px-2 py-0.5 rounded-md text-[10px] font-bold uppercase tracking-wide border" style="background:${cor}1A;color:${cor === '#FFCE00' || cor === '#6FFFAF' || cor === '#4CDDDD' ? '#002D32' : cor};border-color:${cor}66">${esc(r.categoria)}</span>
                                ${statusBadge}
                                ${compartilhada ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-indigo-100 text-indigo-700">🤝 De: ${esc(primeiroNome(getMembro(r.responsavelEmail).nome))}</span>` : ''}

                </div>

                    ${corpo}
                    <div class="flex justify-end gap-3 mt-6 border-t pt-4">
                        <button type="button" data-action="fechar-modal" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 font-medium text-sm">Cancelar</button>
                        <button type="submit" class="px-4 py-2 bg-leveros-verde1 text-white rounded-lg hover:bg-leveros-verde2 font-medium text-sm flex items-center gap-2"><i class="fas fa-save"></i> ${labelSalvar}</button>
                    </div>
                </form>
            </div>`;
            m.classList.remove('hidden'); m.classList.add('flex');
            m.querySelector('input,select,textarea')?.focus();
        }

            abrirModal('Nova Tarefa', `

                    <div><label class="lbl">Cronograma</label><select id="nt-cron" class="inp">${optionsCron(pid, cronId) || '<option value="">Geral (será criado)</option>'}</select></div>
                    ` : `<div class="sm:col-span-2 p-3 bg-orange-50 border border-orange-200 rounded-lg text-sm text-orange-800 font-semibold"><i class="fas fa-link mr-2"></i> Tarefa vinculada a uma Dor Operacional</div>`}
                    
                    <div class="sm:col-span-2"><label class="lbl">Título *</label><input id="nt-titulo" class="inp" required maxlength="140"></div>
                    <div class="sm:col-span-2"><label class="lbl">Descrição / observações</label><textarea id="nt-desc" rows="3" class="inp"></textarea></div>
                    <div><label class="lbl">Responsável *</label><select id="nt-resp" class="inp" required><option value="">Selecione...</option>${optionsMembros()}</select></div>
                    <div><label class="lbl">Prazo *</label><input id="nt-prazo" type="date" class="inp" required value=""></div>
                    <div><label class="lbl">Prioridade</label><select id="nt-prio" class="inp">${PRIORIDADES.map(p => `<option ${p === 'Média' ? 'selected' : ''}>${p}</option>`).join('')}</select></div>
                    <div><label class="lbl">Status inicial</label><select id="nt-status" class="inp">${STATUS.map(s => `<option>${s}</option>`).join('')}</select></div>
                    <div class="sm:col-span-2">
                        <label class="lbl"><i class="fas fa-user-group mr-1"></i>Apoios <span class="font-normal normal-case text-gray-400">(opcional)</span></label>
                        <div id="nt-colabs" class="border border-gray-300 rounded-lg max-h-36 overflow-y-auto divide-y bg-white">${checkboxColabs('nt-colab')}</div>
                    </div>
                </div>
                <p class="text-xs text-gray-400 mt-3"><i class="far fa-envelope mr-1"></i>O responsável receberá um e-mail automático ao ser atribuído.</p>`, 'form-tarefa', 'Criar tarefa', 'max-w-2xl');
        }

        function abrirDrawer(id) {
            const t = getTarefa(id);
            if (!t) return;
            state.drawerTaskId = id;
            const p = getOrigemTarefa(t);
            const hist = (t.historicoPrazos || []).length;
            const tudo = podeEditarTudo(t), atuar = podeAtuar(t);
            state.drawerPerm = permKey(t);
            const banner = !atuar
                ? `<div class="mb-4 bg-blue-50 border border-blue-200 text-blue-800 rounded-lg p-3 text-xs flex items-start gap-2"><i class="fas fa-lock mt-0.5"></i><div>Somente <b>${esc(getMembro(t.responsavelEmail).nome)}</b> (responsável) e colaboradores podem alterar esta tarefa. Você pode comentar ou enviar uma solicitação na seção <b>Colaboração</b>.</div></div>`
                : (!tudo ? `<div class="mb-4 bg-indigo-50 border border-indigo-200 text-indigo-800 rounded-lg p-3 text-xs flex items-start gap-2"><i class="fas fa-user-group mt-0.5"></i><div>Você é <b>colaborador(a)</b> desta tarefa: pode atualizar status, prazo, prioridade e descrição. Para reatribuir, envie uma solicitação ao responsável.</div></div>` : '');
            $('#drawer-panel').innerHTML = `
                <div class="px-5 py-3 border-b flex items-center justify-between gap-2 bg-gray-50 shrink-0">
                    <div class="flex items-center gap-2 min-w-0">${chipProjeto(p)}<span id="dr-situacao">${badgeSituacao(t)}</span></div>
                    <div class="flex items-center gap-1">
                        ${podeExcluirTarefa(t) ? `<button data-action="excluir-tarefa" data-id="${esc(t.id)}" class="w-8 h-8 rounded-lg text-gray-400 hover:text-red-500 hover:bg-red-50" title="Excluir tarefa"><i class="fas fa-trash"></i></button>` : ''}
                        <button data-action="fechar-drawer" class="w-8 h-8 rounded-lg text-gray-500 hover:bg-gray-200"><i class="fas fa-times"></i></button>
                    </div>
                </div>
                <div class="flex-1 overflow-y-auto">
                    <div class="p-5 border-b">
                        ${banner}
                        <input id="dt-titulo" class="w-full text-xl font-bold text-leveros-verde1 border-0 border-b border-transparent hover:border-gray-300 focus:border-leveros-azul focus:outline-none pb-1 mb-4 disabled:bg-transparent" value="${esc(t.titulo)}" maxlength="140" ${atuar ? '' : 'disabled'}>
                        <div class="grid grid-cols-2 gap-3">
                            <div><label class="lbl">Responsável</label><select id="dt-resp" class="inp" ${tudo ? '' : 'disabled'}>${optionsMembros(t.responsavelEmail)}</select></div>
                            <div><label class="lbl">Status</label><select id="dt-status" class="inp" ${atuar ? '' : 'disabled'}>${STATUS.map(s => `<option ${s === t.status ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
                            <div><label class="lbl">Prazo</label><input id="dt-prazo" type="date" class="inp" ${atuar ? '' : 'disabled'} value="${esc(t.prazo || '')}"></div>
                            <div><label class="lbl">Prioridade</label><select id="dt-prio" class="inp" ${atuar ? '' : 'disabled'}>${PRIORIDADES.map(s => `<option ${s === (t.prioridade || 'Média') ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
                            ${t.dorId ? '' : `<div class="col-span-2"><label class="lbl">Cronograma</label><select id="dt-cron" class="inp" ${tudo ? '' : 'disabled'}>${optionsCron(t.projetoId, t.cronogramaId)}</select></div>`}
                            <div id="dt-motivo-wrap" class="col-span-2 hidden"><label class="lbl">Motivo da alteração de prazo <span class="font-normal normal-case text-gray-400">(fica registrado no histórico)</span></label><input id="dt-motivo" class="inp bg-yellow-50" placeholder="Ex: aguardando retorno do fornecedor"></div>
                            <div class="col-span-2"><label class="lbl">Descrição</label><textarea id="dt-desc" rows="3" class="inp" ${atuar ? '' : 'disabled'}>${esc(t.descricao || '')}</textarea></div>
                        </div>
                        <div class="flex items-center justify-between mt-4 flex-wrap gap-2">
                            <span class="text-[11px] text-gray-400">Criada por ${esc(getMembro(t.criadoPorEmail).nome)} em ${t.criadoEm ? fmtDataHora(tsMillis(t.criadoEm)) : '—'}${hist ? ` · prazo alterado ${hist}×` : ''}</span>
                            ${atuar ? `<button data-action="salvar-tarefa" data-id="${esc(t.id)}" class="px-4 py-2 bg-leveros-verde1 text-white rounded-lg hover:leveros-verde2 font-medium text-sm"><i class="fas fa-save mr-1"></i> Salvar alterações</button>` : ''}
                        </div>
                    </div>
                    <div class="p-5 border-b" id="dr-colab">${colabSectionHTML(t)}</div>
                    <div class="p-5">
                        <h4 class="font-bold text-gray-700 mb-3 text-sm"><i class="far fa-comments text-leveros-verde2 mr-1"></i> Observações e questionamentos</h4>
                        <div id="feed" class="flex flex-col gap-3 mb-3"><div class="loader" style="width:24px;height:24px;border-width:3px"></div></div>
                    </div>
                </div>
                <div class="border-t p-3 bg-white shrink-0">
                    <div class="flex gap-2 items-end">
                        <textarea id="dt-comentario" rows="2" class="inp resize-none" placeholder="Escreva uma observação ou pergunta... (Enter envia, Shift+Enter quebra linha)"></textarea>
                        <button data-action="enviar-comentario" data-id="${esc(t.id)}" class="h-10 w-10 shrink-0 bg-leveros-azul text-leveros-verde1 rounded-lg hover:bg-leveros-verde3 font-bold" title="Enviar"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>`;
            const d = $('#drawer'); d.classList.remove('hidden');

            if (state.unsubFeed) state.unsubFeed();
            state.unsubFeed = onSnapshot(query(collection(db, 'tarefas', id, 'comentarios'), orderBy('criadoEm', 'asc')), (snap) => {
                const feed = $('#feed'); if (!feed || state.drawerTaskId !== id) return;
                const itens = snap.docs.map(x => ({ id: x.id, ...x.data() }));
                feed.innerHTML = itens.length ? itens.map(feedItemHTML).join('') : '<p class="text-xs text-gray-400 text-center py-4">Nenhuma observação ainda. Use este espaço no lugar das threads de e-mail.</p>';
                const cont = feed.closest('.overflow-y-auto'); if (cont) cont.scrollTop = cont.scrollHeight;
            }, (err) => { $('#feed').innerHTML = '<p class="text-xs text-red-500">Não foi possível carregar o histórico (verifique as regras do Firestore).</p>'; });
        }

        function feedItemHTML(c) {
            const quando = fmtDataHora(tsMillis(c.criadoEm));
            if (c.tipo === 'sistema') {
                return `<div class="flex items-start gap-2 text-xs text-gray-500 bg-gray-50 rounded-lg px-3 py-2"><i class="fas fa-clock-rotate-left mt-0.5 text-gray-400"></i><div><span class="font-semibold">${esc(getMembro(c.autorEmail).nome)}</span> ${esc(c.texto)} <span class="text-gray-400">· ${quando}</span></div></div>`;
            }
            const minha = c.autorEmail === state.user.email;
            return `<div class="flex gap-2.5 ${minha ? 'flex-row-reverse' : ''}">
                ${avatar(c.autorEmail, 'w-8 h-8 text-xs')}
                <div class="max-w-[80%] ${minha ? 'bg-leveros-verde4/60' : 'bg-gray-100'} rounded-xl px-3 py-2">
                    <div class="text-[11px] font-bold text-leveros-verde2">${esc(getMembro(c.autorEmail).nome)} <span class="text-gray-400 font-normal">· ${quando}</span></div>
                    <div class="text-sm text-gray-800 whitespace-pre-wrap break-words">${esc(c.texto)}</div>
                </div></div>`;
        }

        function fecharDrawer() {
            state.drawerTaskId = null;
            if (state.unsubFeed) { state.unsubFeed(); state.unsubFeed = null; }
            const d = $('#drawer'); if (d) d.classList.add('hidden');
        }

        // ==========================================================
        // PERMISSÕES, COLABORAÇÃO E SOLICITAÇÕES
        // ==========================================================
        const ehResponsavel = (t) => t.responsavelEmail === state.user?.email;
        const ehColaborador = (t) => (t.colaboradoresEmails || []).includes(state.user?.email);
        const podeEditarTudo = (t) => ehResponsavel(t) || isAdmin();
        const podeAtuar = (t) => podeEditarTudo(t) || ehColaborador(t);
        const permKey = (t) => `${podeEditarTudo(t) ? 1 : 0}${podeAtuar(t) ? 1 : 0}`;
        const solicitacoesDa = (tid) => state.solicitacoes.filter(x => x.tarefaId === tid).sort((a, b) => tsMillis(a.criadoEm) - tsMillis(b.criadoEm));
        const solicitacoesRecebidas = () => state.solicitacoes.filter(x => { if (x.status !== 'pendente') return false; const t = getTarefa(x.tarefaId); return t && ehResponsavel(t); });
        const SOL_TIPOS = { prazo: 'Alterar o prazo', status: 'Alterar o status', reatribuir: 'Reatribuir a tarefa', colaboracao: 'Colaborar na tarefa' };

        function descSolicitacao(x, t) {
            if (x.tipo === 'prazo') return `alterar o prazo de ${fmtBR(t?.prazo)} para ${fmtBR(x.novoPrazo)}`;
            if (x.tipo === 'status') return `mudar o status de "${t?.status}" para "${x.novoStatus}"`;
            if (x.tipo === 'reatribuir') return `passar a tarefa para ${getMembro(x.novoResponsavelEmail).nome}`;
            if (x.tipo === 'colaboracao') return 'participar desta tarefa como colaborador(a)';
            return 'uma alteração';
        }

        function solicitacaoItemHTML(x, comTarefa = false) {
            const t = getTarefa(x.tarefaId); if (!t) return '';
            const minha = x.deEmail === state.user.email;
            const pode = podeEditarTudo(t);
            return `<div class="flex items-start gap-3 bg-yellow-50 border border-yellow-200 rounded-lg p-3">
                ${avatar(x.deEmail, 'w-8 h-8 text-xs')}
                <div class="flex-1 min-w-0 text-sm">
                    <div><span class="font-semibold">${esc(minha ? 'Você' : getMembro(x.deEmail).nome)}</span> ${minha ? 'pediu' : 'pede'} para ${esc(descSolicitacao(x, t))}</div>
                    ${comTarefa ? `<button data-action="abrir-tarefa" data-id="${esc(t.id)}" class="text-xs text-leveros-verde2 font-semibold hover:underline text-left">${esc(t.titulo)}</button>` : ''}
                    ${x.mensagem ? `<div class="text-xs text-gray-600 mt-1 italic">“${esc(x.mensagem)}”</div>` : ''}
                    ${!pode ? `<div class="text-[11px] text-gray-400 mt-1">Aguardando resposta de ${esc(getMembro(t.responsavelEmail).nome)}</div>` : ''}
                </div>
                <div class="flex flex-col sm:flex-row gap-1.5 shrink-0">
                    ${pode ? `<button data-action="responder-sol" data-id="${esc(x.id)}" data-aceitar="1" class="text-xs px-2.5 py-1 rounded-lg bg-green-600 text-white font-semibold hover:bg-green-700">Aceitar</button>
                    <button data-action="responder-sol" data-id="${esc(x.id)}" data-aceitar="0" class="text-xs px-2.5 py-1 rounded-lg border border-gray-300 text-gray-700 font-semibold hover:bg-gray-100">Recusar</button>` : ''}
                    ${minha ? `<button data-action="cancelar-sol" data-id="${esc(x.id)}" class="text-xs px-2.5 py-1 rounded-lg border border-red-200 text-red-500 hover:bg-red-50">Cancelar</button>` : ''}
                </div>
            </div>`;
        }

        function solicitacoesPainelHTML() {
            const rec = solicitacoesRecebidas().sort((a, b) => tsMillis(a.criadoEm) - tsMillis(b.criadoEm));
            const env = state.solicitacoes.filter(x => x.status === 'pendente' && x.deEmail === state.user.email && !rec.includes(x));
            if (!rec.length && !env.length) return '';
            return `<div class="mb-6 flex flex-col gap-4">
                ${rec.length ? `<section><h3 class="font-bold text-yellow-700 mb-2 text-sm">📨 Solicitações aguardando sua resposta <span class="text-gray-400 font-normal">(${rec.length})</span></h3><div class="flex flex-col gap-2">${rec.map(x => solicitacaoItemHTML(x, true)).join('')}</div></section>` : ''}
                ${env.length ? `<section><h3 class="font-bold text-gray-500 mb-2 text-sm">⏳ Suas solicitações pendentes <span class="font-normal">(${env.length})</span></h3><div class="flex flex-col gap-2">${env.map(x => solicitacaoItemHTML(x, true)).join('')}</div></section>` : ''}
            </div>`;
        }

        function colabSectionHTML(t) {
            const tudo = podeEditarTudo(t), atuar = podeAtuar(t);
            const colabs = t.colaboradoresEmails || [];
            const todas = solicitacoesDa(t.id);
            const pend = todas.filter(x => x.status === 'pendente');
            const hist = todas.filter(x => x.status !== 'pendente').slice(-3).reverse();
            const candidatos = state.membros.filter(m => m.email !== t.responsavelEmail && !colabs.includes(m.email)).sort((a, b) => a.nome.localeCompare(b.nome));
            const chip = (email, papel, removivel) => `<span class="inline-flex items-center gap-1.5 bg-gray-100 rounded-full pl-1 pr-2.5 py-1 text-xs">${avatar(email, 'w-5 h-5 text-[9px]')}<span class="font-semibold">${esc(primeiroNome(getMembro(email).nome))}</span><span class="text-gray-400">${papel}</span>${removivel ? `<button data-action="remover-colab" data-id="${esc(t.id)}" data-email="${esc(email)}" class="text-gray-400 hover:text-red-500 ml-1" title="Remover colaborador"><i class="fas fa-times"></i></button>` : ''}</span>`;
            return `
                <h4 class="font-bold text-gray-700 mb-3 text-sm"><i class="fas fa-user-group text-leveros-verde2 mr-1"></i> Colaboração</h4>
                <div class="flex flex-wrap gap-2 mb-3">${chip(t.responsavelEmail, 'responsável', false)}${colabs.map(e => chip(e, 'colaborador', tudo)).join('')}</div>
                ${tudo ? `<div class="flex gap-2 mb-3"><select id="dt-add-colab" class="inp"><option value="">Incluir colaborador...</option>${candidatos.map(m => `<option value="${esc(m.email)}">${esc(m.nome)}</option>`).join('')}</select><button data-action="add-colab" data-id="${esc(t.id)}" class="px-3 py-2 text-sm font-semibold bg-leveros-verde2 text-white rounded-lg hover:bg-leveros-verde1 shrink-0">Adicionar</button></div>` : ''}
                ${!tudo ? `<div class="flex gap-2 flex-wrap mb-3">
                    ${!atuar ? `<button data-action="solicitar" data-id="${esc(t.id)}" data-tipo="colaboracao" class="text-xs px-3 py-1.5 rounded-lg border border-indigo-300 text-indigo-700 font-semibold hover:bg-indigo-50"><i class="fas fa-hand mr-1"></i>Pedir para colaborar</button>` : ''}
                    <button data-action="solicitar" data-id="${esc(t.id)}" class="text-xs px-3 py-1.5 rounded-lg border border-gray-300 text-gray-700 font-semibold hover:bg-gray-50"><i class="fas fa-paper-plane mr-1"></i>Solicitar alteração ao responsável</button>
                </div>` : ''}
                ${pend.length ? `<div class="flex flex-col gap-2 mb-2">${pend.map(x => solicitacaoItemHTML(x)).join('')}</div>` : ''}
                ${hist.length ? `<div class="mt-2 text-[11px] text-gray-400 flex flex-col gap-0.5">${hist.map(x => `<div>${x.status === 'aceita' ? '✅' : '🚫'} ${esc(getMembro(x.deEmail).nome)}: ${esc(descSolicitacao(x, t))} — <b>${x.status === 'aceita' ? 'aceita' : 'recusada'}</b></div>`).join('')}</div>` : ''}`;
        }

        function modalSolicitacao(tarefaId, tipoInicial = '') {
            const t = getTarefa(tarefaId); if (!t) return;
            const atuar = podeAtuar(t);
            const tipos = atuar ? ['reatribuir'] : ['prazo', 'status', 'reatribuir', 'colaboracao'];
            const tipo = tipos.includes(tipoInicial) ? tipoInicial : tipos[0];
            abrirModal('Solicitar ao responsável', `
                <input type="hidden" id="sl-tarefa" value="${esc(tarefaId)}">
                <p class="text-sm text-gray-600 mb-4">A tarefa <b>${esc(t.titulo)}</b> está com <b>${esc(getMembro(t.responsavelEmail).nome)}</b>. A mudança só será aplicada se ele(a) aceitar.</p>
                <div class="grid gap-4">
                    <div><label class="lbl">O que você precisa?</label><select id="sl-tipo" class="inp">${tipos.map(k => `<option value="${k}" ${k === tipo ? 'selected' : ''}>${SOL_TIPOS[k]}</option>`).join('')}</select></div>
                    <div id="sl-prazo-wrap"><label class="lbl">Novo prazo</label><input id="sl-prazo" type="date" class="inp" value="${esc(t.prazo || '')}"></div>
                    <div id="sl-status-wrap"><label class="lbl">Novo status</label><select id="sl-status" class="inp">${STATUS.map(x => `<option ${x === t.status ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
                    <div id="sl-resp-wrap"><label class="lbl">Passar para</label><select id="sl-resp" class="inp">${state.membros.filter(m => m.email !== t.responsavelEmail).sort((a, b) => a.nome.localeCompare(b.nome)).map(m => `<option value="${esc(m.email)}">${esc(m.nome)}</option>`).join('')}</select></div>
                    <div><label class="lbl">Mensagem / justificativa</label><textarea id="sl-msg" rows="3" class="inp" maxlength="500" placeholder="Explique o motivo para facilitar a decisão..."></textarea></div>
                </div>`, 'form-solicitacao', 'Enviar solicitação');
            atualizarCamposSolicitacao();
        }

        function atualizarCamposSolicitacao() {
            const tipo = $('#sl-tipo')?.value; if (!tipo) return;
            $('#sl-prazo-wrap').classList.toggle('hidden', tipo !== 'prazo');
            $('#sl-status-wrap').classList.toggle('hidden', tipo !== 'status');
            $('#sl-resp-wrap').classList.toggle('hidden', tipo !== 'reatribuir');
        }

        async function criarSolicitacao() {
            const tid = $('#sl-tarefa').value; const t = getTarefa(tid);
            if (!t) throw new Error('Tarefa não encontrada.');
            const tipo = $('#sl-tipo').value;
            const dados = { tarefaId: tid, tipo, deEmail: state.user.email, deNome: state.user.nome, status: 'pendente', mensagem: $('#sl-msg').value.trim(), criadoEm: serverTimestamp() };
            if (tipo === 'prazo') {
                dados.novoPrazo = $('#sl-prazo').value;
                if (!dados.novoPrazo || dados.novoPrazo === t.prazo) throw new Error('Informe um prazo diferente do atual.');
            } else if (tipo === 'status') {
                dados.novoStatus = $('#sl-status').value;
                if (dados.novoStatus === t.status) throw new Error('Escolha um status diferente do atual.');
            } else if (tipo === 'reatribuir') {
                dados.novoResponsavelEmail = $('#sl-resp').value;
                if (!dados.novoResponsavelEmail) throw new Error('Selecione para quem passar a tarefa.');
            } else if (tipo === 'colaboracao' && ehColaborador(t)) throw new Error('Você já colabora nesta tarefa.');
            if (state.solicitacoes.some(x => x.tarefaId === tid && x.deEmail === state.user.email && x.tipo === tipo && x.status === 'pendente')) throw new Error('Você já tem uma solicitação desse tipo pendente nesta tarefa.');
            await addDoc(collection(db, 'solicitacoes'), dados);
            fecharModal(); toast('Solicitação enviada ao responsável.');
        }

        async function responderSolicitacao(sid, aceitar) {
            const x = state.solicitacoes.find(v => v.id === sid); const t = x && getTarefa(x.tarefaId);
            if (!x || !t) return;
            if (!podeEditarTudo(t)) return toast('Apenas o responsável pode responder.', 'erro');
            const nomeDe = getMembro(x.deEmail).nome;
            let texto = `${aceitar ? 'aceitou' : 'recusou'} a solicitação de ${nomeDe}: ${descSolicitacao(x, t)}`;
            try {
                const b = writeBatch(db);
                b.update(doc(db, 'solicitacoes', sid), { status: aceitar ? 'aceita' : 'recusada', resolvidoPor: state.user.email, resolvidoEm: serverTimestamp() });
                let novoResp = null;
                if (aceitar) {
                    const upd = { atualizadoEm: serverTimestamp() };
                    if (x.tipo === 'prazo') {
                        upd.prazo = x.novoPrazo;
                        upd.historicoPrazos = arrayUnion({ de: t.prazo || '', para: x.novoPrazo, por: x.deEmail, em: Date.now(), motivo: x.mensagem || '' });
                    } else if (x.tipo === 'status') upd.status = x.novoStatus;
                    else if (x.tipo === 'reatribuir') {
                        novoResp = x.novoResponsavelEmail;
                        upd.responsavelEmail = novoResp; upd.responsavelNome = getMembro(novoResp).nome;
                        upd.colaboradoresEmails = (t.colaboradoresEmails || []).filter(e => e !== novoResp);
                    } else if (x.tipo === 'colaboracao') upd.colaboradoresEmails = arrayUnion(x.deEmail);
                    b.update(doc(db, 'tarefas', t.id), upd);
                }
                b.set(doc(collection(db, 'tarefas', t.id, 'comentarios')), { tipo: 'sistema', texto, autorEmail: state.user.email, autorNome: state.user.nome, criadoEm: serverTimestamp() });
                await b.commit();
                toast(aceitar ? 'Solicitação aceita e aplicada.' : 'Solicitação recusada.');
                if (novoResp) await notificarAtribuicao({ ...t, responsavelEmail: novoResp }, getOrigemTarefa(t));

        async function notificarAtribuicao(tarefa, origem) {
            const para = (tarefa.responsavelEmail || '').trim();
            if (!para) return;
            const membro = getMembro(para);
            const link = window.location.href.split('#')[0];
            const assunto = `[Projetos] Nova tarefa atribuída a você: ${tarefa.titulo}`;

            try {
                if (EMAIL_CONFIG.provider === 'emailjs') {
                    const c = EMAIL_CONFIG.emailjs;
                    const resp = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            service_id: c.serviceId, template_id: c.templateId, user_id: c.publicKey,
                            template_params: {
                                to_email: para,
                                to_name: membro.nome,
                                subject: assunto,
                                task_title: tarefa.titulo,
                                project_name: origem?.nome || 'Projeto Geral / Dor',
                                due_date: fmtBR(tarefa.prazo),
                                assigned_by: state.user.nome,
                                description: tarefa.descricao || 'Sem detalhes adicionais.',
                                link: link
                            }
                        })
                    });
                    if (!resp.ok) throw new Error(await resp.text());
                    toast(`E-mail de atribuição enviado para ${membro.nome}`);
                }
            } catch (e) {
                toast('Tarefa salva, mas o e-mail de notificação falhou. Verifique o console (F12).', 'erro');
            }
        }

        async function salvarTarefa(id) {
            const t = getTarefa(id); if (!t) return;
            const tudo = podeEditarTudo(t);
            if (!podeAtuar(t)) return toast('Você não tem permissão para alterar esta tarefa.', 'erro');
            const novo = {
                titulo: $('#dt-titulo').value.trim(), descricao: $('#dt-desc').value.trim(),
                prazo: $('#dt-prazo').value, prioridade: $('#dt-prio').value, status: $('#dt-status').value
            };
            if (tudo) {
                novo.responsavelEmail = $('#dt-resp').value;
                novo.responsavelNome = getMembro(novo.responsavelEmail).nome;
                if (!t.dorId) novo.cronogramaId = $('#dt-cron').value;
            }
            if (!novo.titulo) return toast('O título não pode ficar vazio.', 'erro');
            if (!novo.prazo) return toast('Informe o prazo.', 'erro');
            const motivo = $('#dt-motivo').value.trim();
            const upd = { ...novo, atualizadoEm: serverTimestamp() };
            const logs = [];

            if (novo.prazo !== t.prazo) {
                upd.historicoPrazos = arrayUnion({ de: t.prazo || '', para: novo.prazo, por: state.user.email, em: Date.now(), motivo });
                logs.push(`alterou o prazo de ${fmtBR(t.prazo)} para ${fmtBR(novo.prazo)}${motivo ? ` — Motivo: ${motivo}` : ''}`);
            }
            const reatribuiu = tudo && novo.responsavelEmail !== t.responsavelEmail;
            if (reatribuiu) {
                logs.push(`reatribuiu a tarefa de ${getMembro(t.responsavelEmail).nome} para ${novo.responsavelNome}`);
                upd.colaboradoresEmails = (t.colaboradoresEmails || []).filter(e => e !== novo.responsavelEmail);
            }
            if (novo.status !== t.status) logs.push(`alterou o status de "${t.status}" para "${novo.status}"`);
            if (novo.prioridade !== (t.prioridade || 'Média')) logs.push(`alterou a prioridade para ${novo.prioridade}`);
            if (novo.titulo !== t.titulo) logs.push('renomeou a tarefa');
            if (novo.descricao !== (t.descricao || '')) logs.push('atualizou a descrição');

            try {
                const b = writeBatch(db);
                b.update(doc(db, 'tarefas', id), upd);
                logs.forEach(l => b.set(doc(collection(db, 'tarefas', id, 'comentarios')), { tipo: 'sistema', texto: l, autorEmail: state.user.email, autorNome: state.user.nome, criadoEm: serverTimestamp() }));
                await b.commit();
                if (reatribuiu) await notificarAtribuicao({ ...t, ...novo }, getOrigemTarefa(t));
                toast('Tarefa atualizada.');
                $('#dt-motivo-wrap').classList.add('hidden'); $('#dt-motivo').value = '';
                $('#dr-situacao').innerHTML = badgeSituacao({ ...t, ...novo });
            } catch (e) { /* erro tratado silenciosamente */ toast('Erro ao salvar a tarefa (verifique suas permissões).', 'erro'); }
        }

            ta.value = ''; ta.focus();

        async function refsFilhosDasTarefas(tarefas) {
            const refs = [];
            for (const t of tarefas) {
                const snap = await getDocs(collection(db, 'tarefas', t.id, 'comentarios'));
                snap.docs.forEach(d => refs.push(d.ref));
                state.solicitacoes.filter(x => x.tarefaId === t.id).forEach(x => refs.push(doc(db, 'solicitacoes', x.id)));
            }
            return refs;
        }

        async function apagarEmLotes(refs) {
            for (let i = 0; i < refs.length; i += 400) {
                const b = writeBatch(db);
                refs.slice(i, i + 400).forEach(r => b.delete(r));
                await b.commit();
            }
        }

            const p = getProjeto(id); if (!p) return;
            const ts = state.tarefas.filter(t => t.projetoId === id);

        let _xlsxCarregado = false;
        function carregarXLSX() { if (_xlsxCarregado && window.XLSX) return Promise.resolve(); return new Promise((resolve, reject) => { const s = document.createElement('script'); s.src = 'https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js'; s.onload = () => { _xlsxCarregado = true; resolve(); }; s.onerror = () => reject(new Error('Falha ao carregar biblioteca de planilhas.')); document.head.appendChild(s); }); }

        async function exportarRelatorioExcel() {
            if (!state.projetos.length && !state.tarefas.length && !state.rotinas.length) {
                return toast('Não há dados para exportar.', 'erro');
            }
            toast('Gerando relatório Excel completo...', 'info'); try { await carregarXLSX(); } catch (e) { return toast('Não foi possível carregar o módulo de Excel. Verifique sua conexão.', 'erro'); }

            const calcProgresso = (pId) => {
                const ts = state.tarefas.filter(t => t.projetoId === pId);
                const feitas = ts.filter(t => t.status === 'Validado').length;
                const atrasadas = ts.filter(t => t.status !== 'Validado' && diasPara(t.prazo) < 0).length;
                const pct = ts.length ? Math.round((feitas / ts.length) * 100) : 0;
                return { total: ts.length, feitas, atrasadas, pct };
            };

            const getNome = (email) => getMembro(email).nome;
            const nomesColabs = (emails) => (emails || []).map(getNome).join(', ');

            // 1. DADOS DE PROJETOS
            const dadosProjetos = state.projetos.map(p => {
                const pr = calcProgresso(p.id);
                return {
                    'Nome do Projeto': p.nome,
                    'Status': p.status === 'arquivado' ? 'Arquivado' : 'Ativo',
                    'Progresso (%)': `${pr.pct}%`,
                    'Tarefas Concluídas': `${pr.feitas} de ${pr.total}`,
                    'Tarefas Atrasadas': pr.atrasadas,
                    'Data de Início': fmtBR(p.inicio),
                    'Qual a Dor?': p.dor || '-',
                    'O Que Queremos Sanar?': p.sanar || '-',
                    'KPI a Medir': p.kpi || '-',
                    'Criado por': getNome(p.criadoPorEmail),
                    'Descrição': p.descricao || '-'
                };
            });

            // 2. DADOS DE TAREFAS
            const dadosTarefas = state.tarefas.map(t => {
                const p = getOrigemTarefa(t);
                const c = state.cronogramas.find(x => x.id === t.cronogramaId);
                const sit = situacao(t);
                return {
                    'Projeto / Dor': p ? p.nome : 'Sem projeto',
                    'Cronograma / Fase': c ? c.nome : (t.dorId ? '-' : 'Geral'),
                    'Título da Tarefa': t.titulo,
                    'Status Kanban': t.status,
                    'Situação de Prazo': sit.label, 
                    'Data Limite': fmtBR(t.prazo),
                    'Prioridade': t.prioridade || 'Média',
                    'Responsável Principal': getNome(t.responsavelEmail),
                    'Colaboradores Apoio': nomesColabs(t.colaboradoresEmails) || '-',
                    'Qtd. Observações': t.comentariosCount || 0,
                    'Criado por': getNome(t.criadoPorEmail),
                    'Descrição Detalhada': t.descricao || '-'
                };
            });

            // 3. DADOS DE ROTINAS E AVULSAS
            const dadosRotinas = state.rotinas.map(r => {
                return {
                    'Data de Execução': fmtBR(r.data),
                    'Prazo Final': fmtBR(r.prazo),
                    'Categoria da Atividade': r.categoria,
                    'Status Atual': r.status,
                    'Título da Atividade': r.titulo,
                    'Responsável': getNome(r.responsavelEmail),
                    'Equipe Envolvida': nomesColabs(r.colaboradoresEmails) || '-',
                    'Link de Acesso': r.acesso || '-',
                    'Observação / Pauta': r.observacao || '-',
                    'Descrição Extra': r.descricao || '-'
                };
            });

            const wb = XLSX.utils.book_new();

            if (dadosProjetos.length) {
                const wsProj = XLSX.utils.json_to_sheet(dadosProjetos);
                wsProj['!cols'] = [{wch: 35}, {wch: 12}, {wch: 15}, {wch: 20}, {wch: 18}, {wch: 15}, {wch: 40}, {wch: 40}, {wch: 20}, {wch: 25}, {wch: 50}];
                XLSX.utils.book_append_sheet(wb, wsProj, "Visão Projetos");
            }
            
            if (dadosTarefas.length) {
                const wsTar = XLSX.utils.json_to_sheet(dadosTarefas);
                wsTar['!cols'] = [{wch: 25}, {wch: 25}, {wch: 45}, {wch: 18}, {wch: 20}, {wch: 15}, {wch: 12}, {wch: 25}, {wch: 35}, {wch: 18}, {wch: 25}, {wch: 50}];
                XLSX.utils.book_append_sheet(wb, wsTar, "Quadro de Tarefas");
            }
            
            if (dadosRotinas.length) {
                const wsRot = XLSX.utils.json_to_sheet(dadosRotinas);
                wsRot['!cols'] = [{wch: 18}, {wch: 15}, {wch: 25}, {wch: 20}, {wch: 45}, {wch: 25}, {wch: 35}, {wch: 35}, {wch: 50}, {wch: 40}];
                XLSX.utils.book_append_sheet(wb, wsRot, "Rotina Diária");
            }

            XLSX.writeFile(wb, `Relatorio_Gerencial_CX_FLOW_${hojeISO()}.xlsx`);
            toast('Relatório exportado com sucesso!');
        }

                else if (e.target.id === 'form-editar-rotina') {
                    const id = $('#er-id').value;
                    const r = state.rotinas.find(x => x.id === id);
                    if (!r || !podeEditarRotina(r)) throw new Error('Você não tem permissão para editar esta atividade.');
                    const corSelecionada = document.querySelector('input[name=er-cor]:checked')?.value || PALETA[0];
                    const upd = {
                        data: $('#er-data').value,
                        prazo: $('#er-prazo').value || null,
                        categoria: $('#er-cat').value,
                        cor: corSelecionada,
                        status: $('#er-status').value,
                        titulo: $('#er-titulo').value.trim(),
                        descricao: $('#er-desc').value.trim(),
                        acesso: $('#er-acesso').value.trim(),
                        observacao: $('#er-obs').value.trim(),
                        atualizadoEm: serverTimestamp()
                    };
                    if (podeGerirRotina(r)) {
                        upd.colaboradoresEmails = colabsMarcados('er-colab').filter(em => em !== r.responsavelEmail);
                    }
                    await updateDoc(doc(db, 'rotinas', id), upd);
                    fecharModal();
                    toast('Atividade atualizada com sucesso!');
                }
                else if (e.target.id === 'form-dor') {
                    await salvarDor();
                }
            } catch (err) {
                toast(err.code ? 'Erro ao salvar. Verifique permissões.' : (err.message || 'Erro ao salvar.'), 'erro');
                if (btn) { btn.disabled = false; btn.innerHTML = original; }
            }
        });

        document.addEventListener('click', async (e) => {
            const el = e.target.closest('[data-action]');
            if (!el) return;
            const a = el.dataset.action; const d = el.dataset;
            switch (a) {
                case 'login':
                    $('#login-error').classList.add('hidden');
                    signInWithPopup(auth, provider).catch((err) => { mostrarErroLogin('Não foi possível entrar.'); });
                    break;
                case 'logout': if (confirm('Deseja sair?')) signOut(auth); break;
                case 'nav': navegar(d.view); break;
                case 'abrir-projeto': navegar('projeto', d.id); break;
                case 'abrir-tarefa': abrirDrawer(d.id); break;
                case 'fechar-drawer': fecharDrawer(); break;
                case 'fechar-modal': fecharModal(); break;
                case 'novo-projeto': modalProjeto(); break;
                case 'editar-projeto': modalEditarProjeto(d.id); break;
                case 'novo-cronograma': modalCronograma(d.projeto); break;
                case 'novo-membro': modalMembro(); break;
                case 'nova-tarefa': modalTarefa(d.projeto || '', d.cron || '', d.dor || ''); break;
                case 'mudar-status': await moverStatus(d.id, d.status); break;
                case 'toggle-concluidas': state.minhasMostrarConcluidas = !state.minhasMostrarConcluidas; render(true); break;
                case 'ver-quadro': state.filtros = { ...state.filtros, projeto: d.projeto, resp: '', q: '', sit: '' }; navegar('quadro'); break;
                case 'filtrar-quadro': state.filtros = { ...state.filtros, projeto: d.projeto || '', resp: d.resp || '', q: '', sit: d.sit || '' }; navegar('quadro'); break;
                case 'filtro-minhas': state.filtros.resp = state.user.email; navegar('quadro'); break;
                case 'limpar-filtros': state.filtros = { ...state.filtros, projeto: '', resp: '', q: '', sit: '' }; navegar('quadro'); break;
                case 'exportar-excel': exportarRelatorioExcel(); break;

                // ================= ROTINA DIÁRIA =================
                case 'set-rotina-modo':
                    state.filtros.rotinaModo = d.modo;
                    if (d.modo === 'minhas') state.filtros.rotinaResp = state.user.email;
                    render(true);
                    break;
                case 'filtrar-rotina': state.filtros.rotinaResp = $('#filtro-rotina-resp').value; render(true); break;
                case 'toggle-ver-ocultas': state.filtros.rotinaOcultas = !state.filtros.rotinaOcultas; render(true); break;
                case 'toggle-ocultar-rotina': {
                    const r = state.rotinas.find(x => x.id === d.id);
                    if (r) {
                        try {
                            const me = state.user.email;
                            const ocultaAgora = rotinaOcultaPara(r, me);
                            const upd = r.responsavelEmail === me
                                ? { oculta: !ocultaAgora, atualizadoEm: serverTimestamp() }
                                : { ocultaPara: ocultaAgora ? arrayRemove(me) : arrayUnion(me) };
                            await updateDoc(doc(db, 'rotinas', d.id), upd);
                            toast(ocultaAgora ? 'Atividade visível novamente.' : 'Atividade oculta da lista.');
                        } catch (err) { toast('Erro ao ocultar atividade.', 'erro'); }
                    }
                    break;
                }
                case 'limpar-filtros-rotina':
                    state.filtros.rotinaBusca = ''; state.filtros.rotinaCat = '';
                    state.filtros.rotinaStatus = ''; state.filtros.rotinaOrdem = 'data-desc';
                    state.filtros.rotinaOcultas = false;
                    if($('#f-rotina-q')) $('#f-rotina-q').value = '';
                    render(true);
                    break;
                case 'toggle-rotina-form': {
                    const form = $('#form-rotina');
                    const icon = $('#icone-toggle-rotina');
                    if (form && icon) {
                        form.classList.toggle('hidden');
                        if (form.classList.contains('hidden')) icon.classList.replace('fa-chevron-up', 'fa-chevron-down');
                        else icon.classList.replace('fa-chevron-down', 'fa-chevron-up');
                    }
                    break;
                }
                case 'editar-rotina': modalEditarRotina(d.id); break;
                case 'excluir-rotina': {
                    const r = state.rotinas.find(x => x.id === d.id);
                    if (!r || !podeGerirRotina(r)) { toast('Apenas o responsável pode excluir esta atividade.', 'erro'); break; }
                    if (confirm(rotinaColabs(r).length ? 'Esta atividade é compartilhada e será removida também da lista dos Apoios. Excluir?' : 'Excluir esta atividade da rotina?')) {
                        try {
                            await deleteDoc(doc(db, 'rotinas', d.id));
                            toast('Atividade avulsa excluída.');
                        } catch(err) { toast('Erro ao excluir rotina', 'erro'); }
                    }
                    break;
                }
                case 'rotina-toggle-status': {
                    const r = state.rotinas.find(x => x.id === d.id);
                    if(r) {
                        try {
                            const nv = (r.status === 'Concluído' || r.status === 'Concluído Parcial') ? 'Não iniciado' : 'Concluído';
                            await updateDoc(doc(db, 'rotinas', d.id), { status: nv, atualizadoEm: serverTimestamp() });
                            toast(nv === 'Concluído' ? 'Atividade concluída!' : 'Atividade reaberta.');
                        } catch(err) { toast('Erro ao alterar status', 'erro'); }
                    }
                    break;
                }

                // ================= SOLICITAÇÕES E TAREFAS =================
                case 'solicitar': modalSolicitacao(d.id, d.tipo || ''); break;
                case 'responder-sol': await responderSolicitacao(d.id, d.aceitar === '1'); break;
                case 'cancelar-sol': await cancelarSolicitacao(d.id); break;
                case 'add-colab': await adicionarColaborador(d.id); break;
                case 'remover-colab': await removerColaborador(d.id, d.email); break;
                case 'salvar-tarefa': await salvarTarefa(d.id); break;
                case 'enviar-comentario': await enviarComentario(d.id); break;
                case 'excluir-tarefa': await excluirTarefa(d.id); break;
                case 'excluir-cronograma': await excluirCronograma(d.id); break;
                case 'excluir-projeto': await excluirProjeto(d.id); break;
                case 'excluir-membro': await excluirMembro(d.email); break;
                case 'arquivar-projeto': {
                    const p = getProjeto(d.id);
                    await updateDoc(doc(db, 'projetos', d.id), { status: p.status === 'arquivado' ? 'ativo' : 'arquivado' });
                    toast(p.status === 'arquivado' ? 'Projeto reativado.' : 'Projeto arquivado.');
                    break;
                }

                // ================= DORES OPERACIONAIS =================
                case 'dor-nova': modalDor(); break;
                case 'dor-ver': abrirDetalheDor(d.id); break;
                case 'dor-editar': modalDor(d.id); break;
                case 'dor-excluir': await excluirDor(d.id); break;
                case 'dor-exportar': exportarDores(); break;
                case 'dor-modelo': baixarModeloDores(); break;
                case 'dor-importar': $('#dor-file')?.click(); break;
                case 'dor-carregar-base': mostrarPreviaImportacao(DORES_BASE, `Planilha base (${DORES_BASE.length} dores)`, 'base'); break;
                case 'dor-confirmar-import': await confirmarImportacaoDores(el); break;
                case 'dor-modo': state.filtros.dores.modo = d.modo; atualizarDores(); break;
                case 'dor-limpar':
                    state.filtros.dores = { ...state.filtros.dores, q: '', setor: '', prio: '', status: '', quarter: '' };
                    atualizarDores();
                    break;
                case 'dor-filtro-rapido': {
                    const f = state.filtros.dores;
                    if (d.campo === 'limpar') { f.q = ''; f.setor = ''; f.prio = ''; f.status = ''; f.quarter = ''; }
                    else f[d.campo === 'status' ? 'status' : 'prio'] = d.valor;
                    atualizarDores();
                    break;
                }
            }
        });

        document.addEventListener('keydown', (e) => {
            if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('[role=button][data-action]')) { e.preventDefault(); e.target.click(); return; }
            if (e.key === 'Escape') { if (!$('#modal').classList.contains('hidden')) fecharModal(); else fecharDrawer(); }
            if (e.target.id === 'dt-comentario' && e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault(); if (state.drawerTaskId) enviarComentario(state.drawerTaskId);
            }
        });

        document.addEventListener('input', (e) => {
            if (e.target.id === 'f-q') { state.filtros.q = e.target.value; $('#board').innerHTML = boardHTML(); }
            if (e.target.id === 'f-rotina-q') { state.filtros.rotinaBusca = e.target.value; render(); }
            if (e.target.id === 'dr-q') { state.filtros.dores.q = e.target.value; atualizarDores(); }
            if (e.target.id === 'busca-projeto-dash') {
                const termo = e.target.value.toLowerCase();
                document.querySelectorAll('.dash-projeto-card').forEach(card => {
                    const nome = card.dataset.nome.toLowerCase();
                    card.style.display = nome.includes(termo) ? '' : 'none';
                });
            }
        });

        document.addEventListener('change', async (e) => {
            const id = e.target.id;
            if (id === 'f-projeto') { state.filtros.projeto = e.target.value; $('#board').innerHTML = boardHTML(); }
            if (id === 'f-resp') { state.filtros.resp = e.target.value; $('#board').innerHTML = boardHTML(); }
            if (id === 'f-sit') { state.filtros.sit = e.target.value; $('#board').innerHTML = boardHTML(); }

            if (id === 'f-rotina-cat') { state.filtros.rotinaCat = e.target.value; render(); }
            if (id === 'f-rotina-status') { state.filtros.rotinaStatus = e.target.value; render(); }
            if (id === 'f-rotina-ordem') { state.filtros.rotinaOrdem = e.target.value; render(); }

            if (id === 'dr-setor') { state.filtros.dores.setor = e.target.value; atualizarDores(); }
            if (id === 'dr-prio') { state.filtros.dores.prio = e.target.value; atualizarDores(); }
            if (id === 'dr-status') { state.filtros.dores.status = e.target.value; atualizarDores(); }
            if (id === 'dr-quarter') { state.filtros.dores.quarter = e.target.value; atualizarDores(); }
            if (id === 'dr-grupo') { state.filtros.dores.grupo = e.target.value; atualizarDores(); }
            if (e.target.classList.contains('dor-status-sel')) {
                await mudarStatusDor(e.target.dataset.id, e.target.value);
            }

            if (id === 'dor-file' && e.target.files?.length) {
                await lerPlanilhaDores(e.target.files[0]);
                e.target.value = '';
            }

            if (id === 'sl-tipo') atualizarCamposSolicitacao();
            if (id === 'nt-projeto') {
                $('#nt-cron').innerHTML = optionsCron(e.target.value) || '<option value="">Geral (será criado)</option>';
            }
            if (id === 'nt-resp') {
                document.querySelectorAll('input[name=nt-colab]').forEach(cb => {
                    const igual = cb.value === e.target.value;
                    if (igual) cb.checked = false;
                    cb.disabled = igual;
                    cb.closest('label').classList.toggle('opacity-40', igual);
                });
            }
            if (id === 'dt-prazo') {
                const t = getTarefa(state.drawerTaskId);
                $('#dt-motivo-wrap').classList.toggle('hidden', !t || e.target.value === t.prazo);
            }
        });

        // Drag & Drop
        document.addEventListener('dragstart', (e) => {
            const card = e.target.closest?.('.task-card'); if (!card) return;
            e.dataTransfer.setData('text/plain', card.dataset.id);
            e.dataTransfer.effectAllowed = 'move';
            setTimeout(() => card.classList.add('dragging'), 0);
        });
        document.addEventListener('dragend', (e) => {
            e.target.closest?.('.task-card')?.classList.remove('dragging');
            document.querySelectorAll('.drop-over').forEach(x => x.classList.remove('drop-over'));
        });
        document.addEventListener('dragover', (e) => {
            const z = e.target.closest?.('[data-drop]'); if (!z) return;
            e.preventDefault();
            document.querySelectorAll('.drop-over').forEach(x => { if (x !== z) x.classList.remove('drop-over'); });
            z.classList.add('drop-over');
        });
        document.addEventListener('drop', async (e) => {
            const z = e.target.closest?.('[data-drop]'); if (!z) return;
            e.preventDefault(); z.classList.remove('drop-over');
            const id = e.dataTransfer.getData('text/plain');
            if (id) await moverStatus(id, z.dataset.drop);
        });
    </script>
</body>
</html>
