<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CX FLOW | Leveros</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Adicionado o SheetJS para exportação em Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        leveros: {
                            verde1: '#002D32', verde2: '#005A64', azul: '#4CDDDD',
                            verde3: '#6FFFAF', verde4: '#CEFFAE', amarelo: '#FFCE00'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .task-card { cursor: grab; transition: transform .15s, box-shadow .15s; }
        .task-card:hover { box-shadow: 0 6px 12px -2px rgba(0,0,0,.12); transform: translateY(-1px); }
        .task-card.dragging { opacity: .4; }
        .drop-over { background: #e6fffa !important; outline: 2px dashed #4CDDDD; outline-offset: -4px; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #005A64; border-radius: 10px; }
        .fade-in { animation: fade .2s ease-out; }
        @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
        .slide-in { animation: slide .25s ease-out; }
        @keyframes slide { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
        .loader { border: 4px solid #e5e7eb; border-top: 4px solid #4CDDDD; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .inp { width: 100%; border: 1px solid #d1d5db; border-radius: .5rem; padding: .5rem .75rem; font-size: .875rem; background: #fff; }
        .inp:focus { outline: none; box-shadow: 0 0 0 2px #4CDDDD; border-color: #4CDDDD; }
        .inp:disabled { background: #f3f4f6; color: #6b7280; cursor: not-allowed; }
        .lbl { display: block; font-size: .75rem; font-weight: 700; color: #374151; margin-bottom: .25rem; text-transform: uppercase; letter-spacing: .03em; }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden">

    <!-- LOGIN -->
    <div id="login-screen" class="fixed inset-0 bg-leveros-verde1 z-50 flex flex-col items-center justify-center p-4">
        <div class="bg-white p-10 rounded-xl shadow-2xl w-full max-w-md text-center">
            <div class="w-20 h-20 bg-leveros-verde2 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-project-diagram text-leveros-azul text-3xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-leveros-verde1 mb-2">Portal de Projetos - CX FLOW</h1>
            <p class="text-gray-500 mb-8">Entre com sua conta corporativa Leveros para acessar projetos, cronogramas e tarefas.</p>
            <button data-action="login" class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 rounded-lg px-6 py-3 text-gray-700 font-semibold hover:bg-gray-50 transition-colors shadow-sm">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="w-6 h-6">
                Entrar com Google
            </button>
            <div id="login-error" class="text-red-500 text-sm mt-4 hidden"></div>
        </div>
    </div>

    <!-- APP -->
    <div id="app-screen" class="hidden flex-1 flex-col min-h-0">
        <header class="bg-leveros-verde1 text-white shadow-md z-20 shrink-0">
            <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
                <div class="flex items-center gap-3 shrink-0">
                    <i class="fas fa-layer-group text-leveros-azul text-2xl"></i>
                    <h1 class="text-lg font-bold hidden sm:block">CX FLOW</h1>
                </div>

                <nav id="nav" class="flex items-center gap-1 overflow-x-auto text-sm">
                    <button data-action="nav" data-view="dashboard" class="nav-btn px-3 py-2 rounded-lg whitespace-nowrap hover:bg-leveros-verde2 transition-colors"><i class="fas fa-chart-pie mr-1"></i> Dashboard</button>
                    <button data-action="nav" data-view="minhas" class="nav-btn px-3 py-2 rounded-lg whitespace-nowrap hover:bg-leveros-verde2 transition-colors"><i class="fas fa-user-check mr-1"></i> Minhas Tarefas <span id="badge-minhas" class="hidden ml-1 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">0</span></button>
                    <button data-action="nav" data-view="quadro" class="nav-btn px-3 py-2 rounded-lg whitespace-nowrap hover:bg-leveros-verde2 transition-colors"><i class="fas fa-columns mr-1"></i> Quadro</button>
                    <button data-action="nav" data-view="projetos" class="nav-btn px-3 py-2 rounded-lg whitespace-nowrap hover:bg-leveros-verde2 transition-colors"><i class="fas fa-folder-open mr-1"></i> Projetos</button>
                    <button data-action="nav" data-view="rotina" class="nav-btn px-3 py-2 rounded-lg whitespace-nowrap hover:bg-leveros-verde2 transition-colors"><i class="fas fa-clipboard-list mr-1"></i> Rotina Diária</button>
                </nav>

                <div class="flex items-center gap-3 shrink-0">
                    <!-- Botão de exportação adicionado aqui -->
                    <button data-action="exportar-excel" class="bg-gray-100 border border-gray-300 text-gray-700 hover:bg-gray-200 px-3 py-2 rounded-lg font-semibold text-sm flex items-center gap-2 transition-colors">
                        <i class="fas fa-file-excel text-green-600"></i> <span class="hidden sm:inline">Gerar Relatório</span>
                    </button>

                    <button data-action="nova-tarefa" class="bg-leveros-amarelo text-leveros-verde1 hover:bg-yellow-400 px-3 py-2 rounded-lg font-semibold text-sm flex items-center gap-2 transition-colors">
                        <i class="fas fa-plus"></i> <span class="hidden sm:inline">Nova Tarefa</span>
                    </button>
                    <div class="flex items-center gap-2 border-l border-leveros-verde2 pl-3">
                        <div class="text-right hidden lg:block">
                            <div id="user-name" class="text-sm font-semibold text-leveros-verde4"></div>
                            <button data-action="logout" class="text-xs text-gray-300 hover:text-white">Sair</button>
                        </div>
                        <div id="user-avatar" class="w-9 h-9 rounded-full bg-leveros-verde2 overflow-hidden flex items-center justify-center border-2 border-leveros-azul cursor-pointer" data-action="logout" title="Sair"></div>
                    </div>
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto">
            <div id="view" class="max-w-7xl mx-auto p-4 sm:p-6"></div>
        </main>
    </div>

    <!-- MODAL -->
    <div id="modal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4"></div>

    <!-- DRAWER (detalhe da tarefa) -->
    <div id="drawer" class="fixed inset-0 z-40 hidden">
        <div class="absolute inset-0 bg-black/40" data-action="fechar-drawer"></div>
        <div id="drawer-panel" class="absolute right-0 top-0 h-full w-full max-w-xl bg-white shadow-2xl flex flex-col slide-in"></div>
    </div>

    <!-- TOASTS -->
    <div id="toasts" class="fixed bottom-4 right-4 z-[60] flex flex-col gap-2"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import {
            getFirestore, collection, addDoc, setDoc, deleteDoc, doc, updateDoc, onSnapshot,
            serverTimestamp, query, orderBy, increment, arrayUnion, arrayRemove, writeBatch, getDocs
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // ==========================================================
        // CONFIGURAÇÕES
        // ==========================================================
        const firebaseConfig = {
            apiKey:      "AIzaSyA6WjOoM-KCi-Yl4E5rwKbOulF8tBYEClo",
            authDomain:  "portal-atendimento-541ae.firebaseapp.com",
            projectId:   "portal-atendimento-541ae",
            storageBucket: "portal-atendimento-541ae.appspot.com"
        };

        const DOMINIO = '@leveros.com.br';
        const ADMINS = ['priscila.baldo@leveros.com.br', 'matheus.mendes@leveros.com.br'];

        const EMAIL_CONFIG = {
            provider: 'emailjs',
            emailjs: { serviceId: '', templateId: '', publicKey: '' }
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ hd: 'leveros.com.br', prompt: 'select_account' });

        // ==========================================================
        // CONSTANTES DE UI E ROTINAS
        // ==========================================================
        const STATUS = ['Pendente', 'Em Andamento', 'Validado'];
        const STATUS_META = {
            'Pendente':     { icon: 'fa-inbox',      txt: 'text-red-500',   border: 'border-red-400',   badge: 'bg-red-100 text-red-600' },
            'Em Andamento': { icon: 'fa-spinner',      txt: 'text-blue-500',  border: 'border-blue-400',  badge: 'bg-blue-100 text-blue-600' },
            'Validado':     { icon: 'fa-check-double', txt: 'text-leveros-verde2', border: 'border-leveros-verde3', badge: 'bg-green-100 text-green-700' }
        };
        const PRIORIDADES = ['Baixa', 'Média', 'Alta'];
        const PRIO_META = {
            'Baixa': { cls: 'bg-gray-100 text-gray-600', icon: 'fa-arrow-down' },
            'Média': { cls: 'bg-blue-100 text-blue-700', icon: 'fa-equals' },
            'Alta':  { cls: 'bg-orange-100 text-orange-700', icon: 'fa-arrow-up' }
        };

        // Definições Rotina
        const STATUS_ROTINA_META = {
            'Não iniciado': 'bg-pink-100 text-pink-700 border-pink-200',
            'Iniciado': 'bg-blue-100 text-blue-700 border-blue-200',
            'Pausado': 'bg-yellow-100 text-yellow-700 border-yellow-300',
            'Concluído Parcial': 'bg-purple-100 text-purple-700 border-purple-200',
            'Concluído': 'bg-green-100 text-green-700 border-green-200',
            'Continua': 'bg-leveros-verde2 text-white border-leveros-verde1'
        };
        const STATUS_ROTINA = Object.keys(STATUS_ROTINA_META);
        const CATS_ROTINA = ['Rotina Operacional', 'Suporte e Dúvidas', 'Reuniões', 'Melhoria Contínua', 'Planejamento', 'Outros'];

        const PALETA = ['#005A64', '#4CDDDD', '#6FFFAF', '#FFCE00', '#F97316', '#8B5CF6', '#EC4899', '#3B82F6'];
        const AV_CORES = ['bg-teal-600', 'bg-sky-600', 'bg-violet-600', 'bg-pink-600', 'bg-orange-500', 'bg-emerald-600', 'bg-indigo-600', 'bg-rose-600'];

        // ==========================================================
        // ESTADO
        // ==========================================================
        const state = {
            user: null,
            membros: [], projetos: [], cronogramas: [], tarefas: [], solicitacoes: [], rotinas: [],
            view: 'dashboard',
            projetoAtual: null,
            filtros: {
                projeto: '', resp: '', q: '', sit: '',
                rotinaModo: 'minhas', rotinaResp: '', rotinaBusca: '', rotinaCat: '', rotinaStatus: '', rotinaOrdem: 'data-desc',
                rotinaOcultas: false
            },
            minhasMostrarConcluidas: false,
            loaded: { membros: false, projetos: false, cronogramas: false, tarefas: false, solicitacoes: false, rotinas: false },
            drawerTaskId: null, drawerPerm: '',
            unsubs: [], unsubFeed: null,
            diaAtual: ''
        };

        // ==========================================================
        // HELPERS
        // ==========================================================
        const $ = (s, r = document) => r.querySelector(s);
        const esc = (str) => (str === null || str === undefined) ? '' : String(str)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

        const pad = (n) => String(n).padStart(2, '0');
        const toISO = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        const hojeISO = () => toISO(new Date());
        const parseISO = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
        const diasPara = (s) => s ? Math.round((parseISO(s) - parseISO(hojeISO())) / 86400000) : null;
        const fmtBR = (s) => { if (!s) return '—'; const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; };
        const tsMillis = (ts) => ts && typeof ts.toMillis === 'function' ? ts.toMillis() : Date.now();
        const fmtDataHora = (ms) => new Date(ms).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
        const hash = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
        const corProjeto = (c) => PALETA.includes(c) ? c : PALETA[0];
        const primeiroNome = (n) => (n || '').split(' ')[0] || '';

        function nomeDoEmail(email) {
            return (email || '').split('@')[0].split('.').map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(' ');
        }
        function getMembro(email) {
            const m = state.membros.find(x => x.email === (email || '').toLowerCase());
            return m || { email, nome: nomeDoEmail(email), foto: '' };
        }
        const getProjeto = (id) => state.projetos.find(p => p.id === id);
        const getTarefa = (id) => state.tarefas.find(t => t.id === id);
        const isAdmin = () => ADMINS.includes(state.user?.email);
        const ehDonoProjeto = (p) => p && (p.criadoPorEmail === state.user?.email || isAdmin());
        function podeExcluirTarefa(t) {
            const p = getProjeto(t.projetoId);
            return isAdmin() || t.criadoPorEmail === state.user?.email || (p && p.criadoPorEmail === state.user?.email);
        }

        function situacao(t) {
            if (t.status === 'Validado') return { key: 'concluida', emoji: '✅', label: 'Concluída', detalhe: '', cls: 'bg-gray-100 text-gray-600 border-gray-200' };
            const d = diasPara(t.prazo);
            if (d === null) return { key: 'sem-prazo', emoji: '⚪', label: 'Sem prazo', detalhe: '', cls: 'bg-gray-100 text-gray-500 border-gray-200' };
            if (d < 0) return { key: 'atrasada', emoji: '🔴', label: 'Atrasado', detalhe: `há ${-d} dia${-d > 1 ? 's' : ''}`, cls: 'bg-red-100 text-red-700 border-red-200' };
            if (d <= 2) return { key: 'breve', emoji: '🟡', label: 'Entrega em breve', detalhe: d === 0 ? 'vence hoje' : `em ${d} dia${d > 1 ? 's' : ''}`, cls: 'bg-yellow-100 text-yellow-800 border-yellow-300' };
            return { key: 'ok', emoji: '🟢', label: 'No prazo', detalhe: `em ${d} dias`, cls: 'bg-green-100 text-green-700 border-green-200' };
        }
        const badgeSituacao = (t, comDetalhe = true) => {
            const s = situacao(t);
            return `<span class="inline-flex items-center gap-1 text-[11px] font-semibold px-2 py-0.5 rounded-full border ${s.cls}">${s.emoji} ${s.label}${comDetalhe && s.detalhe ? ` · ${s.detalhe}` : ''}</span>`;
        };

        function avatar(email, size = 'w-7 h-7 text-[11px]') {
            const m = getMembro(email);
            if (m.foto) return `<img src="${esc(m.foto)}" referrerpolicy="no-referrer" class="${size} rounded-full object-cover shrink-0" title="${esc(m.nome)}">`;
            const ini = (m.nome || '?').split(' ').filter(Boolean).slice(0, 2).map(p => p[0]).join('').toUpperCase();
            return `<span class="${size} rounded-full ${AV_CORES[hash(email) % AV_CORES.length]} text-white font-bold inline-flex items-center justify-center shrink-0" title="${esc(m.nome)}">${esc(ini)}</span>`;
        }

        function chipProjeto(p) {
            if (!p) return '<span class="text-[11px] text-gray-400">Sem projeto</span>';
            const c = corProjeto(p.cor);
            return `<span class="inline-flex items-center gap-1 text-[11px] font-bold px-2 py-0.5 rounded max-w-full truncate" style="background:${c}26;color:${c === '#FFCE00' || c === '#6FFFAF' || c === '#4CDDDD' ? '#002D32' : c}"><i class="fas fa-folder"></i><span class="truncate">${esc(p.nome)}</span></span>`;
        }

        function toast(msg, tipo = 'ok') {
            const cls = tipo === 'erro' ? 'bg-red-600' : tipo === 'info' ? 'bg-leveros-verde2' : 'bg-leveros-verde1';
            const el = document.createElement('div');
            el.className = `${cls} text-white text-sm px-4 py-3 rounded-lg shadow-lg fade-in max-w-sm`;
            el.textContent = msg;
            $('#toasts').appendChild(el);
            setTimeout(() => el.remove(), 4000);
        }

        const optionsMembros = (sel = '') => state.membros.slice().sort((a, b) => a.nome.localeCompare(b.nome))
            .map(m => `<option value="${esc(m.email)}" ${m.email === sel ? 'selected' : ''}>${esc(m.nome)}</option>`).join('');
        const optionsProjetos = (sel = '', apenasAtivos = true) => state.projetos
            .filter(p => !apenasAtivos || p.status !== 'arquivado' || p.id === sel)
            .sort((a, b) => a.nome.localeCompare(b.nome))
            .map(p => `<option value="${esc(p.id)}" ${p.id === sel ? 'selected' : ''}>${esc(p.nome)}</option>`).join('');
        const optionsCron = (projetoId, sel = '') => state.cronogramas.filter(c => c.projetoId === projetoId)
            .sort((a, b) => tsMillis(a.criadoEm) - tsMillis(b.criadoEm))
            .map(c => `<option value="${esc(c.id)}" ${c.id === sel ? 'selected' : ''}>${esc(c.nome)}</option>`).join('');

        // Lista de checkboxes de colaboradores (usada em Nova Tarefa, Lançamento Rápido e Editar Rotina)
        function checkboxColabs(name, selecionados = [], excluirEmail = '', desabilitado = false) {
            const lista = state.membros.filter(m => m.email !== excluirEmail).sort((a, b) => a.nome.localeCompare(b.nome));
            if (!lista.length) return '<p class="text-xs text-gray-400 p-2">Nenhum outro membro cadastrado.</p>';
            return lista.map(m => `
                <label class="flex items-center gap-2 p-2 text-sm hover:bg-gray-50 ${desabilitado ? 'opacity-60 cursor-not-allowed' : 'cursor-pointer'}">
                    <input type="checkbox" name="${name}" value="${esc(m.email)}" class="rounded" ${selecionados.includes(m.email) ? 'checked' : ''} ${desabilitado ? 'disabled' : ''}>
                    ${avatar(m.email, 'w-6 h-6 text-[10px]')}
                    <span class="font-semibold truncate">${esc(m.nome)}</span>
                </label>`).join('');
        }
        const colabsMarcados = (name) => [...document.querySelectorAll(`input[name=${name}]:checked`)].map(cb => cb.value);

        // ==========================================================
        // AUTENTICAÇÃO
        // ==========================================================
        function mostrarErroLogin(msg) {
            const el = $('#login-error');
            el.textContent = msg; el.classList.remove('hidden');
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const email = (user.email || '').toLowerCase();
                if (!email.endsWith(DOMINIO) || !user.emailVerified) {
                    mostrarErroLogin(`Acesso restrito a contas ${DOMINIO}.`);
                    await signOut(auth);
                    return;
                }
                state.user = { uid: user.uid, email, nome: user.displayName || nomeDoEmail(email), foto: user.photoURL || '' };
                $('#login-screen').classList.add('hidden');
                $('#app-screen').classList.remove('hidden');
                $('#app-screen').classList.add('flex');
                $('#user-name').textContent = state.user.nome;
                $('#user-avatar').innerHTML = state.user.foto
                    ? `<img src="${esc(state.user.foto)}" referrerpolicy="no-referrer" class="w-full h-full object-cover">`
                    : '<i class="fas fa-user text-white"></i>';
                $('#view').innerHTML = '<div class="text-center py-20"><div class="loader"></div><p class="text-gray-500">Sincronizando com o banco de dados...</p></div>';
                try {
                    await setDoc(doc(db, 'proj_membros', email), {
                        email, nome: state.user.nome, foto: state.user.foto, ultimoAcesso: serverTimestamp()
                    }, { merge: true });
                } catch (e) { console.warn('Não foi possível registrar o membro:', e); }
                iniciarListeners();
            } else {
                pararListeners();
                state.user = null;
                $('#app-screen').classList.add('hidden');
                $('#app-screen').classList.remove('flex');
                $('#login-screen').classList.remove('hidden');
            }
        });

        // ==========================================================
        // LISTENERS EM TEMPO REAL
        // ==========================================================
        function pararListeners() {
            state.unsubs.forEach(u => u());
            state.unsubs = [];
            if (state.unsubFeed) { state.unsubFeed(); state.unsubFeed = null; }
            state.loaded = { membros: false, projetos: false, cronogramas: false, tarefas: false, solicitacoes: false, rotinas: false };
            fecharDrawer();
        }

        function iniciarListeners() {
            pararListeners();
            const ouvir = (nome, colecao, map) => {
                const u = onSnapshot(collection(db, colecao), (snap) => {
                    state[nome] = snap.docs.map(d => map({ id: d.id, ...d.data() }));
                    state.loaded[nome] = true;
                    if (Object.values(state.loaded).every(Boolean)) render();
                }, (err) => {
                    console.error(`Erro em ${colecao}:`, err);
                    toast(`Erro ao carregar "${colecao}". Verifique as regras do Firestore.`, 'erro');
                });
                state.unsubs.push(u);
            };
            ouvir('membros', 'proj_membros', (m) => ({ ...m, email: (m.email || m.id).toLowerCase(), nome: m.nome || nomeDoEmail(m.id) }));
            ouvir('projetos', 'projetos', (p) => p);
            ouvir('cronogramas', 'cronogramas', (c) => c);
            ouvir('tarefas', 'tarefas', (t) => t);
            ouvir('solicitacoes', 'solicitacoes', (x) => x);
            ouvir('rotinas', 'rotinas', (r) => r);
        }

        // ==========================================================
        // ROTINA: PERMISSÕES E FILTROS
        // ==========================================================
        const rotinaColabs = (r) => r.colaboradoresEmails || [];
        // A atividade pertence à lista de "email" se ele é o dono OU colaborador
        const rotinaDe = (r, email) => r.responsavelEmail === email || rotinaColabs(r).includes(email);
        // Ocultar é individual: o dono usa "oculta"; colaboradores usam "ocultaPara"
        const rotinaOcultaPara = (r, email) => (r.responsavelEmail === email && !!r.oculta) || (r.ocultaPara || []).includes(email);
        const podeGerirRotina = (r) => r.responsavelEmail === state.user?.email || isAdmin();
        const podeEditarRotina = (r) => podeGerirRotina(r) || rotinaColabs(r).includes(state.user?.email);

        function rotinasVisiveis() {
            const f = state.filtros;
            const isMinhas = (f.rotinaModo || 'minhas') === 'minhas';
            const fResp = isMinhas ? state.user.email : (f.rotinaResp || state.user.email);

            let lista = state.rotinas.filter(r => rotinaDe(r, fResp));
            if (!f.rotinaOcultas) lista = lista.filter(r => !rotinaOcultaPara(r, fResp));
            if (f.rotinaBusca) {
                const termo = f.rotinaBusca.toLowerCase();
                lista = lista.filter(r => `${r.titulo || ''} ${r.descricao || ''} ${r.observacao || ''}`.toLowerCase().includes(termo));
            }
            if (f.rotinaCat) lista = lista.filter(r => r.categoria === f.rotinaCat);
            if (f.rotinaStatus) lista = lista.filter(r => r.status === f.rotinaStatus);

            const ordem = f.rotinaOrdem || 'data-desc';
            lista.sort((a, b) => {
                if (ordem === 'data-desc') return b.data.localeCompare(a.data) || tsMillis(b.criadoEm) - tsMillis(a.criadoEm);
                if (ordem === 'data-asc') return a.data.localeCompare(b.data) || tsMillis(a.criadoEm) - tsMillis(b.criadoEm);
                if (ordem === 'prazo-asc') return (a.prazo || '9999-99-99').localeCompare(b.prazo || '9999-99-99');
                if (ordem === 'prazo-desc') return (b.prazo || '0000-00-00').localeCompare(a.prazo || '0000-00-00');
                return 0;
            });
            const concluidas = lista.filter(r => r.status === 'Concluído' || r.status === 'Concluído Parcial').length;
            return { lista, isMinhas, fResp, concluidas, pendentes: lista.length - concluidas };
        }

        // ==========================================================
        // NAVEGAÇÃO / RENDER
        // ==========================================================
        function navegar(view, projetoId = null) {
            state.view = view;
            state.projetoAtual = projetoId;
            render(true);
            $('main').scrollTop = 0;
        }

        function render(forcar = false) {
            if (!state.user || !Object.values(state.loaded).every(Boolean)) return;
            state.diaAtual = hojeISO();

            const minhas = state.tarefas.filter(t => (ehResponsavel(t) || ehColaborador(t)) && t.status !== 'Validado');
            const urg = minhas.filter(t => ['atrasada', 'breve'].includes(situacao(t).key)).length + solicitacoesRecebidas().length;
            const badge = $('#badge-minhas');
            badge.textContent = urg; badge.classList.toggle('hidden', urg === 0);

            if (state.drawerTaskId) {
                const dt = getTarefa(state.drawerTaskId);
                if (dt) {
                    if (permKey(dt) !== state.drawerPerm) abrirDrawer(dt.id);
                    else { const el = $('#dr-colab'); if (el) el.innerHTML = colabSectionHTML(dt); }
                }
            }

            document.querySelectorAll('.nav-btn').forEach(b => {
                const ativo = b.dataset.view === state.view || (b.dataset.view === 'projetos' && state.view === 'projeto');
                b.classList.toggle('bg-leveros-verde2', ativo);
            });

            if (!forcar && state.view === 'quadro' && $('#board')) {
                $('#board').innerHTML = boardHTML();
                return;
            }

            if (!forcar && state.view === 'rotina' && $('#rotina-view-root')) {
                const { lista, isMinhas, fResp, concluidas, pendentes } = rotinasVisiveis();
                $('#kpi-total-rotinas').innerHTML = kpi('Total de Lançamentos', lista.length, 'fa-clipboard-list', 'border-leveros-verde2', 'text-leveros-verde2', '');
                $('#kpi-concluidas-rotinas').innerHTML = kpi('Concluídas vs Pendentes', `${concluidas} / ${pendentes}`, 'fa-check-double', 'border-leveros-verde3', 'text-green-600', '');
                $('#tbody-rotinas').innerHTML = linhasTabelaRotina(lista, isMinhas, fResp);
                return;
            }

            const v = $('#view');
            if (state.view === 'dashboard') v.innerHTML = dashboardHTML();
            else if (state.view === 'minhas') v.innerHTML = minhasHTML();
            else if (state.view === 'quadro') v.innerHTML = quadroHTML();
            else if (state.view === 'projetos') v.innerHTML = projetosHTML();
            else if (state.view === 'projeto') v.innerHTML = projetoDetalheHTML();
            else if (state.view === 'rotina') v.innerHTML = rotinasHTML();
            v.firstElementChild?.classList.add('fade-in');
        }

        setInterval(() => { if (state.user && state.diaAtual && state.diaAtual !== hojeISO()) render(true); }, 60000);

        // ==========================================================
        // VIEW: DASHBOARD GERENCIAL
        // ==========================================================
        function progressoProjeto(projetoId) {
            const ts = state.tarefas.filter(t => t.projetoId === projetoId);
            const feitas = ts.filter(t => t.status === 'Validado').length;
            return { total: ts.length, feitas, pct: ts.length ? Math.round((feitas / ts.length) * 100) : 0, atrasadas: ts.filter(t => situacao(t).key === 'atrasada').length };
        }

        function kpi(label, valor, icon, borda, cor, attrs) {
            return `<div ${attrs} role="button" tabindex="0" title="Clique para ver os detalhes" class="bg-white p-4 rounded-xl shadow-sm border-l-4 ${borda} flex items-center justify-between cursor-pointer hover:shadow-lg hover:-translate-y-0.5 transition-all w-full">
                <div><p class="text-xs text-gray-500 font-medium uppercase tracking-wide">${label}</p><h3 class="text-3xl font-bold text-leveros-verde1 mt-1">${valor}</h3></div>
                <i class="fas ${icon} text-2xl ${cor} opacity-70"></i></div>`;
        }

        function linhaTarefaCompacta(t, mostrarResp = true) {
            return `<div data-action="abrir-tarefa" data-id="${esc(t.id)}" class="flex items-center gap-3 p-2.5 rounded-lg hover:bg-gray-50 cursor-pointer border border-transparent hover:border-gray-200 transition-colors">
                <div class="flex-1 min-w-0">
                    <div class="text-sm font-semibold text-gray-800 truncate">${esc(t.titulo)}</div>
                    <div class="flex items-center gap-2 mt-0.5 min-w-0">${chipProjeto(getProjeto(t.projetoId))}<span class="text-[11px] text-gray-400 shrink-0">Prazo ${fmtBR(t.prazo)}</span></div>
                </div>
                ${badgeSituacao(t)}
                ${mostrarResp ? avatar(t.responsavelEmail) : ''}
            </div>`;
        }

        function dashboardHTML() {
            const ativos = state.projetos.filter(p => p.status !== 'arquivado');
            const abertas = state.tarefas.filter(t => t.status !== 'Validado');
            const atrasadas = abertas.filter(t => situacao(t).key === 'atrasada').sort((a, b) => diasPara(a.prazo) - diasPara(b.prazo));
            const breve = abertas.filter(t => situacao(t).key === 'breve').sort((a, b) => diasPara(a.prazo) - diasPara(b.prazo));
            const concl = state.tarefas.filter(t => t.status === 'Validado').length;

            const projetosHTMLlista = ativos.length ? ativos.sort((a, b) => progressoProjeto(b.id).atrasadas - progressoProjeto(a.id).atrasadas).map(p => {
                const pr = progressoProjeto(p.id);
                const c = corProjeto(p.cor);
                return `<div data-action="abrir-projeto" data-id="${esc(p.id)}" data-nome="${esc(p.nome)}" class="dash-projeto-card p-3 rounded-lg hover:bg-gray-50 cursor-pointer border border-gray-100 transition-colors shrink-0">
                    <div class="flex items-center justify-between gap-2 mb-2">
                        <div class="flex items-center gap-2 min-w-0"><span class="w-3 h-3 rounded-full shrink-0" style="background:${c}"></span><span class="font-semibold text-sm truncate">${esc(p.nome)}</span></div>
                        <div class="flex items-center gap-2 shrink-0">
                            ${pr.atrasadas ? `<span data-action="filtrar-quadro" data-projeto="${esc(p.id)}" data-sit="atrasada" title="Ver tarefas atrasadas" class="text-[11px] font-bold bg-red-100 text-red-700 px-2 py-0.5 rounded-full hover:bg-red-200">🔴 ${pr.atrasadas} atrasada${pr.atrasadas > 1 ? 's' : ''}</span>` : ''}
                            <span class="text-sm font-bold text-leveros-verde2">${pr.pct}%</span>
                        </div>
                    </div>
                    <div class="h-2 bg-gray-100 rounded-full overflow-hidden"><div class="h-full rounded-full transition-all duration-500" style="width:${pr.pct}%;background:${c}"></div></div>
                    <div class="text-[11px] text-gray-500 mt-1.5">${pr.feitas} de ${pr.total} tarefa${pr.total === 1 ? '' : 's'} concluída${pr.feitas === 1 ? '' : 's'}</div>
                </div>`;
            }).join('') : '<p class="text-sm text-gray-400 py-6 text-center">Nenhum projeto ativo. <button data-action="novo-projeto" class="text-leveros-verde2 font-semibold underline">Criar o primeiro</button></p>';

            const carga = state.membros.map(m => {
                const ts = abertas.filter(t => t.responsavelEmail === m.email);
                return { m, total: ts.length, atr: ts.filter(t => situacao(t).key === 'atrasada').length };
            }).filter(x => x.total > 0).sort((a, b) => b.total - a.total);
            const maxCarga = Math.max(1, ...carga.map(c => c.total));
            const cargaHTML = carga.length ? carga.map(c => `
                <div data-action="filtrar-quadro" data-resp="${esc(c.m.email)}" data-sit="abertas" title="Ver tarefas de ${esc(c.m.nome)}" class="flex items-center gap-3 p-1.5 -m-1.5 rounded-lg cursor-pointer hover:bg-gray-50">
                    ${avatar(c.m.email, 'w-8 h-8 text-xs')}
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between text-xs mb-1"><span class="font-semibold truncate">${esc(c.m.nome)}</span><span class="text-gray-500">${c.total} aberta${c.total > 1 ? 's' : ''}${c.atr ? ` · <span class="text-red-600 font-bold">${c.atr} atrasada${c.atr > 1 ? 's' : ''}</span>` : ''}</span></div>
                        <div class="h-2 bg-gray-100 rounded-full overflow-hidden flex">
                            <div class="h-full bg-red-400" style="width:${(c.atr / maxCarga) * 100}%"></div>
                            <div class="h-full bg-leveros-azul" style="width:${((c.total - c.atr) / maxCarga) * 100}%"></div>
                        </div>
                    </div>
                </div>`).join('') : '<p class="text-sm text-gray-400 py-4 text-center">Sem tarefas abertas atribuídas.</p>';

            return `<div>
                <div class="flex items-center justify-between mb-5 flex-wrap gap-2">
                    <div><h2 class="text-2xl font-bold text-leveros-verde1">Visão Geral</h2><p class="text-sm text-gray-500">Olá, ${esc(primeiroNome(state.user.nome))}. Aqui está o panorama de todos os projetos da equipe.</p></div>
                    <button data-action="novo-projeto" class="bg-leveros-verde1 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-leveros-verde2 transition-colors"><i class="fas fa-folder-plus mr-1"></i> Novo Projeto</button>
                </div>

                <div class="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-6">
                    ${kpi('Projetos ativos', ativos.length, 'fa-folder-open', 'border-leveros-verde2', 'text-leveros-verde2', 'data-action="nav" data-view="projetos"')}
                    ${kpi('Tarefas abertas', abertas.length, 'fa-list-check', 'border-blue-400', 'text-blue-500', 'data-action="filtrar-quadro" data-sit="abertas"')}
                    ${kpi('Atrasadas', atrasadas.length, 'fa-triangle-exclamation', 'border-red-500', 'text-red-500', 'data-action="filtrar-quadro" data-sit="atrasada"')}
                    ${kpi('Vencem em breve', breve.length, 'fa-hourglass-half', 'border-yellow-400', 'text-yellow-500', 'data-action="filtrar-quadro" data-sit="breve"')}
                    ${kpi('Concluídas', concl, 'fa-circle-check', 'border-leveros-verde3', 'text-green-600', 'data-action="filtrar-quadro" data-sit="concluida"')}
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-5 gap-5">
                    <section class="lg:col-span-3 bg-white rounded-xl shadow-sm p-5 flex flex-col h-full">
                        <div class="flex items-center justify-between mb-3 gap-2 flex-wrap">
                            <h3 class="font-bold text-gray-700 flex items-center gap-2"><i class="fas fa-bars-progress text-leveros-verde2"></i> Projetos e progresso</h3>
                            <div class="relative w-full sm:w-auto">
                                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                                <input type="text" id="busca-projeto-dash" class="inp py-1.5 pl-8 pr-3 text-xs w-full sm:w-48" placeholder="Buscar projeto...">
                            </div>
                        </div>
                        <div class="flex flex-col gap-2.5 overflow-y-auto max-h-[340px] pr-2 -mr-2">
                            ${projetosHTMLlista}
                        </div>
                    </section>

                    <section class="lg:col-span-2 bg-white rounded-xl shadow-sm p-5">
                        <h3 class="font-bold text-gray-700 mb-3 flex items-center gap-2"><i class="fas fa-users text-leveros-verde2"></i> Carga por pessoa</h3>
                        <div class="flex flex-col gap-3">${cargaHTML}</div>
                        <p class="text-[11px] text-gray-400 mt-3"><span class="inline-block w-2 h-2 bg-red-400 rounded-sm"></span> atrasadas · <span class="inline-block w-2 h-2 bg-leveros-azul rounded-sm"></span> demais abertas</p>
                    </section>

                    <section class="lg:col-span-3 bg-white rounded-xl shadow-sm p-5">
                        <h3 class="font-bold text-gray-700 mb-3 flex items-center gap-2"><i class="fas fa-triangle-exclamation text-red-500"></i> Gargalos: tarefas atrasadas <span class="text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded-full">${atrasadas.length}</span></h3>
                        ${atrasadas.length ? atrasadas.slice(0, 10).map(t => linhaTarefaCompacta(t)).join('') + (atrasadas.length > 10 ? `<p class="text-xs text-gray-400 text-center mt-2">+ ${atrasadas.length - 10} tarefas atrasadas</p>` : '') : '<p class="text-sm text-gray-400 py-6 text-center">🎉 Nenhuma tarefa atrasada.</p>'}
                    </section>

                    <section class="lg:col-span-2 bg-white rounded-xl shadow-sm p-5">
                        <h3 class="font-bold text-gray-700 mb-3 flex items-center gap-2"><i class="fas fa-hourglass-half text-yellow-500"></i> Vencem em até 2 dias</h3>
                        ${breve.length ? breve.slice(0, 8).map(t => linhaTarefaCompacta(t)).join('') : '<p class="text-sm text-gray-400 py-6 text-center">Nada vencendo nos próximos dias.</p>'}
                    </section>
                </div>
            </div>`;
        }

        // ==========================================================
        // VIEW: MINHAS TAREFAS
        // ==========================================================
        function minhasHTML() {
            const minhas = state.tarefas.filter(t => ehResponsavel(t) || ehColaborador(t));
            const abertas = minhas.filter(t => t.status !== 'Validado').sort((a, b) => (a.prazo || '9999').localeCompare(b.prazo || '9999'));
            const concl = minhas.filter(t => t.status === 'Validado').sort((a, b) => tsMillis(b.atualizadoEm) - tsMillis(a.atualizadoEm));
            const grupos = [
                { key: 'atrasada', titulo: '🔴 Atrasadas', cls: 'text-red-600' },
                { key: 'breve', titulo: '🟡 Entrega em breve (até 2 dias)', cls: 'text-yellow-600' },
                { key: 'ok', titulo: '🟢 No prazo', cls: 'text-green-600' },
                { key: 'sem-prazo', titulo: '⚪ Sem prazo', cls: 'text-gray-500' }
            ];

            const linha = (t) => {
                const acao = t.status === 'Pendente'
                    ? `<button data-action="mudar-status" data-id="${esc(t.id)}" data-status="Em Andamento" class="text-xs px-2.5 py-1 rounded-lg border border-blue-300 text-blue-600 hover:bg-blue-50 font-semibold whitespace-nowrap"><i class="fas fa-play mr-1"></i>Iniciar</button>`
                    : t.status === 'Em Andamento'
                        ? `<button data-action="mudar-status" data-id="${esc(t.id)}" data-status="Validado" class="text-xs px-2.5 py-1 rounded-lg border border-green-400 text-green-700 hover:bg-green-50 font-semibold whitespace-nowrap"><i class="fas fa-check mr-1"></i>Concluir</button>`
                        : `<button data-action="mudar-status" data-id="${esc(t.id)}" data-status="Em Andamento" class="text-xs px-2.5 py-1 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-50 font-semibold whitespace-nowrap"><i class="fas fa-rotate-left mr-1"></i>Reabrir</button>`;
                return `<div data-action="abrir-tarefa" data-id="${esc(t.id)}" class="bg-white rounded-lg border border-gray-200 p-3 flex items-center gap-3 cursor-pointer hover:shadow-md transition-shadow flex-wrap sm:flex-nowrap">
                    <div class="flex-1 min-w-0">
                        <div class="font-semibold text-gray-800 truncate">${esc(t.titulo)}</div>
                        <div class="flex items-center gap-2 mt-1 flex-wrap">${chipProjeto(getProjeto(t.projetoId))}
                            <span class="text-[11px] text-gray-500"><i class="far fa-calendar mr-1"></i>${fmtBR(t.prazo)}</span>
                            <span class="text-[11px] px-1.5 py-0.5 rounded ${STATUS_META[t.status]?.badge || ''}">${esc(t.status)}</span>
                            ${t.comentariosCount ? `<span class="text-[11px] text-gray-400"><i class="far fa-comment mr-1"></i>${t.comentariosCount}</span>` : ''}
                        </div>
                    </div>
                    ${ehResponsavel(t) ? '' : '<span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-700">🤝 Colaboração</span>'}
                    ${badgeSituacao(t)}
                    ${acao}
                </div>`;
            };

            const blocos = grupos.map(g => {
                const ts = abertas.filter(t => situacao(t).key === g.key);
                if (!ts.length) return '';
                return `<section class="mb-6"><h3 class="font-bold ${g.cls} mb-2 text-sm">${g.titulo} <span class="text-gray-400 font-normal">(${ts.length})</span></h3><div class="flex flex-col gap-2">${ts.map(linha).join('')}</div></section>`;
            }).join('');

            return `<div>
                <div class="flex items-center justify-between mb-5 flex-wrap gap-2">
                    <div><h2 class="text-2xl font-bold text-leveros-verde1">Minhas Tarefas</h2><p class="text-sm text-gray-500">${abertas.length} aberta${abertas.length === 1 ? '' : 's'} (atribuídas a você ou em colaboração).</p></div>
                </div>
                ${solicitacoesPainelHTML()}
                ${blocos || '<div class="bg-white rounded-xl p-10 text-center text-gray-400"><i class="fas fa-mug-hot text-4xl mb-3 text-leveros-azul"></i><p>Você não tem tarefas abertas. Aproveite!</p></div>'}
                ${concl.length ? `<section class="mt-8">
                    <button data-action="toggle-concluidas" class="text-sm font-bold text-gray-500 hover:text-gray-700 mb-2"><i class="fas fa-chevron-${state.minhasMostrarConcluidas ? 'down' : 'right'} mr-1"></i>✅ Concluídas (${concl.length})</button>${state.minhasMostrarConcluidas ? `<div class="flex flex-col gap-2">${concl.map(linha).join('')}</div>` : ''}
                </section>` : ''}
            </div>`;
        }

        // ==========================================================
        // VIEW: QUADRO (KANBAN)
        // ==========================================================
        function tarefasFiltradas() {
            const { projeto, resp, q, sit } = state.filtros;
            const termo = q.trim().toLowerCase();
            return state.tarefas.filter(t =>
                (!projeto || t.projetoId === projeto) &&
                (!resp || t.responsavelEmail === resp) &&
                (!sit || (sit === 'abertas' ? t.status !== 'Validado' : situacao(t).key === sit)) &&
                (!termo || `${t.titulo} ${t.descricao || ''}`.toLowerCase().includes(termo)));
        }

        function cardTarefa(t) {
            const p = getProjeto(t.projetoId);
            const pr = PRIO_META[t.prioridade] || PRIO_META['Média'];
            return `<div class="task-card bg-white p-3 rounded-lg border border-gray-200 flex flex-col gap-2" draggable="${podeAtuar(t) ? 'true' : 'false'}" style="${podeAtuar(t) ? '' : 'cursor:pointer'}" data-action="abrir-tarefa" data-id="${esc(t.id)}">
                <div class="flex items-center justify-between gap-2">${chipProjeto(p)}<span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${pr.cls}" title="Prioridade ${esc(t.prioridade || 'Média')}"><i class="fas ${pr.icon}"></i></span></div>
                <h4 class="font-bold text-sm text-gray-800 leading-snug">${esc(t.titulo)}</h4>
                ${t.descricao ? `<p class="text-xs text-gray-500 line-clamp-2">${esc(t.descricao.substring(0, 90))}${t.descricao.length > 90 ? '…' : ''}</p>` : ''}
                <div class="flex items-center justify-between flex-wrap gap-1">${badgeSituacao(t, false)}<span class="text-[11px] text-gray-500"><i class="far fa-calendar mr-1"></i>${fmtBR(t.prazo)}</span></div>
                <div class="flex items-center justify-between border-t pt-2 mt-1">
                    <div class="flex items-center gap-1.5 text-xs text-leveros-verde2 font-semibold">${avatar(t.responsavelEmail, 'w-6 h-6 text-[10px]')}${esc(primeiroNome(getMembro(t.responsavelEmail).nome))}</div>
                    <span class="text-[11px] text-gray-400">${(t.colaboradoresEmails || []).length ? `<span title="Colaboradores" class="mr-2"><i class="fas fa-user-group mr-1"></i>${t.colaboradoresEmails.length}</span>` : ''}${podeAtuar(t) ? '' : '<i class="fas fa-lock mr-2" title="Somente leitura/comentário"></i>'}<i class="far fa-comment mr-1"></i>${t.comentariosCount || 0}</span>
                </div>
            </div>`;
        }

        function boardHTML() {
            const lista = tarefasFiltradas();
            return `<div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-start">${STATUS.map(s => {
                const m = STATUS_META[s];
                const ts = lista.filter(t => t.status === s).sort(s === 'Validado'
                    ? (a, b) => tsMillis(b.atualizadoEm) - tsMillis(a.atualizadoEm)
                    : (a, b) => (a.prazo || '9999').localeCompare(b.prazo || '9999'));
                return `<div class="bg-gray-50 rounded-xl p-3 border border-gray-200 shadow-sm flex flex-col" data-drop="${s}">
                    <div class="flex items-center justify-between mb-3 pb-2 border-b-2 ${m.border}">

        // ==========================================================

        // ==========================================================
        function projetosHTML() {
            const ativos = state.projetos.filter(p => p.status !== 'arquivado').sort((a, b) => a.nome.localeCompare(b.nome));

            const cronHTML = crons.map(cr => {

                            <button data-action="excluir-cronograma" data-id="${esc(cr.id)}" class="text-xs px-2.5 py-1.5 rounded-lg text-gray-400 hover:text-red-500 hover:bg-red-50" title="Excluir cronograma"><i class="fas fa-trash"></i></button>

                            <span class="text-xs text-gray-500 w-20 shrink-0">${fmtBR(t.prazo)}</span>
                            <span class="shrink-0 w-44 text-right">${badgeSituacao(t)}</span>
                            <span class="shrink-0 flex items-center gap-1.5 w-28 text-xs text-gray-600">${avatar(t.responsavelEmail, 'w-6 h-6 text-[10px]')}<span class="truncate">${esc(primeiroNome(getMembro(t.responsavelEmail).nome))}</span></span>
                        </div>`).join('')}</div>` : '<p class="text-sm text-gray-400 text-center py-6">Nenhuma tarefa neste cronograma.</p>'}
                </section>`;

            return `<div>
                <button data-action="nav" data-view="projetos" class="text-sm text-gray-500 hover:text-leveros-verde2 mb-3"><i class="fas fa-arrow-left mr-1"></i> Projetos</button>
                <div class="bg-white rounded-xl shadow-sm p-5 mb-5 border-t-4" style="border-color:${c}">

                            <h2 class="text-2xl font-bold text-leveros-verde1">${esc(p.nome)} ${p.status === 'arquivado' ? '<span class="text-xs bg-gray-200 text-gray-600 px-2 py-0.5 rounded-full align-middle">Arquivado</span>' : ''}</h2>

                            <p class="text-sm text-gray-500 mt-1">${esc(p.descricao || 'Sem descrição')}</p>
                        </div>
                        <div class="flex gap-2 flex-wrap">
                            <button data-action="novo-cronograma" data-projeto="${esc(p.id)}" class="text-sm px-3 py-2 rounded-lg border border-gray-300 hover:bg-gray-50 font-semibold"><i class="fas fa-calendar-plus mr-1"></i> Cronograma</button>
                            <button data-action="ver-quadro" data-projeto="${esc(p.id)}" class="text-sm px-3 py-2 rounded-lg border border-leveros-verde2 text-leveros-verde2 hover:bg-leveros-verde4/40 font-semibold"><i class="fas fa-columns mr-1"></i> Ver no quadro</button>
                            ${donos ? `<button data-action="arquivar-projeto" data-id="${esc(p.id)}" class="text-sm px-3 py-2 rounded-lg border border-gray-300 hover:bg-gray-50" title="${p.status === 'arquivado' ? 'Reativar' : 'Arquivar'}"><i class="fas fa-box-archive"></i></button>
                            <button data-action="editar-projeto" data-id="${esc(p.id)}" class="text-sm px-3 py-2 rounded-lg border border-gray-300 hover:bg-gray-50" title="Editar Projeto"><i class="fas fa-edit"></i></button>
                            <button data-action="excluir-projeto" data-id="${esc(p.id)}" class="text-sm px-3 py-2 rounded-lg border border-red-200 text-red-500 hover:bg-red-50" title="Excluir projeto"><i class="fas fa-trash"></i></button>` : ''}
                        </div>
                    </div>

                    <div class="mt-4 grid grid-cols-1 md:grid-cols-3 gap-4 bg-gray-50 p-4 rounded-xl border border-gray-100">
                        <div>
                            <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wide mb-1"><i class="fas fa-heart-crack text-red-400 mr-1"></i> Qual a Dor?</h4>
                            <p class="text-sm text-gray-700">${esc(p.dor || 'Não informada')}</p>
                        </div>
                        <div>
                            <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wide mb-1"><i class="fas fa-bullseye text-blue-400 mr-1"></i> O Que Queremos Sanar?</h4>
                            <p class="text-sm text-gray-700">${esc(p.sanar || 'Não informado')}</p>
                        </div>
                        <div>
                            <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wide mb-1"><i class="fas fa-chart-line text-leveros-verde2 mr-1"></i> KPI a Medir</h4>
                            <p class="text-sm text-gray-700 font-semibold">${esc(p.kpi || 'Não informado')}</p>
                        </div>
                    </div>

                    <div class="mt-4 grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">

        // ==========================================================
        // VIEW: ROTINA / AVULSAS
        // ==========================================================
        function renderPrazoRotina(r) {
            if (r.status === 'Continua') return '<span class="text-teal-600 font-semibold text-[11px]"><i class="fas fa-sync-alt mr-1"></i> Contínua</span>';
            if (!r.prazo) return '<span class="text-gray-400 text-[11px]">Sem prazo</span>';
            if (r.status === 'Concluído' || r.status === 'Concluído Parcial') return `<span class="text-gray-500 text-[11px] line-through"><i class="far fa-calendar mr-1"></i>${fmtBR(r.prazo)}</span>`;
            const d = diasPara(r.prazo);
            if (d < 0) return `<span class="text-red-600 font-bold text-[11px]"><i class="fas fa-exclamation-circle mr-1"></i>Vencido (${fmtBR(r.prazo)})</span>`;
            if (d <= 2) return `<span class="text-yellow-600 font-semibold text-[11px]"><i class="fas fa-clock mr-1"></i>${fmtBR(r.prazo)}</span>`;
            return `<span class="text-green-600 font-semibold text-[11px]"><i class="far fa-calendar mr-1"></i>${fmtBR(r.prazo)}</span>`;
        }

        function renderAcesso(url) {
            if (!url) return '<span class="text-gray-300">-</span>';
            let href = url;
            if (!url.startsWith('http://') && !url.startsWith('https://')) href = 'https://' + url;
            return `<a href="${esc(href)}" target="_blank" class="text-leveros-azul hover:text-leveros-verde2 hover:underline text-[11px] font-bold whitespace-nowrap"><i class="fas fa-external-link-alt mr-1"></i>Acessar</a>`;
        }

        function linhasTabelaRotina(lista, isMinhas, fResp) {
            const mostrarAcoes = isMinhas || isAdmin();
            return lista.map(r => {
                const colabs = rotinaColabs(r);
                const oculta = rotinaOcultaPara(r, fResp);
                const compartilhada = r.responsavelEmail !== fResp; // a lista exibida é de um colaborador
                const btnOcultar = isMinhas ? `
                        <button data-action="toggle-ocultar-rotina" data-id="${esc(r.id)}" class="w-8 h-8 rounded-lg text-gray-400 hover:text-orange-500 hover:bg-orange-50 transition-colors" title="${oculta ? 'Mostrar Atividade' : 'Ocultar Atividade'}">
                            <i class="fas ${oculta ? 'fa-eye' : 'fa-eye-slash'}"></i>
                        </button>` : '';
                const btnEditar = podeEditarRotina(r) ? `<button data-action="editar-rotina" data-id="${esc(r.id)}" class="w-8 h-8 rounded-lg text-gray-500 hover:text-leveros-verde2 hover:bg-leveros-verde4/40 transition-colors" title="Editar Atividade"><i class="fas fa-edit"></i></button>` : '';
                const btnExcluir = podeGerirRotina(r) ? `<button data-action="excluir-rotina" data-id="${esc(r.id)}" class="w-8 h-8 rounded-lg text-gray-400 hover:text-red-500 hover:bg-red-50 transition-colors" title="Excluir da rotina"><i class="fas fa-trash"></i></button>` : '';
                return `
                <tr class="hover:bg-gray-50 transition-colors border-l-4 ${oculta ? 'opacity-50 bg-gray-50' : ''}" style="border-left-color: ${r.cor || '#e5e7eb'}">
                    <td class="p-3 align-top">
                        <div class="text-gray-600 font-semibold">${fmtBR(r.data)}</div>
                        <div class="mt-1">${renderPrazoRotina(r)}</div>
                    </td>
                    <td class="p-3 align-top">
                        <span class="px-2 py-1 rounded text-[11px] font-bold block w-max mb-1 truncate max-w-full border" style="background:${r.cor ? r.cor+'26' : '#f3f4f6'}; color:${r.cor || '#6b7280'}; border-color:${r.cor || '#d1d5db'}" title="${esc(r.categoria)}">${esc(r.categoria)}</span>
                        <span class="px-2 py-1 rounded border text-[10px] font-bold block w-max ${STATUS_ROTINA_META[r.status] || ''}">${esc(r.status)}</span>
                    </td>
                    <td class="p-3 align-top">
                        <div class="font-bold text-gray-800">${esc(r.titulo || r.descricao)}</div>
                        ${r.titulo && r.descricao ? `<div class="text-gray-600 text-[12px] mt-0.5 line-clamp-2" title="${esc(r.descricao)}">${esc(r.descricao)}</div>` : ''}
                        ${compartilhada ? `<div class="mt-1.5 inline-flex items-center gap-1.5 text-[11px] font-semibold px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-700">🤝 Compartilhada por ${esc(primeiroNome(getMembro(r.responsavelEmail).nome))}</div>` : ''}
                        ${colabs.length ? `<div class="flex items-center gap-1 mt-1.5" title="Colaboradores"><i class="fas fa-user-group text-[10px] text-gray-400 mr-1"></i>${colabs.map(e => avatar(e, 'w-5 h-5 text-[9px]')).join('')}</div>` : ''}
                    </td>
                    <td class="p-3 align-top text-[12px] text-gray-500 italic">
                        ${esc(r.observacao || '--')}
                    </td>
                    <td class="p-3 text-center align-top pt-4">
                        ${renderAcesso(r.acesso)}
                    </td>
                    ${mostrarAcoes ? `
                    <td class="p-3 text-center align-top pt-3 whitespace-nowrap">
                        ${btnOcultar}${btnEditar}${btnExcluir}
                    </td>` : ''}
                </tr>`;
            }).join('') || `<tr><td colspan="${isMinhas || isAdmin() ? '6' : '5'}" class="p-10 text-center text-gray-400"><i class="fas fa-inbox text-3xl mb-2 text-gray-300 block"></i>Nenhuma atividade avulsa encontrada com esses filtros.</td></tr>`;
        }

        function rotinasHTML() {
            const { lista, isMinhas, fResp, concluidas, pendentes } = rotinasVisiveis();
            const f = state.filtros;

            return `<div id="rotina-view-root">

            m.innerHTML = `<div class="bg-white rounded-xl shadow-xl w-full ${largura} overflow-hidden fade-in max-h-[92vh] flex flex-col">

                </div>
                <form id="${formId}" class="p-6 overflow-y-auto">
                    ${corpo}
                    <div class="flex justify-end gap-3 mt-6 border-t pt-4">
                        <button type="button" data-action="fechar-modal" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 font-medium text-sm">Cancelar</button>
                        <button type="submit" class="px-4 py-2 bg-leveros-verde1 text-white rounded-lg hover:bg-leveros-verde2 font-medium text-sm flex items-center gap-2"><i class="fas fa-save"></i> ${labelSalvar}</button>
                    </div>
                </form>
            </div>`;
            m.classList.remove('hidden'); m.classList.add('flex');
            m.querySelector('input,select,textarea')?.focus();
        }
        function fecharModal() { const m = $('#modal'); m.classList.add('hidden'); m.classList.remove('flex'); m.innerHTML = ''; }

            abrirModal('Editar Atividade Avulsa', `

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                    <div><label class="lbl">Prazo <span class="font-normal normal-case text-gray-400">(opcional)</span></label><input id="er-prazo" type="date" class="inp" value="${esc(r.prazo || '')}"></div>

                    <div><label class="lbl">Categoria *</label><select id="er-cat" class="inp">${CATS_ROTINA.map(c=>`<option ${c===r.categoria?'selected':''}>${c}</option>`).join('')}</select></div>
                    <div><label class="lbl">Status *</label><select id="er-status" class="inp">${STATUS_ROTINA.map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select></div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

        function abrirDrawer(id) {
            const t = getTarefa(id);
            if (!t) return;
            state.drawerTaskId = id;
            const p = getProjeto(t.projetoId);
            const hist = (t.historicoPrazos || []).length;
            const tudo = podeEditarTudo(t), atuar = podeAtuar(t);
            state.drawerPerm = permKey(t);
            const banner = !atuar
                ? `<div class="mb-4 bg-blue-50 border border-blue-200 text-blue-800 rounded-lg p-3 text-xs flex items-start gap-2"><i class="fas fa-lock mt-0.5"></i><div>Somente <b>${esc(getMembro(t.responsavelEmail).nome)}</b> (responsável) e colaboradores podem alterar esta tarefa. Você pode comentar ou enviar uma solicitação na seção <b>Colaboração</b>.</div></div>`
                : (!tudo ? `<div class="mb-4 bg-indigo-50 border border-indigo-200 text-indigo-800 rounded-lg p-3 text-xs flex items-start gap-2"><i class="fas fa-user-group mt-0.5"></i><div>Você é <b>colaborador(a)</b> desta tarefa: pode atualizar status, prazo, prioridade e descrição. Para reatribuir, envie uma solicitação ao responsável.</div></div>` : '');

                    <div class="p-5 border-b">
                        ${banner}

                        <div class="grid grid-cols-2 gap-3">
                            <div><label class="lbl">Responsável</label><select id="dt-resp" class="inp" ${tudo ? '' : 'disabled'}>${optionsMembros(t.responsavelEmail)}</select></div>

                            <div class="col-span-2"><label class="lbl">Cronograma</label><select id="dt-cron" class="inp" ${tudo ? '' : 'disabled'}>${optionsCron(t.projetoId, t.cronogramaId)}</select></div>
                            <div id="dt-motivo-wrap" class="col-span-2 hidden"><label class="lbl">Motivo da alteração de prazo <span class="font-normal normal-case text-gray-400">(fica registrado no histórico)</span></label><input id="dt-motivo" class="inp bg-yellow-50" placeholder="Ex: aguardando retorno do fornecedor"></div>
                            <div class="col-span-2"><label class="lbl">Descrição</label><textarea id="dt-desc" rows="3" class="inp" ${atuar ? '' : 'disabled'}>${esc(t.descricao || '')}</textarea></div>
