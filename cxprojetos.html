<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CX FLOW | Leveros</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        leveros: {
                            verde1: '#002D32', verde2: '#005A64', azul: '#4CDDDD',
                            verde3: '#6FFFAF', verde4: '#CEFFAE', amarelo: '#FFCE00'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .task-card { cursor: grab; transition: transform .15s, box-shadow .15s; }
        .task-card:hover { box-shadow: 0 6px 12px -2px rgba(0,0,0,.12); transform: translateY(-1px); }
        .task-card.dragging { opacity: .4; }
        .drop-over { background: #e6fffa !important; outline: 2px dashed #4CDDDD; outline-offset: -4px; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #005A64; border-radius: 10px; }
        .fade-in { animation: fade .2s ease-out; }
        @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
        .slide-in { animation: slide .25s ease-out; }
        @keyframes slide { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
        .loader { border: 4px solid #e5e7eb; border-top: 4px solid #4CDDDD; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .inp { width: 100%; border: 1px solid #d1d5db; border-radius: .5rem; padding: .5rem .75rem; font-size: .875rem; background: #fff; }
        .inp:focus { outline: none; box-shadow: 0 0 0 2px #4CDDDD; border-color: #4CDDDD; }
        .inp:disabled { background: #f3f4f6; color: #6b7280; cursor: not-allowed; }
        .lbl { display: block; font-size: .75rem; font-weight: 700; color: #374151; margin-bottom: .25rem; text-transform: uppercase; letter-spacing: .03em; }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden">

    <!-- LOGIN -->
    <div id="login-screen" class="fixed inset-0 bg-leveros-verde1 z-50 flex flex-col items-center justify-center p-4">
        <div class="bg-white p-10 rounded-xl shadow-2xl w-full max-w-md text-center">
            <div class="w-20 h-20 bg-leveros-verde2 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-project-diagram text-leveros-azul text-3xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-leveros-verde1 mb-2">Portal de Projetos - CX FLOW</h1>
            <p class="text-gray-500 mb-8">Entre com sua conta corporativa Leveros para acessar projetos, cronogramas e tarefas.</p>
            <button data-action="login" class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 rounded-lg px-6 py-3 text-gray-700 font-semibold hover:bg-gray-50 transition-colors shadow-sm">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="w-6 h-6">
                Entrar com Google
            </button>
            <div id="login-error" class="text-red-500 text-sm mt-4 hidden"></div>
        </div>
    </div>

    <!-- APP -->
    <div id="app-screen" class="hidden flex-1 flex-col min-h-0">
        <header class="bg-leveros-verde1 text-white shadow-md z-20 shrink-0">
            <div class="max-w-[1600px] mx-auto px-3 sm:px-4 py-2 flex items-center justify-between gap-3 flex-wrap lg:flex-nowrap">
                <div class="flex items-center gap-2 shrink-0">
                    <i class="fas fa-layer-group text-leveros-azul text-xl"></i>
                    <h1 class="text-base font-bold hidden sm:block">CX FLOW</h1>
                </div>

                <nav id="nav" class="flex items-center gap-1 flex-wrap flex-1 text-sm order-3 lg:order-2 basis-full lg:basis-auto">
                    <button data-action="nav" data-view="dashboard" class="nav-btn px-2.5 py-1.5 rounded-lg whitespace-nowrap hover:bg-leveros-verde2 transition-colors"><i class="fas fa-chart-pie mr-1"></i> <span class="hidden sm:inline">Dashboard</span></button>
                    <button data-action="nav" data-view="minhas" class="nav-btn px-2.5 py-1.5 rounded-lg whitespace-nowrap hover:bg-leveros-verde2 transition-colors"><i class="fas fa-user-check mr-1"></i> <span class="hidden sm:inline">Minhas Tarefas</span> <span id="badge-minhas" class="hidden ml-1 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">0</span></button>
                    <button data-action="nav" data-view="quadro" class="nav-btn px-2.5 py-1.5 rounded-lg whitespace-nowrap hover:bg-leveros-verde2 transition-colors"><i class="fas fa-columns mr-1"></i> <span class="hidden sm:inline">Quadro</span></button>
                    <button data-action="nav" data-view="projetos" class="nav-btn px-2.5 py-1.5 rounded-lg whitespace-nowrap hover:bg-leveros-verde2 transition-colors"><i class="fas fa-folder-open mr-1"></i> <span class="hidden sm:inline">Projetos</span></button>
                    <button data-action="nav" data-view="rotina" class="nav-btn px-2.5 py-1.5 rounded-lg whitespace-nowrap hover:bg-leveros-verde2 transition-colors"><i class="fas fa-clipboard-list mr-1"></i> <span class="hidden sm:inline">Rotina Diária</span></button>
                    <button data-action="nav" data-view="dores" class="nav-btn px-2.5 py-1.5 rounded-lg whitespace-nowrap hover:bg-leveros-verde2 transition-colors"><i class="fas fa-heart-crack mr-1"></i> <span class="hidden sm:inline">Dores Operacionais</span></button>
                </nav>

                <div class="flex items-center gap-2 shrink-0 order-2 lg:order-3">
                    <button data-action="exportar-excel" title="Gerar Relatório" class="bg-gray-100 border border-gray-300 text-gray-700 hover:bg-gray-200 px-2.5 py-1.5 rounded-lg font-semibold text-sm flex items-center gap-2 transition-colors">
                        <i class="fas fa-file-excel text-green-600"></i> <span class="hidden xl:inline">Gerar Relatório</span>
                    </button>

                    <button data-action="nova-tarefa" title="Nova Tarefa" class="bg-leveros-amarelo text-leveros-verde1 hover:bg-yellow-400 px-2.5 py-1.5 rounded-lg font-semibold text-sm flex items-center gap-2 transition-colors">
                        <i class="fas fa-plus"></i> <span class="hidden xl:inline">Nova Tarefa</span>
                    </button>
                    <div class="flex items-center gap-2 border-l border-leveros-verde2 pl-2">
                        <div class="text-right hidden lg:block">
                            <div id="user-name" class="text-xs font-semibold text-leveros-verde4 leading-tight"></div>
                            <button data-action="logout" class="text-[11px] text-gray-300 hover:text-white">Sair</button>
                        </div>
                        <div id="user-avatar" class="w-8 h-8 rounded-full bg-leveros-verde2 overflow-hidden flex items-center justify-center border-2 border-leveros-azul cursor-pointer" data-action="logout" title="Sair"></div>
                    </div>
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto">
            <div id="view" class="max-w-[1600px] mx-auto p-3 sm:p-5"></div>
        </main>
    </div>

    <!-- MODAL -->
    <div id="modal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4"></div>

    <!-- DRAWER (detalhe da tarefa) -->
    <div id="drawer" class="fixed inset-0 z-40 hidden">
        <div class="absolute inset-0 bg-black/40" data-action="fechar-drawer"></div>
        <div id="drawer-panel" class="absolute right-0 top-0 h-full w-full max-w-xl bg-white shadow-2xl flex flex-col slide-in"></div>
    </div>

    <!-- TOASTS -->
    <div id="toasts" class="fixed bottom-4 right-4 z-[60] flex flex-col gap-2"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import {
            getFirestore, collection, addDoc, setDoc, deleteDoc, doc, updateDoc, onSnapshot,
            serverTimestamp, query, orderBy, increment, arrayUnion, arrayRemove, writeBatch, getDocs
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // ==========================================================
        // CONFIGURAÇÕES
        // ==========================================================
        const firebaseConfig = {
            apiKey:      "AIzaSyA6WjOoM-KCi-Yl4E5rwKbOulF8tBYEClo",
            authDomain:  "portal-atendimento-541ae.firebaseapp.com",
            projectId:   "portal-atendimento-541ae",
            storageBucket: "portal-atendimento-541ae.appspot.com"
        };

        const DOMINIO = '@leveros.com.br';
        const ADMINS = ['priscila.baldo@leveros.com.br', 'matheus.mendes@leveros.com.br'];

        const EMAIL_CONFIG = {
            provider: 'emailjs',
            emailjs: { serviceId: '', templateId: '', publicKey: '' }
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ hd: 'leveros.com.br', prompt: 'select_account' });

        // ==========================================================
        // CONSTANTES DE UI E ROTINAS
        // ==========================================================
        const STATUS = ['Pendente', 'Em Andamento', 'Validado'];
        const STATUS_META = {
            'Pendente':     { icon: 'fa-inbox',      txt: 'text-red-500',   border: 'border-red-400',   badge: 'bg-red-100 text-red-600' },
            'Em Andamento': { icon: 'fa-spinner',      txt: 'text-blue-500',  border: 'border-blue-400',  badge: 'bg-blue-100 text-blue-600' },
            'Validado':     { icon: 'fa-check-double', txt: 'text-leveros-verde2', border: 'border-leveros-verde3', badge: 'bg-green-100 text-green-700' }
        };
        const PRIORIDADES = ['Baixa', 'Média', 'Alta'];
        const PRIO_META = {
            'Baixa': { cls: 'bg-gray-100 text-gray-600', icon: 'fa-arrow-down' },
            'Média': { cls: 'bg-blue-100 text-blue-700', icon: 'fa-equals' },
            'Alta':  { cls: 'bg-orange-100 text-orange-700', icon: 'fa-arrow-up' }
        };

        const STATUS_ROTINA_META = {
            'Não iniciado': 'bg-pink-100 text-pink-700 border-pink-200',
            'Iniciado': 'bg-blue-100 text-blue-700 border-blue-200',
            'Pausado': 'bg-yellow-100 text-yellow-700 border-yellow-300',
            'Concluído Parcial': 'bg-purple-100 text-purple-700 border-purple-200',
            'Concluído': 'bg-green-100 text-green-700 border-green-200',
            'Continua': 'bg-leveros-verde2 text-white border-leveros-verde1'
        };
        const STATUS_ROTINA = Object.keys(STATUS_ROTINA_META);
        const CATS_ROTINA = ['Rotina Operacional', 'Suporte e Dúvidas', 'Reuniões', 'Melhoria Contínua', 'Planejamento', 'Outros'];

        const MESES_CURTOS = ['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN', 'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'];
        const DIAS_SEMANA = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

        const PALETA = ['#005A64', '#4CDDDD', '#6FFFAF', '#FFCE00', '#F97316', '#8B5CF6', '#EC4899', '#3B82F6'];
        const AV_CORES = ['bg-teal-600', 'bg-sky-600', 'bg-violet-600', 'bg-pink-600', 'bg-orange-500', 'bg-emerald-600', 'bg-indigo-600', 'bg-rose-600'];

        // ==========================================================
        // ESTADO
        // ==========================================================
        const state = {
            user: null,
            membros: [], projetos: [], cronogramas: [], tarefas: [], solicitacoes: [], rotinas: [],
            dores: [], doresLoaded: false, doresErro: false, importDores: null,
            view: 'dashboard',
            projetoAtual: null,
            filtros: {
                projeto: '', resp: '', q: '', sit: '',
                rotinaModo: 'minhas', rotinaResp: '', rotinaBusca: '', rotinaCat: '', rotinaStatus: '', rotinaOrdem: 'data-desc',
                rotinaOcultas: false,
                dores: { q: '', setor: '', prio: '', status: '', quarter: '', grupo: 'setor', modo: 'cards' }
            },
            minhasMostrarConcluidas: false,
            loaded: { membros: false, projetos: false, cronogramas: false, tarefas: false, solicitacoes: false, rotinas: false },
            drawerTaskId: null, drawerPerm: '',
            unsubs: [], unsubFeed: null,
            diaAtual: ''
        };

        // ==========================================================
        // HELPERS
        // ==========================================================
        const $ = (s, r = document) => r.querySelector(s);
        const esc = (str) => (str === null || str === undefined) ? '' : String(str)
            .replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>').replace(/"/g, '"').replace(/'/g, ''');

        const pad = (n) => String(n).padStart(2, '0');
        const toISO = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        const hojeISO = () => toISO(new Date());
        const parseISO = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
        const diasPara = (s) => s ? Math.round((parseISO(s) - parseISO(hojeISO())) / 86400000) : null;
        const fmtBR = (s) => { if (!s) return '—'; const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; };
        const tsMillis = (ts) => ts && typeof ts.toMillis === 'function' ? ts.toMillis() : Date.now();
        const fmtDataHora = (ms) => new Date(ms).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
        const hash = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
        const corProjeto = (c) => PALETA.includes(c) ? c : PALETA[0];
        const primeiroNome = (n) => (n || '').split(' ')[0] || '';

        function nomeDoEmail(email) {
            return (email || '').split('@')[0].split('.').map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(' ');
        }
        function getMembro(email) {
            const m = state.membros.find(x => x.email === (email || '').toLowerCase());
            return m || { email, nome: nomeDoEmail(email), foto: '' };
        }
        const getProjeto = (id) => state.projetos.find(p => p.id === id);
        
        function getOrigemTarefa(t) {
            if (t.projetoId) return getProjeto(t.projetoId);
            if (t.dorId) {
                const dor = state.dores.find(d => d.id === t.dorId);
                return dor ? { id: dor.id, nome: 'Dor: ' + (dor.codigo || 'S/N'), cor: '#F97316' } : null;
            }
            return null;
        }

        const getTarefa = (id) => state.tarefas.find(t => t.id === id);
        const isAdmin = () => ADMINS.includes(state.user?.email);
        const ehDonoProjeto = (p) => p && (p.criadoPorEmail === state.user?.email || isAdmin());
        function podeExcluirTarefa(t) {
            const p = getOrigemTarefa(t);
            return isAdmin() || t.criadoPorEmail === state.user?.email || (p && p.criadoPorEmail === state.user?.email);
        }

        function situacao(t) {
            if (t.status === 'Validado') return { key: 'concluida', emoji: '✅', label: 'Concluída', detalhe: '', cls: 'bg-gray-100 text-gray-600 border-gray-200' };
            const d = diasPara(t.prazo);
            if (d === null) return { key: 'sem-prazo', emoji: '⚪', label: 'Sem prazo', detalhe: '', cls: 'bg-gray-100 text-gray-500 border-gray-200' };
            if (d < 0) return { key: 'atrasada', emoji: '🔴', label: 'Atrasado', detalhe: `há ${-d} dia${-d > 1 ? 's' : ''}`, cls: 'bg-red-100 text-red-700 border-red-200' };
            if (d <= 2) return { key: 'breve', emoji: '🟡', label: 'Entrega em breve', detalhe: d === 0 ? 'vence hoje' : `em ${d} dia${d > 1 ? 's' : ''}`, cls: 'bg-yellow-100 text-yellow-800 border-yellow-300' };
            return { key: 'ok', emoji: '🟢', label: 'No prazo', detalhe: `em ${d} dias`, cls: 'bg-green-100 text-green-700 border-green-200' };
        }
        const badgeSituacao = (t, comDetalhe = true) => {
            const s = situacao(t);
            return `<span class="inline-flex items-center gap-1 text-[11px] font-semibold px-2 py-0.5 rounded-full border ${s.cls}">${s.emoji} ${s.label}${comDetalhe && s.detalhe ? ` · ${s.detalhe}` : ''}</span>`;
        };

        function avatar(email, size = 'w-7 h-7 text-[11px]') {
            const m = getMembro(email);
            if (m.foto) return `<img src="${esc(m.foto)}" referrerpolicy="no-referrer" class="${size} rounded-full object-cover shrink-0" title="${esc(m.nome)}">`;
            const ini = (m.nome || '?').split(' ').filter(Boolean).slice(0, 2).map(p => p[0]).join('').toUpperCase();
            return `<span class="${size} rounded-full ${AV_CORES[hash(email) % AV_CORES.length]} text-white font-bold inline-flex items-center justify-center shrink-0" title="${esc(m.nome)}">${esc(ini)}</span>`;
        }

        function chipProjeto(p) {
            if (!p) return '<span class="text-[11px] text-gray-400">Sem projeto</span>';
            const c = corProjeto(p.cor);
            return `<span class="inline-flex items-center gap-1 text-[11px] font-bold px-2 py-0.5 rounded max-w-full truncate" style="background:${c}26;color:${c === '#FFCE00' || c === '#6FFFAF' || c === '#4CDDDD' ? '#002D32' : c}"><i class="fas fa-folder"></i><span class="truncate">${esc(p.nome)}</span></span>`;
        }

        function toast(msg, tipo = 'ok') {
            const cls = tipo === 'erro' ? 'bg-red-600' : tipo === 'info' ? 'bg-leveros-verde2' : 'bg-leveros-verde1';
            const el = document.createElement('div');
            el.className = `${cls} text-white text-sm px-4 py-3 rounded-lg shadow-lg fade-in max-w-sm`;
            el.textContent = msg;
            $('#toasts').appendChild(el);
            setTimeout(() => el.remove(), 4000);
        }

        const optionsMembros = (sel = '') => state.membros.slice().sort((a, b) => a.nome.localeCompare(b.nome))
            .map(m => `<option value="${esc(m.email)}" ${m.email === sel ? 'selected' : ''}>${esc(m.nome)}</option>`).join('');
        const optionsProjetos = (sel = '', apenasAtivos = true) => state.projetos
            .filter(p => !apenasAtivos || p.status !== 'arquivado' || p.id === sel)
            .sort((a, b) => a.nome.localeCompare(b.nome))
            .map(p => `<option value="${esc(p.id)}" ${p.id === sel ? 'selected' : ''}>${esc(p.nome)}</option>`).join('');
        const optionsCron = (projetoId, sel = '') => state.cronogramas.filter(c => c.projetoId === projetoId)
            .sort((a, b) => tsMillis(a.criadoEm) - tsMillis(b.criadoEm))
            .map(c => `<option value="${esc(c.id)}" ${c.id === sel ? 'selected' : ''}>${esc(c.nome)}</option>`).join('');

        function checkboxColabs(name, selecionados = [], excluirEmail = '', desabilitado = false) {
            const lista = state.membros.filter(m => m.email !== excluirEmail).sort((a, b) => a.nome.localeCompare(b.nome));
            if (!lista.length) return '<p class="text-xs text-gray-400 p-2">Nenhum outro membro cadastrado.</p>';
            return lista.map(m => `
                <label class="flex items-center gap-2 p-2 text-sm hover:bg-gray-50 ${desabilitado ? 'opacity-60 cursor-not-allowed' : 'cursor-pointer'}">
                    <input type="checkbox" name="${name}" value="${esc(m.email)}" class="rounded" ${selecionados.includes(m.email) ? 'checked' : ''} ${desabilitado ? 'disabled' : ''}>
                    ${avatar(m.email, 'w-6 h-6 text-[10px]')}
                    <span class="font-semibold truncate">${esc(m.nome)}</span>
                </label>`).join('');
        }
        const colabsMarcados = (name) => [...document.querySelectorAll(`input[name=${name}]:checked`)].map(cb => cb.value);

        // ==========================================================
        // AUTENTICAÇÃO
        // ==========================================================
        function mostrarErroLogin(msg) {
            const el = $('#login-error');
            el.textContent = msg; el.classList.remove('hidden');
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const email = (user.email || '').toLowerCase();
                if (!email.endsWith(DOMINIO) || !user.emailVerified) {
                    mostrarErroLogin(`Acesso restrito a contas ${DOMINIO}.`);
                    await signOut(auth);
                    return;
                }
                state.user = { uid: user.uid, email, nome: user.displayName || nomeDoEmail(email), foto: user.photoURL || '' };
                $('#login-screen').classList.add('hidden');
                $('#app-screen').classList.remove('hidden');
                $('#app-screen').classList.add('flex');
                $('#user-name').textContent = state.user.nome;
                $('#user-avatar').innerHTML = state.user.foto
                    ? `<img src="${esc(state.user.foto)}" referrerpolicy="no-referrer" class="w-full h-full object-cover">`
                    : '<i class="fas fa-user text-white"></i>';
                $('#view').innerHTML = '<div class="text-center py-20"><div class="loader"></div><p class="text-gray-500">Sincronizando com o banco de dados...</p></div>';
                try {
                    await setDoc(doc(db, 'proj_membros', email), {
                        email, nome: state.user.nome, foto: state.user.foto, ultimoAcesso: serverTimestamp()
                    }, { merge: true });
                } catch (e) { /* log removido em produção */ }
                iniciarListeners();
            } else {
                pararListeners();
                state.user = null;
                $('#app-screen').classList.add('hidden');
                $('#app-screen').classList.remove('flex');
                $('#login-screen').classList.remove('hidden');
            }
        });

        // ==========================================================
        // LISTENERS EM TEMPO REAL
        // ==========================================================
        function pararListeners() {
            state.unsubs.forEach(u => u());
            state.unsubs = [];
            if (state.unsubFeed) { state.unsubFeed(); state.unsubFeed = null; }
            state.loaded = { membros: false, projetos: false, cronogramas: false, tarefas: false, solicitacoes: false, rotinas: false };
            fecharDrawer();
        }

        function iniciarListeners() {
            pararListeners();
            const ouvir = (nome, colecao, map) => {
                const u = onSnapshot(collection(db, colecao), (snap) => {
                    state[nome] = snap.docs.map(d => map({ id: d.id, ...d.data() }));
                    state.loaded[nome] = true;
                    if (Object.values(state.loaded).every(Boolean)) render();
                }, (err) => {
                    toast(`Erro ao carregar "${colecao}". Verifique as regras do Firestore.`, 'erro');
                });
                state.unsubs.push(u);
            };
            ouvir('membros', 'proj_membros', (m) => ({ ...m, email: (m.email || m.id).toLowerCase(), nome: m.nome || nomeDoEmail(m.id) }));
            ouvir('projetos', 'projetos', (p) => p);
            ouvir('cronogramas', 'cronogramas', (c) => c);
            ouvir('tarefas', 'tarefas', (t) => t);
            ouvir('solicitacoes', 'solicitacoes', (x) => x);
            ouvir('rotinas', 'rotinas', (r) => r);
            ouvirDores();
        }


        // ==========================================================
        // ROTINA: PERMISSÕES E FILTROS
        // ==========================================================
        const rotinaColabs = (r) => r.colaboradoresEmails || [];
        const rotinaDe = (r, email) => r.responsavelEmail === email || rotinaColabs(r).includes(email);
        const rotinaOcultaPara = (r, email) => (r.responsavelEmail === email && !!r.oculta) || (r.ocultaPara || []).includes(email);
        const podeGerirRotina = (r) => r.responsavelEmail === state.user?.email || isAdmin();
        const podeEditarRotina = (r) => podeGerirRotina(r) || rotinaColabs(r).includes(state.user?.email);

        function rotinasVisiveis() {
            const f = state.filtros;
            const isMinhas = (f.rotinaModo || 'minhas') === 'minhas';
            const fResp = isMinhas ? state.user.email : (f.rotinaResp || state.user.email);

            let lista = state.rotinas.filter(r => rotinaDe(r, fResp));
            if (!f.rotinaOcultas) lista = lista.filter(r => !rotinaOcultaPara(r, fResp));
            if (f.rotinaBusca) {
                const termo = f.rotinaBusca.toLowerCase();
                lista = lista.filter(r => `${r.titulo || ''} ${r.descricao || ''} ${r.observacao || ''}`.toLowerCase().includes(termo));
            }
            if (f.rotinaCat) lista = lista.filter(r => r.categoria === f.rotinaCat);
            if (f.rotinaStatus) lista = lista.filter(r => r.status === f.rotinaStatus);

            const ordem = f.rotinaOrdem || 'data-desc';
            lista.sort((a, b) => {
                if (ordem === 'data-desc') return b.data.localeCompare(a.data) || tsMillis(b.criadoEm) - tsMillis(a.criadoEm);
                if (ordem === 'data-asc') return a.data.localeCompare(b.data) || tsMillis(a.criadoEm) - tsMillis(b.criadoEm);
                if (ordem === 'prazo-asc') return (a.prazo || '9999-99-99').localeCompare(b.prazo || '9999-99-99');
                if (ordem === 'prazo-desc') return (b.prazo || '0000-00-00').localeCompare(a.prazo || '0000-00-00');
                return 0;
            });
            const concluidas = lista.filter(r => r.status === 'Concluído' || r.status === 'Concluído Parcial').length;
            return { lista, isMinhas, fResp, concluidas, pendentes: lista.length - concluidas };
        }

        // ==========================================================
        // DORES OPERACIONAIS — dados, constantes e helpers
        // ==========================================================
        const DORES_COLUNAS = [
            { k: 'codigo',       h: 'ID' },
            { k: 'setor',        h: 'Setor' },
            { k: 'direcional',   h: 'DIRECIONAL' },
            { k: 'dor',          h: 'DOR' },
            { k: 'acao',         h: 'AÇÃO' },
            { k: 'resultado',    h: 'Resultado Esperado (menor → maior ganho)' },
            { k: 'metricaAtual', h: 'Métrica Atual (do problema)' },
            { k: 'kpi',          h: 'KPI de Sucesso' },
            { k: 'prioridade',   h: 'Prioridade' },
            { k: 'squad',        h: 'Quarter & Squad de Destino' },
            { k: 'alinhamento',  h: 'Alinhamento "4 por 100"' },
            { k: 'inicio',       h: 'Início' },
            { k: 'fim',          h: 'Fim Estimado' },
            { k: 'status',       h: 'Status' },
            { k: 'obs',          h: 'Observações' }
        ];
        const DORES_PRIO = ['Crítica', 'Alta', 'Média', 'Baixa'];
        const DORES_STATUS = ['Em aprofundamento', 'Não iniciado', 'Concluído'];
        const DORES_NEUTRO = 'bg-gray-100 text-gray-600 border-gray-200';
        const DORES_PRIO_META = {
            'Crítica': { badge: 'bg-red-600 text-white border-red-700', bar: 'bg-red-600', ord: 0 },
            'Alta':    { badge: 'bg-orange-100 text-orange-800 border-orange-200', bar: 'bg-orange-400', ord: 1 },
            'Média':   { badge: 'bg-blue-100 text-blue-700 border-blue-200', bar: 'bg-blue-400', ord: 2 },
            'Baixa':   { badge: DORES_NEUTRO, bar: 'bg-gray-300', ord: 3 }
        };
        const DORES_STATUS_META = {
            'Em aprofundamento': { badge: 'bg-yellow-100 text-yellow-800 border-yellow-200', icon: 'fa-spinner', ord: 0 },
            'Não iniciado':      { badge: DORES_NEUTRO, icon: 'fa-pause-circle', ord: 1 },
            'Concluído':         { badge: 'bg-green-100 text-green-700 border-green-200', icon: 'fa-check-double', ord: 2 }
        };
        const SETORES_PADRAO = ['Atendimento', 'CX', 'Logística', 'Logística Reversa', 'T&D', 'Garantia'];
        const DORES_BASE = [{"codigo": "A1", "setor": "Atendimento", "direcional": "Rastreio", "dor": "Dificuldade de logar no ambiente da BoxLink, principalmente com clientes em linha.", "acao": "Validar com o TI alternativas para facilitar o acesso à BoxLink.", "resultado": "Menor ganho: login mais rápido. Maior ganho: redução do tempo médio de atendimento (TMA) em chamadas ao vivo.", "metricaAtual": "", "kpi": "Reduzir tempo médio de autenticação e TMA", "prioridade": "Alta", "squad": "Q4/2026 · Squad Atendimento/TI", "alinhamento": "Pilar Eficiência Operacional", "inicio": "2026-10-15", "fim": "2026-11-15", "status": "Em aprofundamento", "obs": "Base real — Dores Operacionais CX"}];

        const dorPrioMeta = (p) => DORES_PRIO_META[p] || { badge: DORES_NEUTRO, bar: 'bg-gray-300', ord: 9 };
        const dorStatusMeta = (s) => DORES_STATUS_META[s] || { badge: DORES_NEUTRO, icon: 'fa-circle', ord: 9 };
        const normTxt = (s) => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
        const ehISO = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s || '');
        const fmtDor = (v) => ehISO(v) ? fmtBR(v) : (v || '—');
        const dorQuarter = (d) => (String(d.squad || '').match(/^\s*(Q\d\/\d{4})/) || [])[1] || 'A definir';
        const qOrd = (q) => { const m = /^Q(\d)\/(\d{4})$/.exec(q); return m ? (+m[2]) * 10 + (+m[1]) : 99999; };
        const dorChave = (d) => {
            const s = normTxt([d.codigo, d.setor, d.dor, d.acao].join('|'));
            let h2 = 7; for (const c of s) h2 = (h2 * 33 + c.charCodeAt(0)) >>> 0;
            return `${hash(s).toString(36)}${h2.toString(36)}`;
        };
        const dorDocId = (d) => 'imp_' + dorChave(d);
        const camposDor = (d) => { const o = {}; DORES_COLUNAS.forEach(c => { o[c.k] = String(d[c.k] ?? ''); }); return o; };
        function dorCorSetor(setor) {
            const c = PALETA[hash(normTxt(setor)) % PALETA.length];
            const claro = ['#FFCE00', '#6FFFAF', '#4CDDDD'].includes(c);
            return { bg: c, fg: claro ? '#002D32' : '#ffffff' };
        }
        const podeExcluirDor = (d) => isAdmin() || !d.criadoPorEmail || d.criadoPorEmail === state.user?.email;

        // ==========================================================
        // DORES OPERACIONAIS — tempo real (Firestore: coleção "dores")
        // ==========================================================
        function ouvirDores() {
            const u = onSnapshot(collection(db, 'dores'), (snap) => {
                state.dores = snap.docs.map(x => ({ ...x.data(), id: x.id }))
                    .sort((a, b) => (a.ordem ?? 1e9) - (b.ordem ?? 1e9) || tsMillis(a.criadoEm) - tsMillis(b.criadoEm));
                state.doresLoaded = true; state.doresErro = false;
                if (state.view === 'dores') render();
            }, (err) => {
                state.doresLoaded = true; state.doresErro = true;
                if (state.view === 'dores') render();
            });
            state.unsubs.push(u);
        }

        // ==========================================================
        // DORES OPERACIONAIS — filtros e agrupamento
        // ==========================================================
        function doresFiltradas() {
            const f = state.filtros.dores, q = normTxt(f.q);
            return state.dores.filter(d =>
                (!f.setor || d.setor === f.setor) && (!f.prio || d.prioridade === f.prio) &&
                (!f.status || d.status === f.status) && (!f.quarter || dorQuarter(d) === f.quarter) &&
                (!q || normTxt(DORES_COLUNAS.map(c => d[c.k]).join(' ')).includes(q)));
        }

        function agruparDores(lista) {
            const g = state.filtros.dores.grupo;
            if (g === 'nenhum') return [{ titulo: '', itens: lista }];
            const chave = (d) => g === 'setor' ? (d.setor || 'Sem setor') : g === 'prioridade' ? (d.prioridade || 'Sem prioridade')
                : g === 'status' ? (d.status || 'Sem status') : dorQuarter(d);
            const mapa = new Map();
            lista.forEach(d => { const k = chave(d); if (!mapa.has(k)) mapa.set(k, []); mapa.get(k).push(d); });
            const grupos = [...mapa].map(([titulo, itens]) => ({ titulo, itens }));
            if (g === 'prioridade') grupos.sort((a, b) => dorPrioMeta(a.titulo).ord - dorPrioMeta(b.titulo).ord);
            if (g === 'status') grupos.sort((a, b) => dorStatusMeta(a.titulo).ord - dorStatusMeta(b.titulo).ord);
            if (g === 'quarter') grupos.sort((a, b) => qOrd(a.titulo) - qOrd(b.titulo));
            return grupos;
        }

        const opcoesDe = (fn) => [...new Set(state.dores.map(fn).filter(Boolean))];
        const optsFiltro = (lista, sel) => lista.map(v => `<option value="${esc(v)}" ${v === sel ? 'selected' : ''}>${esc(v)}</option>`).join('');

        // ==========================================================
        // DORES OPERACIONAIS — views
        // ==========================================================
        function doresKpisHTML() {
            const n = (fn) => state.dores.filter(fn).length;
            const tile = (rotulo, valor, icon, cor, campo, val) => `
                <button data-action="dor-filtro-rapido" data-campo="${campo}" data-valor="${esc(val)}" class="text-left bg-white border border-gray-200 border-l-4 ${cor} rounded-lg px-3 py-2 hover:shadow-sm transition-shadow">
                    <div class="flex items-center justify-between gap-2"><span class="text-[11px] font-semibold text-gray-500 leading-tight">${rotulo}</span><i class="fas ${icon} text-gray-300 text-xs"></i></div>
                    <div class="text-xl font-bold text-leveros-verde1 leading-tight">${valor}</div>
                </button>`;
            return `
                ${tile('Total de dores', state.dores.length, 'fa-list-ol', 'border-l-leveros-verde2', 'limpar', '')}
                ${tile('Em aprofundamento', n(d => d.status === 'Em aprofundamento'), 'fa-spinner', 'border-l-yellow-400', 'status', 'Em aprofundamento')}
                ${tile('Não iniciado', n(d => d.status === 'Não iniciado'), 'fa-pause-circle', 'border-l-gray-400', 'status', 'Não iniciado')}
                ${tile('Concluído', n(d => d.status === 'Concluído'), 'fa-check-double', 'border-l-green-500', 'status', 'Concluído')}
                ${tile('Prioridade crítica', n(d => d.prioridade === 'Crítica'), 'fa-triangle-exclamation', 'border-l-red-600', 'prio', 'Crítica')}
                ${tile('Prioridade alta', n(d => d.prioridade === 'Alta'), 'fa-arrow-up', 'border-l-orange-400', 'prio', 'Alta')}`;
        }

        function cardDorHTML(d) {
            const pm = dorPrioMeta(d.prioridade), sm = dorStatusMeta(d.status);
            return `
            <div role="button" tabindex="0" data-action="dor-ver" data-id="${esc(d.id)}" class="bg-white rounded-lg border border-gray-200 hover:border-leveros-verde2 hover:shadow-md transition cursor-pointer relative pl-4 pr-3 py-3 flex flex-col gap-1.5">
                <span class="absolute left-0 top-0 bottom-0 w-1 rounded-l-lg ${pm.bar}"></span>
                <div class="flex items-center gap-1.5 flex-wrap text-[11px]">
                    <span class="font-bold text-gray-500">#${esc(d.codigo || '—')}</span>
                    <span class="px-1.5 py-0.5 rounded-full border font-bold ${pm.badge}">${esc(d.prioridade || '—')}</span>
                    <span class="ml-auto px-1.5 py-0.5 rounded-full border font-semibold ${sm.badge}"><i class="fas ${sm.icon} mr-1"></i>${esc(d.status || '—')}</span>
                </div>
                <div class="text-[10px] uppercase font-bold tracking-wide text-leveros-verde2 truncate">${esc(d.setor)}${d.direcional ? ' · ' + esc(d.direcional) : ''}</div>
                <h4 class="text-sm font-semibold text-gray-800 leading-snug line-clamp-3">${d.dor ? esc(d.dor) : '<span class="text-gray-400 font-normal">(sem descrição da dor)</span>'}</h4>
                <p class="text-xs text-gray-600 line-clamp-3 whitespace-pre-line"><i class="fas fa-hammer text-blue-400 mr-1"></i>${esc(d.acao)}</p>
                <div class="mt-auto pt-2 border-t border-gray-100 flex items-center justify-between gap-x-3 gap-y-1 text-[11px] text-gray-500 flex-wrap">
                    <span class="truncate max-w-full"><i class="fas fa-users mr-1 text-gray-400"></i>${esc(d.squad || '—')}</span>
                    <span class="whitespace-nowrap"><i class="far fa-calendar-alt mr-1 text-gray-400"></i>${fmtDor(d.inicio)} → ${fmtDor(d.fim)}</span>
                </div>
            </div>`;
        }

        const DORES_LARGURAS = { codigo: 'min-w-[64px]', setor: 'min-w-[120px]', direcional: 'min-w-[140px]', dor: 'min-w-[280px]', acao: 'min-w-[300px]', resultado: 'min-w-[300px]', metricaAtual: 'min-w-[160px]', kpi: 'min-w-[240px]', prioridade: 'min-w-[90px]', squad: 'min-w-[180px]', alinhamento: 'min-w-[170px]', inicio: 'min-w-[96px]', fim: 'min-w-[96px]', status: 'min-w-[160px]', obs: 'min-w-[220px]' };

        function tabelaDoresHTML(grupos) {
            const linha = (d) => `
                <tr data-action="dor-ver" data-id="${esc(d.id)}" class="border-t border-gray-100 hover:bg-leveros-verde4/30 cursor-pointer align-top">
                    ${DORES_COLUNAS.map(c => {
                        const v = d[c.k];
                        if (c.k === 'prioridade') return `<td class="px-2 py-2"><span class="px-1.5 py-0.5 rounded-full border font-bold text-[11px] whitespace-nowrap ${dorPrioMeta(v).badge}">${esc(v || '—')}</span></td>`;
                        if (c.k === 'status') {
                            const lista = DORES_STATUS.includes(v) || !v ? DORES_STATUS : [v, ...DORES_STATUS];
                            return `<td class="px-2 py-2"><select data-action="noop" data-id="${esc(d.id)}" class="dor-status-sel inp !py-1 !px-1.5 !text-xs ${dorStatusMeta(v).badge}">${v ? '' : '<option value="" selected>—</option>'}${lista.map(s => `<option ${s === v ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select></td>`;
                        }
                        if (c.k === 'inicio' || c.k === 'fim') return `<td class="px-2 py-2 whitespace-nowrap">${fmtDor(v)}</td>`;
                        if (c.k === 'codigo') return `<td class="px-2 py-2 font-bold text-gray-600 whitespace-nowrap">${esc(v || '—')}</td>`;
                        return `<td class="px-2 py-2 whitespace-pre-line break-words">${esc(v)}</td>`;
                    }).join('')}
                </tr>`;
            return `
            <div class="bg-white border border-gray-200 rounded-lg overflow-auto" style="max-height: calc(100vh - 16.5rem)">
                <table class="w-full text-xs text-gray-700 border-collapse">

                    <tbody>
                        ${grupos.map(g => (g.titulo ? `<tr><td colspan="${DORES_COLUNAS.length}" class="bg-leveros-verde4/60 text-leveros-verde1 font-bold px-3 py-1.5 text-xs">${esc(g.titulo)} <span class="font-normal text-gray-500">· ${g.itens.length}</span></td></tr>` : '') + g.itens.map(linha).join('')).join('')}
                    </tbody>
                </table>
            </div>`;
        }

        function doresResultadoHTML() {
            if (state.doresErro) return `
                <div class="bg-red-50 border border-red-200 text-red-800 rounded-lg p-4 text-sm">
                    <b><i class="fas fa-triangle-exclamation mr-1"></i> Não foi possível ler a coleção "dores" no Firestore.</b>
                </div>`;
            if (!state.doresLoaded) return '<div class="text-center py-16"><div class="loader"></div></div>';
            if (!state.dores.length) return `
                <div class="bg-white border border-dashed border-gray-300 rounded-xl p-10 text-center">
                    <i class="fas fa-heart-crack text-4xl text-leveros-azul mb-3"></i>
                    <h3 class="font-bold text-leveros-verde1 text-lg">Nenhuma dor cadastrada ainda</h3>
                    <p class="text-sm text-gray-500 mt-1 mb-5">Comece cadastrando uma nova.</p>
                    <div class="flex justify-center gap-2 flex-wrap">
                        <button data-action="dor-nova" class="bg-leveros-amarelo text-leveros-verde1 hover:bg-yellow-400 px-4 py-2 rounded-lg font-semibold text-sm"><i class="fas fa-plus mr-1"></i> Nova dor</button>
                    </div>
                </div>`;
            const lista = doresFiltradas();
            if (!lista.length) return '<div class="bg-white border border-gray-200 rounded-lg p-8 text-center text-sm text-gray-500">Nenhuma dor encontrada com esses filtros. <button data-action="dor-limpar" class="text-leveros-verde2 font-semibold underline">Limpar filtros</button></div>';
            const grupos = agruparDores(lista);
            if (state.filtros.dores.modo === 'tabela') return tabelaDoresHTML(grupos);
            return grupos.map(g => {
                const cor = state.filtros.dores.grupo === 'setor' ? dorCorSetor(g.titulo) : { bg: '#005A64', fg: '#ffffff' };
                return `
                <section class="mb-4">
                    ${g.titulo ? `<div class="flex items-center gap-2 mb-2">
                        <span class="px-2.5 py-1 rounded-md text-sm font-bold" style="background:${cor.bg};color:${cor.fg}">${esc(g.titulo)}</span>
                        <span class="text-xs text-gray-500">${g.itens.length} ${g.itens.length === 1 ? 'dor' : 'dores'}</span>

        }

        function doresContagemHTML() {
            const filtrando = Object.entries(state.filtros.dores).some(([k, v]) => ['q', 'setor', 'prio', 'status', 'quarter'].includes(k) && v);

        }

        function atualizarDores() {

            setSel('#dr-setor', '<option value="">Todos os setores</option>' + optsFiltro(opcoesDe(d => d.setor), f.setor), f.setor);
            setSel('#dr-quarter', '<option value="">Todos os quarters</option>' + optsFiltro(opcoesDe(dorQuarter).sort((a, b) => qOrd(a) - qOrd(b)), f.quarter), f.quarter);

                b.classList.toggle('text-gray-600', !ativo);
            });
        }

        function doresOperacionaisHTML() {
            const f = state.filtros.dores;
            const btnModo = (modo, icon, rot) => `<button data-action="dor-modo" data-modo="${modo}" class="px-2.5 py-1.5 text-xs font-semibold flex items-center gap-1.5 ${f.modo === modo ? 'bg-leveros-verde1 text-white' : 'text-gray-600'}"><i class="fas ${icon}"></i> ${rot}</button>`;
            return `
            <div id="dores-root">
                <div class="flex items-center justify-between gap-3 flex-wrap mb-3">
                    <div>
                        <h2 class="text-xl font-bold text-leveros-verde1 leading-tight">Dores Operacionais</h2>

                    </div>
                    <div class="flex items-center gap-2 flex-wrap">
                        <button data-action="dor-nova" class="bg-leveros-amarelo text-leveros-verde1 hover:bg-yellow-400 px-3 py-2 rounded-lg font-semibold text-sm flex items-center gap-2"><i class="fas fa-plus"></i> Nova dor</button>
                        <button data-action="dor-importar" title="Importar novas dores de uma planilha Excel" class="bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 px-3 py-2 rounded-lg font-semibold text-sm flex items-center gap-2"><i class="fas fa-file-import text-leveros-verde2"></i> Importar Excel</button>

        function renderizarTarefasDaDor(dorId) {
            const cont = $('#dor-tarefas-list');
            if (!cont) return;
            const tarefasDor = state.tarefas.filter(t => t.dorId === dorId).sort((a,b) => (a.prazo||'9999').localeCompare(b.prazo||'9999'));
            cont.innerHTML = tarefasDor.length 
                ? `<div class="flex flex-col gap-2">` + tarefasDor.map(t => linhaTarefaCompacta(t, true)).join('') + `</div>` 
                : `<p class="text-xs text-gray-400 py-4 text-center">Nenhuma tarefa vinculada a esta dor.</p>`;
        }

        const parseSquad = (s) => {
            const m = /^\s*(Q\d\/\d{4}|A definir)\s*·\s*([\s\S]*)$/.exec(s || '');
            if (m) return { quarter: m[1], squad: m[2] };
            const q = /^\s*(Q\d\/\d{4})\s*$/.exec(s || '');
            return q ? { quarter: q[1], squad: '' } : { quarter: '', squad: s || '' };
        };

        function opcoesQuarter(atual) {
            const hoje = new Date(), set = new Set(opcoesDe(dorQuarter).filter(q => q !== 'A definir'));
            let ano = hoje.getFullYear(), tri = Math.floor(hoje.getMonth() / 3) + 1;
            for (let i = 0; i < 6; i++) { set.add(`Q${tri}/${ano}`); if (++tri > 4) { tri = 1; ano++; } }
            if (/^Q\d\/\d{4}$/.test(atual || '')) set.add(atual);
            return [...set].sort((a, b) => qOrd(a) - qOrd(b));
        }

        }

        async function salvarDor() {
            const id = $('#dr-id').value;
            const val = (k) => $('#dr-' + k).value.trim();
            const dataVal = (n) => $(`#dr-${n}-adef`).checked ? 'A definir' : $('#dr-' + n).value;
            const quarter = $('#dr-quarter-f').value, squadNome = val('squad-f');
            const dados = {
                codigo: val('codigo'), setor: val('setor-f'), direcional: val('direcional'), dor: val('dor'), acao: val('acao'),
                resultado: val('resultado'), metricaAtual: val('metricaAtual'), kpi: val('kpi'), prioridade: $('#dr-prioridade').value,
                squad: quarter && squadNome ? `${quarter} · ${squadNome}` : (quarter || squadNome),
                alinhamento: val('alinhamento'), inicio: dataVal('inicio'), fim: dataVal('fim'), status: $('#dr-status-f').value, obs: val('obs')
            };
            if (!dados.setor) throw new Error('Informe o setor.');
            if (!dados.dor && !dados.acao) throw new Error('Preencha ao menos a dor ou a ação.');
            if (ehISO(dados.inicio) && ehISO(dados.fim) && dados.fim < dados.inicio) throw new Error('O fim estimado não pode ser antes do início.');
            const dup = dados.codigo && state.dores.some(x => x.id !== id && normTxt(x.codigo) === normTxt(dados.codigo));
            if (dup && !confirm(`Já existe uma dor com o ID "${dados.codigo}". Salvar mesmo assim?`)) throw new Error('Cadastro cancelado.');
            if (id) {
                await updateDoc(doc(db, 'dores', id), { ...dados, atualizadoEm: serverTimestamp(), atualizadoPorEmail: state.user.email });
                toast('Dor atualizada!');
            } else {
                const ordem = Math.max(0, ...state.dores.map(x => x.ordem || 0)) + 1;
                await addDoc(collection(db, 'dores'), { ...dados, ordem, origem: 'manual', criadoPorEmail: state.user.email, criadoEm: serverTimestamp() });
                toast('Dor cadastrada!');
            }
            fecharModal();
        }

        async function excluirDor(id) {
            const d = state.dores.find(x => x.id === id); if (!d) return;
            if (!podeExcluirDor(d)) return toast('Somente quem cadastrou a dor ou um administrador pode excluir.', 'erro');
            if (!confirm(`Excluir a dor "${d.codigo || ''} ${(d.dor || d.acao || '').slice(0, 60)}"? Essa ação não pode ser desfeita.`)) return;
            await deleteDoc(doc(db, 'dores', id));
            fecharModal(); toast('Dor excluída.');
        }

        async function mudarStatusDor(id, status) {
            try { await updateDoc(doc(db, 'dores', id), { status, atualizadoEm: serverTimestamp(), atualizadoPorEmail: state.user.email }); toast('Status atualizado.'); }
            catch (err) { toast('Erro ao atualizar o status.', 'erro'); }
        }

        // DORES OPERACIONAIS — importar / exportar Excel
        // ==========================================================
        async function gravarDoresEmLote(lista, origem) {
            const base = Math.max(0, ...state.dores.map(x => x.ordem || 0));
            for (let i = 0; i < lista.length; i += 400) {
                const b = writeBatch(db);
                lista.slice(i, i + 400).forEach((d, j) => b.set(doc(db, 'dores', dorDocId(d)), {
                    ...camposDor(d), ordem: base + i + j + 1, origem, criadoPorEmail: state.user.email, criadoEm: serverTimestamp()
                }));
                await b.commit();
            }
        }

        function separarNovas(lista) {
            const existentes = new Set(state.dores.map(dorChave)), vistos = new Set(), novas = [];
            let repetidas = 0;
            lista.forEach(d => { const k = dorChave(d); if (existentes.has(k) || vistos.has(k)) repetidas++; else { vistos.add(k); novas.push(d); } });
            return { novas, repetidas };
        }

        function dataParaISO(v) {
            if (v instanceof Date && !isNaN(v)) {
                const z = new Date(v.getTime() + 12 * 3600e3);
                return `${z.getUTCFullYear()}-${pad(z.getUTCMonth() + 1)}-${pad(z.getUTCDate())}`;
            }
            const s = String(v ?? '').trim();
            const br = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);
            if (br) return `${br[3]}-${pad(+br[2])}-${pad(+br[1])}`;
            return s;
        }

        function lerLinhasDores(rows) {
            const ncel = (c) => normTxt(c).replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
            const hi = rows.findIndex(r => { const n = r.map(ncel); return n.includes('setor') && n.includes('dor'); });
            if (hi < 0) throw new Error('Não encontrei o cabeçalho (colunas "Setor" e "DOR"). Use o botão "Baixar modelo".');
            const mapa = {};
            rows[hi].forEach((c, i) => {
                const n = ncel(c); let k = null;
                if (n === 'id') k = 'codigo'; else if (n === 'setor') k = 'setor'; else if (n === 'direcional') k = 'direcional';
                else if (n === 'dor') k = 'dor'; else if (n === 'acao') k = 'acao'; else if (n.startsWith('resultado')) k = 'resultado';
                else if (n.startsWith('metrica')) k = 'metricaAtual'; else if (n.startsWith('kpi')) k = 'kpi'; else if (n === 'prioridade') k = 'prioridade';
                else if (n.startsWith('quarter')) k = 'squad'; else if (n.startsWith('alinhamento')) k = 'alinhamento'; else if (n === 'inicio') k = 'inicio';
                else if (n.startsWith('fim')) k = 'fim'; else if (n === 'status') k = 'status'; else if (n.startsWith('observ')) k = 'obs';
                if (k && !(k in mapa)) mapa[k] = i;
            });
            const out = [];
            rows.slice(hi + 1).forEach(r => {
                const d = {};
                DORES_COLUNAS.forEach(c => {
                    let v = c.k in mapa ? r[mapa[c.k]] : '';
                    d[c.k] = (c.k === 'inicio' || c.k === 'fim') ? dataParaISO(v) : String(v ?? '');
                });
                if (DORES_COLUNAS.some(c => d[c.k].trim() !== '')) out.push(d);
            });
            return out;
        }

        async function lerPlanilhaDores(file) {
            try {
                const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
                const ws = wb.Sheets[wb.SheetNames[0]];
                const dados = lerLinhasDores(XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' }));
                if (!dados.length) return toast('A planilha não tem nenhuma dor para importar.', 'erro');
                mostrarPreviaImportacao(dados, `Arquivo: ${file.name}`, 'planilha');
            } catch (err) { toast(err.message || 'Não foi possível ler a planilha.', 'erro'); }
        }

        function mostrarPreviaImportacao(dados, fonte, origem) {
            const { novas, repetidas } = separarNovas(dados);
            state.importDores = { novas, origem };
            const m = $('#modal');

                    ${novas.length ? `<div class="border rounded-lg overflow-auto max-h-64"><table class="w-full text-xs"><thead class="bg-gray-50 text-gray-500"><tr><th class="text-left p-2">ID</th><th class="text-left p-2">Setor</th><th class="text-left p-2">Dor / Ação</th><th class="text-left p-2">Prioridade</th></tr></thead><tbody>
                        ${novas.map(d => `<tr class="border-t"><td class="p-2 font-bold">${esc(d.codigo || '—')}</td><td class="p-2">${esc(d.setor)}</td><td class="p-2">${esc((d.dor || d.acao).slice(0, 110))}</td><td class="p-2">${esc(d.prioridade || '—')}</td></tr>`).join('')}</tbody></table></div>`
                        : '<p class="text-sm text-gray-500">Tudo isso já está cadastrado. Nada a importar.</p>'}
                </div>
                <div class="px-5 py-3 border-t flex justify-end gap-2 bg-gray-50 shrink-0">
                    <button data-action="fechar-modal" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-white text-sm font-medium">Cancelar</button>
                    ${novas.length ? `<button data-action="dor-confirmar-import" class="px-4 py-2 bg-leveros-verde1 text-white rounded-lg hover:bg-leveros-verde2 text-sm font-medium"><i class="fas fa-file-import mr-1"></i> Importar ${novas.length} ${novas.length === 1 ? 'dor' : 'dores'}</button>` : ''}
                </div>
            </div>`;
            m.classList.remove('hidden'); m.classList.add('flex');
        }

        async function confirmarImportacaoDores(btn) {
            const imp = state.importDores; if (!imp?.novas.length) return;
            btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Importando...';
            try { await gravarDoresEmLote(imp.novas, imp.origem); fecharModal(); toast(`${imp.novas.length} dores importadas!`); state.importDores = null; }
            catch (err) { toast('Erro ao importar. Verifique as permissões do Firestore.', 'erro'); btn.disabled = false; btn.innerHTML = 'Tentar novamente'; }
        }

        function baixarPlanilhaDores(lista, nomeArquivo, titulo = 'CRONOGRAMA DE PRIORIZAÇÃO DE PROJETOS') {
            const celula = (c, d) => {
                const v = d[c.k] ?? '';
                if ((c.k === 'inicio' || c.k === 'fim') && ehISO(v)) { const [y, m, dd] = v.split('-').map(Number); return new Date(y, m - 1, dd, 12); }
                return v;
            };
            const ws = XLSX.utils.aoa_to_sheet([[titulo], DORES_COLUNAS.map(c => c.h), ...lista.map(d => DORES_COLUNAS.map(c => celula(c, d)))], { cellDates: true });
            ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: DORES_COLUNAS.length - 1 } }];
            ws['!cols'] = [8, 18, 22, 50, 55, 55, 28, 40, 12, 32, 28, 12, 14, 18, 40].map(w => ({ wch: w }));
            Object.keys(ws).forEach(a => { if (ws[a] && ws[a].t === 'd') ws[a].z = 'dd/mm/yyyy'; });
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Página1');
            XLSX.writeFile(wb, nomeArquivo);
        }

        const exportarDores = () => { baixarPlanilhaDores(state.dores, `DORES_OPERACIONAIS_${hojeISO()}.xlsx`); toast('Planilha exportada!'); };
        const baixarModeloDores = () => {
            baixarPlanilhaDores([{ codigo: 'X1', setor: 'CX', direcional: 'Jornada cliente', dor: 'Descreva a dor aqui', acao: 'O que será feito', resultado: 'Menor ganho: … Maior ganho: …', kpi: 'Reduzir X em Y%', prioridade: 'Média', squad: 'Q1/2027 · Squad CX', alinhamento: 'Pilar Eficiência Operacional', inicio: '2027-01-04', fim: '2027-02-28', status: 'Não iniciado', obs: '' }], 'MODELO_DORES_OPERACIONAIS.xlsx');
            toast('Modelo baixado. Preencha e use "Importar Excel".', 'info');
        };

        // ==========================================================
        // NAVEGAÇÃO / RENDER
        // ==========================================================
        function navegar(view, projetoId = null) {
            state.view = view;
            state.projetoAtual = projetoId;
            render(true);
            $('main').scrollTop = 0;
        }

        function render(forcar = false) {
            if (!state.user || !Object.values(state.loaded).every(Boolean)) return;
            state.diaAtual = hojeISO();

            const minhas = state.tarefas.filter(t => (ehResponsavel(t) || ehColaborador(t)) && t.status !== 'Validado');
            const urg = minhas.filter(t => ['atrasada', 'breve'].includes(situacao(t).key)).length + solicitacoesRecebidas().length;
            const badge = $('#badge-minhas');
            badge.textContent = urg; badge.classList.toggle('hidden', urg === 0);

            if (state.drawerTaskId) {
                const dt = getTarefa(state.drawerTaskId);
                if (dt) {
                    if (permKey(dt) !== state.drawerPerm) abrirDrawer(dt.id);
                    else { const el = $('#dr-colab'); if (el) el.innerHTML = colabSectionHTML(dt); }
                }
            }

            document.querySelectorAll('.nav-btn').forEach(b => {
                const ativo = b.dataset.view === state.view || (b.dataset.view === 'projetos' && state.view === 'projeto');
                b.classList.toggle('bg-leveros-verde2', ativo);
            });

            if (!forcar && state.view === 'quadro' && $('#board')) {
                $('#board').innerHTML = boardHTML();
                return;
            }

            // Se for atualizar a visão de rotina sem recarregar a tela inteira, reconstruimos a tela inteira de rotina para atualizar Dashboard e Lista
            if (!forcar && state.view === 'rotina' && $('#rotina-view-root')) {
                $('#view').innerHTML = rotinasHTML();
                return;
            }

            if (!forcar && state.view === 'dores' && $('#dores-root')) {
                atualizarDores();
                return;
            }

            const v = $('#view');
            if (state.view === 'dashboard') v.innerHTML = dashboardHTML();
            else if (state.view === 'minhas') v.innerHTML = minhasHTML();
            else if (state.view === 'quadro') v.innerHTML = quadroHTML();
            else if (state.view === 'projetos') v.innerHTML = projetosHTML();
            else if (state.view === 'projeto') v.innerHTML = projetoDetalheHTML();
            else if (state.view === 'rotina') v.innerHTML = rotinasHTML();
            else if (state.view === 'dores') v.innerHTML = doresOperacionaisHTML();
            v.firstElementChild?.classList.add('fade-in');

            // Atualiza lista de tarefas dentro da Dor se o modal estiver aberto
            if ($('#modal') && !$('#modal').classList.contains('hidden') && $('#dr-id')) {
                renderizarTarefasDaDor($('#dr-id').value);
            }
        }

        setInterval(() => { if (state.user && state.diaAtual && state.diaAtual !== hojeISO()) render(true); }, 60000);

        // ==========================================================
        // VIEW: DASHBOARD GERENCIAL
        // ==========================================================
        function progressoProjeto(projetoId) {
            const ts = state.tarefas.filter(t => t.projetoId === projetoId);
            const feitas = ts.filter(t => t.status === 'Validado').length;
            return { total: ts.length, feitas, pct: ts.length ? Math.round((feitas / ts.length) * 100) : 0, atrasadas: ts.filter(t => situacao(t).key === 'atrasada').length };
        }

        function kpi(label, valor, icon, borda, cor, attrs) {
            return `<div ${attrs} role="button" tabindex="0" title="Clique para ver os detalhes" class="bg-white p-4 rounded-xl shadow-sm border-l-4 ${borda} flex items-center justify-between cursor-pointer hover:shadow-lg hover:-translate-y-0.5 transition-all w-full">

        function dashboardHTML() {

            const projetosHTMLlista = ativos.length ? ativos.sort((a, b) => progressoProjeto(b.id).atrasadas - progressoProjeto(a.id).atrasadas).map(p => {

                    <div class="flex items-center justify-between gap-2 mb-2">

            const carga = state.membros.map(m => {
                const ts = abertas.filter(t => t.responsavelEmail === m.email);

            }).filter(x => x.total > 0).sort((a, b) => b.total - a.total);
            const maxCarga = Math.max(1, ...carga.map(c => c.total));
            const cargaHTML = carga.length ? carga.map(c => `
                <div data-action="filtrar-quadro" data-resp="${esc(c.m.email)}" data-sit="abertas" title="Ver tarefas de ${esc(c.m.nome)}" class="flex items-center gap-3 p-1.5 -m-1.5 rounded-lg cursor-pointer hover:bg-gray-50">
                    ${avatar(c.m.email, 'w-8 h-8 text-xs')}
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between text-xs mb-1"><span class="font-semibold truncate">${esc(c.m.nome)}</span><span class="text-gray-500">${c.total} aberta${c.total > 1 ? 's' : ''}${c.atr ? ` · <span class="text-red-600 font-bold">${c.atr} atrasada${c.atr > 1 ? 's' : ''}</span>` : ''}</span></div>
                        <div class="h-2 bg-gray-100 rounded-full overflow-hidden flex">

            return `<div>
                <div class="flex items-center justify-between mb-5 flex-wrap gap-2">

                    <button data-action="novo-projeto" class="bg-leveros-verde1 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-leveros-verde2 transition-colors"><i class="fas fa-folder-plus mr-1"></i> Novo Projeto</button>
                </div>

                <div class="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-6">
                    ${kpi('Projetos ativos', ativos.length, 'fa-folder-open', 'border-leveros-verde2', 'text-leveros-verde2', 'data-action="nav" data-view="projetos"')}
                    ${kpi('Tarefas abertas', abertas.length, 'fa-list-check', 'border-blue-400', 'text-blue-500', 'data-action="filtrar-quadro" data-sit="abertas"')}
                    ${kpi('Atrasadas', atrasadas.length, 'fa-triangle-exclamation', 'border-red-500', 'text-red-500', 'data-action="filtrar-quadro" data-sit="atrasada"')}
                    ${kpi('Vencem em breve', breve.length, 'fa-hourglass-half', 'border-yellow-400', 'text-yellow-500', 'data-action="filtrar-quadro" data-sit="breve"')}
                    ${kpi('Concluídas', concl, 'fa-circle-check', 'border-leveros-verde3', 'text-green-600', 'data-action="filtrar-quadro" data-sit="concluida"')}
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-5 gap-5">
                    <section class="lg:col-span-3 bg-white rounded-xl shadow-sm p-5 flex flex-col h-full">
                        <div class="flex items-center justify-between mb-3 gap-2 flex-wrap">
                            <h3 class="font-bold text-gray-700 flex items-center gap-2"><i class="fas fa-bars-progress text-leveros-verde2"></i> Projetos e progresso</h3>
                            <div class="relative w-full sm:w-auto">
                                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                                <input type="text" id="busca-projeto-dash" class="inp py-1.5 pl-8 pr-3 text-xs w-full sm:w-48" placeholder="Buscar projeto...">
                            </div>
                        </div>
                        <div class="flex flex-col gap-2.5 overflow-y-auto max-h-[340px] pr-2 -mr-2">
                            ${projetosHTMLlista}
                        </div>
                    </section>

                    <section class="lg:col-span-2 bg-white rounded-xl shadow-sm p-5">
                        <h3 class="font-bold text-gray-700 mb-3 flex items-center gap-2"><i class="fas fa-users text-leveros-verde2"></i> Carga por pessoa</h3>
                        <div class="flex flex-col gap-3">${cargaHTML}</div>
                        <p class="text-[11px] text-gray-400 mt-3"><span class="inline-block w-2 h-2 bg-red-400 rounded-sm"></span> atrasadas · <span class="inline-block w-2 h-2 bg-leveros-azul rounded-sm"></span> demais abertas</p>
                    </section>

                        ${atrasadas.length ? atrasadas.slice(0, 10).map(t => linhaTarefaCompacta(t)).join('') + (atrasadas.length > 10 ? `<p class="text-xs text-gray-400 text-center mt-2">+ ${atrasadas.length - 10} tarefas atrasadas</p>` : '') : '<p class="text-sm text-gray-400 py-6 text-center">🎉 Nenhuma tarefa atrasada.</p>'}
                    </section>

                    <section class="lg:col-span-2 bg-white rounded-xl shadow-sm p-5">
                        <h3 class="font-bold text-gray-700 mb-3 flex items-center gap-2"><i class="fas fa-hourglass-half text-yellow-500"></i> Vencem em até 2 dias</h3>
                        ${breve.length ? breve.slice(0, 8).map(t => linhaTarefaCompacta(t)).join('') : '<p class="text-sm text-gray-400 py-6 text-center">Nada vencendo nos próximos dias.</p>'}
                    </section>
                </div>
            </div>`;
        }

        // ==========================================================
        // VIEW: MINHAS TAREFAS
        // ==========================================================
        function minhasHTML() {
            const minhas = state.tarefas.filter(t => ehResponsavel(t) || ehColaborador(t));
            const abertas = minhas.filter(t => t.status !== 'Validado').sort((a, b) => (a.prazo || '9999').localeCompare(b.prazo || '9999'));
            const concl = minhas.filter(t => t.status === 'Validado').sort((a, b) => tsMillis(b.atualizadoEm) - tsMillis(a.atualizadoEm));
            const grupos = [
                { key: 'atrasada', titulo: '🔴 Atrasadas', cls: 'text-red-600' },
                { key: 'breve', titulo: '🟡 Entrega em breve (até 2 dias)', cls: 'text-yellow-600' },
                { key: 'ok', titulo: '🟢 No prazo', cls: 'text-green-600' },
                { key: 'sem-prazo', titulo: '⚪ Sem prazo', cls: 'text-gray-500' }
            ];

            const linha = (t) => {
                const acao = t.status === 'Pendente'
                    ? `<button data-action="mudar-status" data-id="${esc(t.id)}" data-status="Em Andamento" class="text-xs px-2.5 py-1 rounded-lg border border-blue-300 text-blue-600 hover:bg-blue-50 font-semibold whitespace-nowrap"><i class="fas fa-play mr-1"></i>Iniciar</button>`
                    : t.status === 'Em Andamento'
                        ? `<button data-action="mudar-status" data-id="${esc(t.id)}" data-status="Validado" class="text-xs px-2.5 py-1 rounded-lg border border-green-400 text-green-700 hover:bg-green-50 font-semibold whitespace-nowrap"><i class="fas fa-check mr-1"></i>Concluir</button>`
                        : `<button data-action="mudar-status" data-id="${esc(t.id)}" data-status="Em Andamento" class="text-xs px-2.5 py-1 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-50 font-semibold whitespace-nowrap"><i class="fas fa-rotate-left mr-1"></i>Reabrir</button>`;
                return `<div data-action="abrir-tarefa" data-id="${esc(t.id)}" class="bg-white rounded-lg border border-gray-200 p-3 flex items-center gap-3 cursor-pointer hover:shadow-md transition-shadow flex-wrap sm:flex-nowrap">
                    <div class="flex-1 min-w-0">
                        <div class="font-semibold text-gray-800 truncate">${esc(t.titulo)}</div>
                        <div class="flex items-center gap-2 mt-1 flex-wrap">${chipProjeto(getOrigemTarefa(t))}
                            <span class="text-[11px] text-gray-500"><i class="far fa-calendar mr-1"></i>${fmtBR(t.prazo)}</span>
                            <span class="text-[11px] px-1.5 py-0.5 rounded ${STATUS_META[t.status]?.badge || ''}">${esc(t.status)}</span>

                        </div>
                    </div>
                    ${ehResponsavel(t) ? '' : '<span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-700">🤝 Colaboração</span>'}
                    ${badgeSituacao(t)}
                    ${acao}
                </div>`;

            const blocos = grupos.map(g => {
                const ts = abertas.filter(t => situacao(t).key === g.key);

                return `<section class="mb-6"><h3 class="font-bold ${g.cls} mb-2 text-sm">${g.titulo} <span class="text-gray-400 font-normal">(${ts.length})</span></h3><div class="flex flex-col gap-2">${ts.map(linha).join('')}</div></section>`;
            }).join('');

            return `<div>
                <div class="flex items-center justify-between mb-5 flex-wrap gap-2">
                    <div><h2 class="text-2xl font-bold text-leveros-verde1">Minhas Tarefas</h2><p class="text-sm text-gray-500">${abertas.length} aberta${abertas.length === 1 ? '' : 's'} (atribuídas a você ou em colaboração).</p></div>
                </div>
                ${solicitacoesPainelHTML()}
                ${blocos || '<div class="bg-white rounded-xl p-10 text-center text-gray-400"><i class="fas fa-mug-hot text-4xl mb-3 text-leveros-azul"></i><p>Você não tem tarefas abertas. Aproveite!</p></div>'}
                ${concl.length ? `<section class="mt-8">
                    <button data-action="toggle-concluidas" class="text-sm font-bold text-gray-500 hover:text-gray-700 mb-2"><i class="fas fa-chevron-${state.minhasMostrarConcluidas ? 'down' : 'right'} mr-1"></i>✅ Concluídas (${concl.length})</button>${state.minhasMostrarConcluidas ? `<div class="flex flex-col gap-2">${concl.map(linha).join('')}</div>` : ''}
                </section>` : ''}
            </div>`;
        }

        // ==========================================================
        // VIEW: QUADRO (KANBAN)
        // ==========================================================
        function tarefasFiltradas() {
            const { projeto, resp, q, sit } = state.filtros;

            return state.tarefas.filter(t =>
                (!projeto || t.projetoId === projeto || t.dorId === projeto) &&
                (!resp || t.responsavelEmail === resp) &&

        function cardTarefa(t) {
            const p = getOrigemTarefa(t);

            return `<div class="task-card bg-white p-3 rounded-lg border border-gray-200 flex flex-col gap-2" draggable="${podeAtuar(t) ? 'true' : 'false'}" style="${podeAtuar(t) ? '' : 'cursor:pointer'}" data-action="abrir-tarefa" data-id="${esc(t.id)}">

                <div class="flex items-center justify-between flex-wrap gap-1">${badgeSituacao(t, false)}<span class="text-[11px] text-gray-500"><i class="far fa-calendar mr-1"></i>${fmtBR(t.prazo)}</span></div>
                <div class="flex items-center justify-between border-t pt-2 mt-1">
                    <div class="flex items-center gap-1.5 text-xs text-leveros-verde2 font-semibold">${avatar(t.responsavelEmail, 'w-6 h-6 text-[10px]')}${esc(primeiroNome(getMembro(t.responsavelEmail).nome))}</div>
                    <span class="text-[11px] text-gray-400">${(t.colaboradoresEmails || []).length ? `<span title="Apoio" class="mr-2"><i class="fas fa-user-group mr-1"></i>${t.colaboradoresEmails.length}</span>` : ''}${podeAtuar(t) ? '' : '<i class="fas fa-lock mr-2" title="Somente leitura/comentário"></i>'}<i class="far fa-comment mr-1"></i>${t.comentariosCount || 0}</span>
                </div>
            </div>`;
        }

        function boardHTML() {
            const lista = tarefasFiltradas();
            return `<div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-start">${STATUS.map(s => {
                const m = STATUS_META[s];
                const ts = lista.filter(t => t.status === s).sort(s === 'Validado'
                    ? (a, b) => tsMillis(b.atualizadoEm) - tsMillis(a.atualizadoEm)

                return `<div class="bg-gray-50 rounded-xl p-3 border border-gray-200 shadow-sm flex flex-col" data-drop="${s}">

        // ==========================================================
        // VIEW: PROJETOS
        // ==========================================================
        function projetosHTML() {
            const ativos = state.projetos.filter(p => p.status !== 'arquivado').sort((a, b) => a.nome.localeCompare(b.nome));

                ${arq.length ? `<h3 class="font-bold text-gray-500 mt-8 mb-3 text-sm">Arquivados</h3><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${arq.map(card).join('')}</div>` : ''}

        function projetoDetalheHTML() {

            const crons = state.cronogramas.filter(x => x.projetoId === p.id).sort((a, b) => tsMillis(a.criadoEm) - tsMillis(b.criadoEm));
            const donos = ehDonoProjeto(p);

            const cronHTML = crons.map(cr => {
                const ts = state.tarefas.filter(t => t.cronogramaId === cr.id).sort((a, b) => (a.prazo || '9999').localeCompare(b.prazo || '9999'));

                        <div class="min-w-0"><h3 class="font-bold text-leveros-verde1"><i class="far fa-calendar-check text-leveros-verde2 mr-2"></i>${esc(cr.nome)}</h3><p class="text-[11px] text-gray-500">${feitas}/${ts.length} concluídas · ${pct}%</p></div>
