<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle Gerencial - Leveros</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        // Cores Leveros
                        leveros: {
                            v1: '#002D32', // Verde 1 (Dark)
                            v2: '#005A64', // Verde 2 (Medium Dark)
                            azul: '#4CDDDD', // Azul (Highlight)
                            v3: '#6FFFAF', // Verde 3 (Light/Success)
                            v4: '#CEFFAE', // Verde 4 (Lighter)
                            amarelo: '#FFCE00' // Amarelo (Warning/Progress)
                        },
                        background: '#f8fafc',
                        surface: '#ffffff'
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #005A64; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #002D32; }
        .drag-over { background-color: #f1f5f9; border: 2px dashed #005A64; }
        .glass-effect { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-background text-gray-800 font-sans h-screen flex overflow-hidden">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="fixed inset-0 bg-leveros-v1 flex items-center justify-center z-50 transition-opacity duration-300">
        <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full text-center mx-4">
            <div class="w-20 h-20 bg-leveros-azul rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg">
                <i class="fa-solid fa-chart-pie text-leveros-v1 text-4xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-leveros-v1 mb-2">ProcessFlow Leveros</h2>
            <p class="text-gray-500 mb-8">Faça login para gerenciar projetos e atividades.</p>
            
            <button id="btn-google-login" class="w-full flex items-center justify-center bg-white border-2 border-gray-200 text-gray-700 font-medium py-3 px-4 rounded-xl hover:bg-gray-50 hover:border-gray-300 transition-all shadow-sm">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5 mr-3">
                Entrar com Google
            </button>
        </div>
    </div>

    <!-- MAIN APP APP (Hidden until logged in) -->
    <div id="app-container" class="flex w-full h-full hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-leveros-v1 text-white flex flex-col hidden md:flex z-20 shadow-xl">
            <div class="h-16 flex items-center px-6 border-b border-leveros-v2 bg-leveros-v1">
                <i class="fa-solid fa-chart-pie text-leveros-azul text-xl mr-3"></i>
                <span class="font-bold text-lg tracking-wide">ProcessFlow</span>
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <a href="#" onclick="window.app.switchTab('dashboard')" id="nav-dashboard" class="nav-item flex items-center px-4 py-3 bg-leveros-v2 text-white rounded-lg transition-colors border-l-4 border-leveros-azul">
                    <i class="fa-solid fa-house w-6 text-leveros-azul"></i>
                    <span class="font-medium">Dashboard</span>
                </a>
                <a href="#" onclick="window.app.switchTab('tasks')" id="nav-tasks" class="nav-item flex items-center px-4 py-3 text-gray-300 hover:bg-leveros-v2 hover:text-white rounded-lg transition-colors border-l-4 border-transparent">
                    <i class="fa-solid fa-list-check w-6"></i>
                    <span class="font-medium">Atividades</span>
                </a>
            </nav>
            <div class="p-4 border-t border-leveros-v2 bg-leveros-v1">
                <div class="flex items-center">
                    <img id="user-photo" src="https://placehold.co/100x100/4CDDDD/002D32?text=U" alt="User" class="w-10 h-10 rounded-full border-2 border-leveros-azul object-cover">
                    <div class="ml-3 overflow-hidden">
                        <p id="user-name" class="text-sm font-medium text-white truncate">Usuário</p>
                        <button id="btn-logout" class="text-xs text-leveros-azul hover:text-white transition-colors mt-1">Sair da conta</button>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-screen overflow-hidden relative bg-gray-50">
            <!-- Header -->
            <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 z-10 shadow-sm">
                <div class="flex items-center md:hidden">
                    <i class="fa-solid fa-chart-pie text-leveros-v1 text-xl mr-2"></i>
                    <span class="font-bold text-lg text-leveros-v1">ProcessFlow</span>
                </div>
                <h1 id="page-title" class="text-xl font-bold text-leveros-v1 hidden md:block">Visão Geral</h1>
                <div class="flex items-center space-x-4">
                    <button onclick="window.app.openModal()" class="bg-leveros-v2 hover:bg-leveros-v1 text-white px-5 py-2.5 rounded-lg text-sm font-medium transition-all shadow-md flex items-center">
                        <i class="fa-solid fa-plus mr-2 text-leveros-azul"></i> Nova Atividade
                    </button>
                </div>
            </header>

            <!-- Dynamic Content Area -->
            <div id="content-area" class="flex-1 overflow-y-auto p-6">
                <!-- Content injected via JS -->
            </div>
        </main>
    </div>

    <!-- Modal Form -->
    <div id="task-modal" class="fixed inset-0 bg-leveros-v1 bg-opacity-80 hidden flex items-center justify-center z-50 transition-opacity backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl mx-4 overflow-hidden flex flex-col max-h-[90vh]">
            <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                <h3 class="text-xl font-bold text-leveros-v1">Distribuir Nova Atividade</h3>
                <button onclick="window.app.closeModal()" class="text-gray-400 hover:text-red-500 transition-colors">
                    <i class="fa-solid fa-xmark text-2xl"></i>
                </button>
            </div>
            <div class="overflow-y-auto p-6">
                <form id="task-form" class="space-y-5" onsubmit="window.app.submitTask(event)">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div class="col-span-1 md:col-span-2">
                            <label class="block text-sm font-bold text-leveros-v2 mb-1">Título da Atividade *</label>
                            <input type="text" id="task-title" required class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-leveros-azul focus:border-transparent bg-gray-50" placeholder="Ex: Mapeamento de Processos">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-bold text-leveros-v2 mb-1">Projeto Relacionado *</label>
                            <input type="text" id="task-project" required class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-leveros-azul focus:border-transparent bg-gray-50" placeholder="Nome do Projeto (ex: Migração ERP)">
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-leveros-v2 mb-1">Responsável *</label>
                            <select id="task-assignee" required class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-leveros-azul focus:border-transparent bg-gray-50">
                                <option value="Ariany Santos">Ariany Santos</option>
                                <option value="Priscila Baldo">Priscila Baldo</option>
                                <option value="Matheus Alves">Matheus Alves</option>
                                <option value="Alessandra Mincov">Alessandra Mincov</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-leveros-v2 mb-1">Observações Gerais</label>
                        <textarea id="task-obs" rows="2" class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-leveros-azul focus:border-transparent bg-gray-50" placeholder="Detalhes, links ou instruções..."></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-leveros-v2 mb-1">Sugestões de Melhorias</label>
                        <textarea id="task-sug" rows="2" class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-leveros-azul focus:border-transparent bg-gray-50" placeholder="Ideias para otimizar esse processo..."></textarea>
                    </div>

                    <div class="pt-4 border-t border-gray-200 flex justify-end space-x-3">
                        <button type="button" onclick="window.app.closeModal()" class="px-5 py-2.5 text-sm font-bold text-gray-600 bg-gray-100 rounded-xl hover:bg-gray-200 focus:outline-none transition-colors">
                            Cancelar
                        </button>
                        <button type="submit" class="px-5 py-2.5 text-sm font-bold text-leveros-v1 bg-leveros-azul rounded-xl hover:bg-[#3bc2c2] focus:outline-none shadow-md transition-colors">
                            Salvar Atividade
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Firebase SDK & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // Handle global vars from environment if present, otherwise use mock config to prevent crash
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "mock-key",
            authDomain: "mock-domain.firebaseapp.com",
            projectId: "mock-project"
        };

        let app, auth, provider;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            provider = new GoogleAuthProvider();
        } catch(e) {
            console.warn("Firebase initialization skipped or failed. Using mock auth mode.", e);
        }

        // Main App Logic Object attached to window for HTML event handlers
        window.app = {
            currentUser: null,
            state: {
                currentTab: 'tasks',
                tasks: [
                    { id: 'T1', title: 'Atualização do Sistema', project: 'Gestão de Projetos', assignee: 'Ariany Santos', status: 'in-progress', creator: 'Sistema', obs: '', sug: 'Usar paleta Leveros' },
                    { id: 'T2', title: 'Validação de Base de Clientes', project: 'CRM Integrado', assignee: 'Matheus Alves', status: 'pending', creator: 'Sistema', obs: 'Analisar inconsistências', sug: '' },
                    { id: 'T3', title: 'Treinamento Equipe Comercial', project: 'Expansão Q4', assignee: 'Priscila Baldo', status: 'validated', creator: 'Sistema', obs: 'Realizado online', sug: 'Gravar próximas sessões' }
                ]
            },

            init() {
                this.setupAuth();
            },

            setupAuth() {
                const loginScreen = document.getElementById('login-screen');
                const appContainer = document.getElementById('app-container');
                const btnLogin = document.getElementById('btn-google-login');
                const btnLogout = document.getElementById('btn-logout');

                // Mock login for environments where popup is blocked (like iframes)
                const mockLogin = () => {
                    this.handleLoginSuccess({
                        displayName: 'Usuário Leveros',
                        photoURL: 'https://placehold.co/100x100/4CDDDD/002D32?text=UL',
                        email: 'user@leveros.com'
                    });
                };

                btnLogin.addEventListener('click', async () => {
                    if (!auth) { mockLogin(); return; }
                    try {
                        // Attempt real Google Auth
                        const result = await signInWithPopup(auth, provider);
                        this.handleLoginSuccess(result.user);
                    } catch (error) {
                        console.error("Auth error, falling back to mock login.", error);
                        // Fallback for iframe restrictions
                        mockLogin();
                    }
                });

                btnLogout.addEventListener('click', () => {
                    if (auth) signOut(auth);
                    this.currentUser = null;
                    appContainer.classList.add('hidden');
                    loginScreen.classList.remove('hidden');
                });

                if (auth) {
                    onAuthStateChanged(auth, (user) => {
                        if (user) {
                            this.handleLoginSuccess(user);
                        }
                    });
                }
            },

            handleLoginSuccess(user) {
                this.currentUser = user;
                document.getElementById('user-name').textContent = user.displayName || 'Usuário';
                if(user.photoURL) {
                    document.getElementById('user-photo').src = user.photoURL;
                }
                
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                
                this.switchTab('tasks'); // Default to tasks
            },

            switchTab(tab) {
                this.state.currentTab = tab;
                
                // Update Nav UI
                document.querySelectorAll('.nav-item').forEach(el => {
                    el.classList.remove('bg-leveros-v2', 'text-white', 'border-leveros-azul');
                    el.classList.add('text-gray-300', 'border-transparent');
                    el.querySelector('i').classList.remove('text-leveros-azul');
                });
                const activeNav = document.getElementById(`nav-${tab}`);
                if(activeNav) {
                    activeNav.classList.remove('text-gray-300', 'border-transparent');
                    activeNav.classList.add('bg-leveros-v2', 'text-white', 'border-leveros-azul');
                    activeNav.querySelector('i').classList.add('text-leveros-azul');
                }

                document.getElementById('page-title').innerText = tab === 'dashboard' ? 'Visão Geral' : 'Controle de Atividades (Kanban)';
                this.render();
            },

            render() {
                const contentArea = document.getElementById('content-area');
                if (this.state.currentTab === 'dashboard') {
                    contentArea.innerHTML = this.getDashboardHTML();
                } else if (this.state.currentTab === 'tasks') {
                    contentArea.innerHTML = this.getKanbanHTML();
                    this.setupDragAndDrop();
                }
            },

            getDashboardHTML() {
                const pending = this.state.tasks.filter(t => t.status === 'pending').length;
                const inProgress = this.state.tasks.filter(t => t.status === 'in-progress').length;
                const validated = this.state.tasks.filter(t => t.status === 'validated').length;

                return `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        <div class="bg-white rounded-2xl shadow-sm p-6 border-l-4 border-gray-400">
                            <p class="text-sm font-bold text-gray-500 uppercase">Pendentes</p>
                            <h3 class="text-4xl font-bold text-leveros-v1 mt-2">${pending}</h3>
                        </div>
                        <div class="bg-white rounded-2xl shadow-sm p-6 border-l-4 border-leveros-amarelo">
                            <p class="text-sm font-bold text-gray-500 uppercase">Em Andamento</p>
                            <h3 class="text-4xl font-bold text-leveros-v1 mt-2">${inProgress}</h3>
                        </div>
                        <div class="bg-white rounded-2xl shadow-sm p-6 border-l-4 border-leveros-v3">
                            <p class="text-sm font-bold text-gray-500 uppercase">Validados</p>
                            <h3 class="text-4xl font-bold text-leveros-v1 mt-2">${validated}</h3>
                        </div>
                    </div>
                `;
            },

            getKanbanHTML() {
                const getColumnTasks = (status) => this.state.tasks.filter(t => t.status === status).map(t => this.getTaskCardHTML(t)).join('');
                
                return `
                    <div class="flex flex-col md:flex-row gap-6 h-full pb-4">
                        <!-- Pendentes -->
                        <div class="flex-1 flex flex-col bg-gray-200/50 rounded-2xl border border-gray-200">
                            <div class="p-4 border-b border-gray-200 bg-white/60 rounded-t-2xl flex justify-between items-center">
                                <h3 class="font-bold text-leveros-v1 flex items-center">
                                    <span class="w-3 h-3 rounded-full bg-gray-400 mr-2 shadow-sm"></span>Pendentes
                                </h3>
                                <span class="bg-white text-leveros-v1 shadow-sm text-xs font-bold px-3 py-1 rounded-full">${this.state.tasks.filter(t=>t.status==='pending').length}</span>
                            </div>
                            <div class="p-4 flex-1 overflow-y-auto space-y-4 kanban-column" data-status="pending">
                                ${getColumnTasks('pending')}
                            </div>
                        </div>

                        <!-- Em Andamento -->
                        <div class="flex-1 flex flex-col bg-gray-200/50 rounded-2xl border border-gray-200">
                            <div class="p-4 border-b border-gray-200 bg-white/60 rounded-t-2xl flex justify-between items-center">
                                <h3 class="font-bold text-leveros-v1 flex items-center">
                                    <span class="w-3 h-3 rounded-full bg-leveros-amarelo mr-2 shadow-sm"></span>Em Andamento
                                </h3>
                                <span class="bg-white text-leveros-v1 shadow-sm text-xs font-bold px-3 py-1 rounded-full">${this.state.tasks.filter(t=>t.status==='in-progress').length}</span>
                            </div>
                            <div class="p-4 flex-1 overflow-y-auto space-y-4 kanban-column" data-status="in-progress">
                                ${getColumnTasks('in-progress')}
                            </div>
                        </div>

                        <!-- Validados -->
                        <div class="flex-1 flex flex-col bg-gray-200/50 rounded-2xl border border-gray-200">
                            <div class="p-4 border-b border-gray-200 bg-white/60 rounded-t-2xl flex justify-between items-center">
                                <h3 class="font-bold text-leveros-v1 flex items-center">
                                    <span class="w-3 h-3 rounded-full bg-leveros-v3 mr-2 shadow-sm"></span>Validados
                                </h3>
                                <span class="bg-white text-leveros-v1 shadow-sm text-xs font-bold px-3 py-1 rounded-full">${this.state.tasks.filter(t=>t.status==='validated').length}</span>
                            </div>
                            <div class="p-4 flex-1 overflow-y-auto space-y-4 kanban-column" data-status="validated">
                                ${getColumnTasks('validated')}
                            </div>
                        </div>
                    </div>
                `;
            },

            getTaskCardHTML(task) {
                // Determine border color based on status
                let borderClass = 'border-l-4 border-gray-300';
                if(task.status === 'in-progress') borderClass = 'border-l-4 border-leveros-amarelo';
                if(task.status === 'validated') borderClass = 'border-l-4 border-leveros-v3';

                return `
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 ${borderClass} cursor-grab hover:shadow-md transition-all task-card" draggable="true" data-id="${task.id}">
                        <!-- PROMINENT PROJECT BADGE -->
                        <div class="mb-3 inline-block">
                            <span class="bg-leveros-v1 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm">
                                <i class="fa-solid fa-folder-open mr-1 text-leveros-azul"></i> ${task.project}
                            </span>
                        </div>
                        
                        <h4 class="font-bold text-gray-900 mb-2 text-base leading-snug">${task.title}</h4>
                        
                        ${task.obs ? `<p class="text-xs text-gray-500 mb-1"><strong class="text-leveros-v2">Obs:</strong> ${task.obs}</p>` : ''}
                        ${task.sug ? `<p class="text-xs text-gray-500 mb-3"><strong class="text-leveros-v2">Ideia:</strong> ${task.sug}</p>` : ''}
                        
                        <div class="mt-4 pt-3 border-t border-gray-100 flex flex-col gap-2">
                            <div class="flex justify-between items-center w-full">
                                <div class="flex items-center" title="Responsável: ${task.assignee}">
                                    <div class="w-8 h-8 rounded-full bg-leveros-v2 text-white flex items-center justify-center text-xs font-bold shadow-sm">${task.assignee.split(' ').map(n=>n[0]).join('').substring(0,2)}</div>
                                    <span class="text-xs font-medium text-gray-700 ml-2">${task.assignee}</span>
                                </div>
                                <div class="flex space-x-1">
                                    ${task.status !== 'pending' ? `<button onclick="window.app.moveTask('${task.id}', 'pending')" class="w-7 h-7 rounded bg-gray-50 text-gray-500 hover:text-leveros-v1 hover:bg-gray-200 flex items-center justify-center transition-colors" title="Mover para Pendente"><i class="fa-solid fa-arrow-left text-xs"></i></button>` : ''}
                                    ${task.status === 'pending' ? `<button onclick="window.app.moveTask('${task.id}', 'in-progress')" class="w-7 h-7 rounded bg-gray-50 text-gray-500 hover:text-leveros-amarelo hover:bg-yellow-50 flex items-center justify-center transition-colors" title="Mover para Em Andamento"><i class="fa-solid fa-arrow-right text-xs"></i></button>` : ''}
                                    ${task.status === 'in-progress' ? `<button onclick="window.app.moveTask('${task.id}', 'validated')" class="w-7 h-7 rounded bg-gray-50 text-gray-500 hover:text-leveros-v3 hover:bg-green-50 flex items-center justify-center transition-colors" title="Validar Processo"><i class="fa-solid fa-check text-xs"></i></button>` : ''}
                                </div>
                            </div>
                            <div class="text-[10px] text-gray-400 mt-1">Registrado por: ${task.creator}</div>
                        </div>
                    </div>
                `;
            },

            openModal() {
                document.getElementById('task-modal').classList.remove('hidden');
            },

            closeModal() {
                document.getElementById('task-modal').classList.add('hidden');
                document.getElementById('task-form').reset();
            },

            submitTask(e) {
                e.preventDefault();
                const creatorName = this.currentUser ? (this.currentUser.displayName || 'Usuário Logado') : 'Desconhecido';
                
                const newTask = {
                    id: 'T' + Date.now(),
                    title: document.getElementById('task-title').value,
                    project: document.getElementById('task-project').value,
                    assignee: document.getElementById('task-assignee').value,
                    status: 'pending',
                    obs: document.getElementById('task-obs').value,
                    sug: document.getElementById('task-sug').value,
                    creator: creatorName
                };
                
                this.state.tasks.unshift(newTask);
                this.closeModal();
                this.render();
            },

            moveTask(id, newStatus) {
                const task = this.state.tasks.find(t => t.id === id);
                if(task) {
                    task.status = newStatus;
                    this.render();
                }
            },

            setupDragAndDrop() {
                const cards = document.querySelectorAll('.task-card');
                const columns = document.querySelectorAll('.kanban-column');

                cards.forEach(card => {
                    card.addEventListener('dragstart', (e) => {
                        e.dataTransfer.setData('text/plain', card.dataset.id);
                        setTimeout(() => card.classList.add('opacity-50'), 0);
                    });
                    card.addEventListener('dragend', () => {
                        card.classList.remove('opacity-50');
                        columns.forEach(col => col.classList.remove('drag-over'));
                    });
                });

                columns.forEach(col => {
                    col.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        col.classList.add('drag-over');
                    });
                    col.addEventListener('dragleave', () => {
                        col.classList.remove('drag-over');
                    });
                    col.addEventListener('drop', (e) => {
                        e.preventDefault();
                        col.classList.remove('drag-over');
                        const id = e.dataTransfer.getData('text/plain');
                        const newStatus = col.dataset.status;
                        this.moveTask(id, newStatus);
                    });
                });
            }
        };

        // Initialize when DOM is ready
        window.addEventListener('DOMContentLoaded', () => {
            window.app.init();
        });
    </script>
</body>
</html>
