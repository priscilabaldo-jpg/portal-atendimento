
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leveros | CX Timeline Feed</title>
    
    <!--
        CORREÇÃO CSP: img-src ampliado para permitir:
        - Imagens diretas da web (qualquer https)
        - Google Drive via /thumbnail e /uc?export=view
        - lh3.googleusercontent.com (fotos de perfil Google e Drive)
        - data: URIs (inline)
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com https://cdn.jsdelivr.net;
      style-src 'self' 'unsafe-inline';
      connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://api.emailjs.com;
      frame-src https://portal-atendimento-541ae.firebaseapp.com https://accounts.google.com;
      img-src 'self' data: blob: https: http:;
    ">

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
       (function(){
          emailjs.init({
            publicKey: "AUZIT5qioj8fQ_cQ8",
          });
       })();
    
</head>
<body>
    <header class="top-header">
        <div class="header-inner">
            <img src="LogoLeveros.png" class="header-logo" alt="Leveros">
            <nav>
                <ul>
                    <li><a href="index.html">INÍCIO</a></li>
                    <li><a href="formn1.html">TRIAGEM N1</a></li>
                    <li><a href="timeline.html" class="active">TIMELINE</a></li>
                    <li><a href="materiais.html">MATERIAIS</a></li>
                    <li><a href="informativos.html">INFORMATIVOS</a></li>
                    <li><a href="atendeuResolveu.html">ATENDEU, RESOLVEU!</a></li>
                    <li><a href="admin.html">PAINEL ADMIN</a></li>
                    <li>
                        <div class="balance-pill" id="saldoPillGlobal">
                            <span class="coin-icon">🪙</span><span id="valSaldoGlobal">Carregando...</span>
                        </div>
                    </li>
                    <li><button class="logout-btn" id="logoutBtnGlobal">Sair</button></li>
                </ul>
            </nav>
        </div>
        
        <div class="ticker-wrapper">
            <div class="ticker-content" id="tickerContent">
                <span class="ticker-item">🏆 Feed Ticker: Aguardando dados...</span>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="timeline-layout">
            
            <main class="feed-container">
                
                <header class="timeline-header">
                    <p class="label">COMUNIDADE CX LEVEROS</p>
                    <h1>Nosso <span class="high">Feed</span> 💬</h1>
                    <p class="subtitle">Compartilhe conquistas, dicas e o dia a dia do time!</p>
                </header>
                
                <div class="create-post-box">
                    <div class="create-post-main">
                        <div class="user-avatar" id="myAvatarGlobal" style="background: #ccc; color: #fff;">U</div>
                        <textarea class="create-post-input" id="postTextGlobal" rows="3" placeholder="No que você está pensando, time?"></textarea>
                    </div>
                    <div class="create-post-actions">
                        
                        <div class="image-url-wrap">
                            <span class="link-icon">🔗</span>
                            <input type="text" class="create-post-input-link" id="mediaUrlInputGlobal" placeholder="Link do recurso ou imagem (Opcional)">
                        </div>
                        
                        <div class="right-publish">
                            <label class="create-post-checkbox">
                                <input type="checkbox" id="sendEmailCheckboxGlobal" checked>
                                Disparar E-mail
                            </label>
                            <button class="create-post-publish-btn" id="btnPublishGlobal">Publicar</button>
                        </div>
                    </div>
                </div>
                
                <div id="feedListGlobal">
                    <div class="page-loading-status">Carregando publicações...</div>
                </div>
                
            </main>
            
            <aside class="ranking-sidebar">
                <div class="ranking-card">
                    <header class="ranking-title">
                        <h2>🏆 RANKING CX</h2>
                        <span class="coin">🪙</span>
                    </header>
                    <span class="ranking-subtitle">Saldo atual de toda a equipe</span>
                    
                    <div class="ranking-list" id="rankingListGlobal">
                        <div class="no-data">Carregando ranking...</div>
                    </div>
                </div>
            </aside>
            
        </div>
    </div>
        <div id="likesModal" class="modal-overlay" onclick="if(event.target === this) fecharModalLikes()">
        <div class="likes-modal-content">
            <div class="likes-modal-header">
                <span>Curtidas</span>
                <button class="likes-modal-close" onclick="fecharModalLikes()">✕</button>
            </div>
            <div class="likes-modal-body" id="likesModalList">
                </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
