<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triagem T&D | Análise de Pós-Recebimento</title>
    <style>
        :root { --azul: #004b87; --vermelho: #d9534f; --verde: #28a745; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 850px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: #333; margin-bottom: 25px; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; }
        h3 { color: #002b5e; margin-top: 25px; font-size: 16px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; font-size: 14px; }
        select, input[type="date"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        .hidden { display: none !important; }
        .alert-box { padding: 15px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; }
        .alert-danger { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-warning { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .result-section p { font-size: 14px; line-height: 1.6; white-space: pre-wrap; margin-bottom: 10px; }
        .crm-text { color: var(--vermelho); font-weight: 600; }
        .acao-text { color: var(--azul); font-weight: 600; }
        textarea { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #ddd; resize: vertical; background: #fafafa; font-family: monospace; font-size: 13px; margin-bottom: 15px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: var(--azul); color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #003a6b; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Triagem T&D | Análise de Pós-Recebimento</h2>
        
        <div class="form-group">
            <label>1. Qual o Canal de Compra?</label>
            <select id="canalCompra" onchange="avaliarFluxo()">
                <option value="">Selecione...</option>
                <option value="amazon_meli">Amazon e Mercado Livre</option>
                <option value="site_outros">Site, Vendas Assistidas e demais plataformas</option>
            </select>
        </div>

        <div class="form-group">
            <label>2. O produto já foi instalado?</label>
            <select id="produtoInstalado" onchange="avaliarFluxo()">
                <option value="">Selecione...</option>
                <option value="SIM">Sim</option>
                <option value="NAO">Não</option>
            </select>
        </div>

        <div class="form-group hidden" id="divData">
            <label style="color: var(--azul);">3. Data de Recebimento da Mercadoria:</label>
            <input type="date" id="dataRecebimento" onchange="avaliarFluxo()">
        </div>

        <div class="form-group hidden" id="divAceite">
            <label style="color: #721c24;">⚠️ O prazo excedeu. Cliente aceitou a negativa?</label>
            <select id="aceitouNegativa" onchange="avaliarFluxo()">
                <option value="">Selecione...</option>
                <option value="SIM">Sim</option>
                <option value="NAO">Não</option>
            </select>
        </div>

        <div class="form-group hidden" id="divFotos">
            <label>4. Cliente possui as fotos necessárias (produto, caixa, etiquetas)?</label>
            <select id="possuiFotos" onchange="avaliarFluxo()">
                <option value="">Selecione...</option>
                <option value="SIM">Sim</option>
                <option value="NAO">Não</option>
            </select>
        </div>

        <div id="resultadoFinal" class="hidden result-section">
            
            <div id="statusBox" class="alert-box hidden"></div>

            <h3>🗣️ O que informar ao cliente</h3>
            <p id="textoAcao" class="acao-text"></p>
            
            <h3>🖥️ Como abrir no CRM (Ação do Operador)</h3>
            <p id="textoCRM" class="crm-text"></p>

            <hr style="border: 0; border-top: 1px solid #eee; margin: 25px 0;">

            <h3>📝 Script de Resumo para o CRM</h3>
            <textarea id="textoResumoCRM" readonly rows="8"></textarea>
            <button id="btnCopiar" onclick="copiarResumo()">📋 Copiar Script</button>
        </div>

    </div>

    <script>
        function calcularDias(dataInicio) {
            const inicio = new Date(dataInicio + "T00:00:00");
            const fim = new Date();
            fim.setHours(0,0,0,0);
            return Math.floor((fim - inicio) / (24 * 60 * 60 * 1000));
        }

        function avaliarFluxo() {
            const canal = document.getElementById("canalCompra").value;
            const instalado = document.getElementById("produtoInstalado").value;
            const dataRecVal = document.getElementById("dataRecebimento").value;
            const aceitouNeg = document.getElementById("aceitouNegativa").value;
            const fotos = document.getElementById("possuiFotos").value;

            // Elementos de UI
            const divData = document.getElementById("divData");
            const divAceite = document.getElementById("divAceite");
            const divFotos = document.getElementById("divFotos");
            const resBox = document.getElementById("resultadoFinal");
            const statBox = document.getElementById("statusBox");

            // Reset UI
            resBox.classList.add("hidden");
            statBox.classList.add("hidden");
            divAceite.classList.add("hidden");
            divFotos.classList.add("hidden");

            if (!canal || !instalado) {
                divData.classList.add("hidden");
                return;
            }

            // PRODUTO INSTALADO (Fim de fluxo)
            if (instalado === "SIM") {
                divData.classList.add("hidden");
                statBox.className = "alert-box alert-danger";
                statBox.innerHTML = `<strong>🚫 DEVOLUÇÃO RECUSADA - PRODUTO INSTALADO</strong><br>A devolução ou troca logística não atende produtos já instalados.`;
                statBox.classList.remove("hidden");
                
                document.getElementById("textoAcao").textContent = "Informar ao cliente que a solicitação não pode prosseguir por esta via pois o produto já foi instalado. Casos de defeito devem seguir para a Assistência Técnica Autorizada.";
                document.getElementById("textoCRM").textContent = "Registrar protocolo informando negativa por produto instalado.";
                gerarResumo("Recusado - Produto Instalado", canal, null, null, null, document.getElementById("textoAcao").textContent, document.getElementById("textoCRM").textContent);
                return;
            }

            // PRODUTO NÃO INSTALADO
            divData.classList.remove("hidden");
            if (!dataRecVal) return;

            const dias = calcularDias(dataRecVal);
            const prazoMax = canal === "amazon_meli" ? 30 : 7;
            const nomeCanal = canal === "amazon_meli" ? "Amazon/Meli" : "Site e demais plataformas";
            const isDentro = dias <= prazoMax;

            let acao = "";
            let crm = "";
            let status = "";

            if (isDentro) {
                // FLUXO: DENTRO DO PRAZO
                statBox.className = "alert-box alert-success";
                statBox.innerHTML = `<strong>✅ DENTRO DO PRAZO (${dias} de ${prazoMax} dias)</strong>`;
                statBox.classList.remove("hidden");
                
                divFotos.classList.remove("hidden");
                if (!fotos) return;

                if (fotos === "SIM") {
                    status = "Aprovado para Análise (Dentro do Prazo)";
                    acao = "• Informar o cliente que está dentro do prazo e seguiremos com análise de troca dentro de até 3 dias úteis.\n• Orientar o cliente que o protocolo passará por análise e dentro de até 3 dias úteis iremos retornar o contato.";
                    crm = `Abrir protocolo\nMotivo: Troca - Dentro dos ${prazoMax} dias ${canal === 'amazon_meli' ? 'Amazon/Meli' : ''}\n\n-> Ação: Direcionar o protocolo para o bkoffice.`;
                } else {
                    status = "Retido - Faltam Fotos";
                    acao = "• Informar o cliente que está dentro do prazo e seguiremos com análise de troca dentro de até 3 dias úteis.\n• Orientar o cliente que sem as fotos não é possível seguir com a análise.";
                    crm = "Registrar o protocolo\nMotivo: Informações sobre troca e devolução\nSubmotivo: evidências faltantes.";
                }

            } else {
                // FLUXO: FORA DO PRAZO
                statBox.className = "alert-box alert-warning";
                statBox.innerHTML = `<strong>⚠️ FORA DO PRAZO (${dias} dias decorridos. O limite era ${prazoMax})</strong>`;
                statBox.classList.remove("hidden");

                divAceite.classList.remove("hidden");
                if (!aceitouNeg) return;

                if (aceitouNeg === "SIM") {
                    status = "Finalizado - Cliente Aceitou Negativa";
                    acao = `Informar o cliente que o prazo de ${prazoMax} dias se encerrou e que desse modo não é possível prosseguirmos com a troca.`;
                    crm = "Abrir protocolo\nMotivo: Informações sobre troca e devolução\nSubmotivo: Retido em contato.";
                } else {
                    // Não aceitou a negativa, exige as fotos para tentar exceção
                    divFotos.classList.remove("hidden");
                    if (!fotos) return;

                    if (fotos === "SIM") {
                        status = "Encaminhado p/ Análise Exceção (Fora do Prazo)";
                        acao = "• Informar que será encaminhado para análise, mas que há a chance de negativa devido estar fora do prazo.\n• Orientar o cliente que o protocolo passará por análise e dentro de até 3 dias úteis iremos retornar o contato.";
                        crm = `Abrir protocolo\nMotivo: Troca - Fora dos ${prazoMax} dias ${canal === 'amazon_meli' ? 'Amazon/Meli' : ''}\n\n-> Ação: Direcionar o protocolo para o bkoffice.`;
                    } else {
                        status = "Retido na Exceção - Faltam Fotos";
                        acao = "• Informar que será encaminhado para análise, mas que há a chance de negativa devido estar fora do prazo.\n• Orientar o cliente que sem as fotos não é possível seguir com a análise.";
                        crm = "Registrar o protocolo\nMotivo: Informações sobre troca e devolução\nSubmotivo: evidências faltantes.";
                    }
                }
            }

            document.getElementById("textoAcao").textContent = acao;
            document.getElementById("textoCRM").textContent = crm;
            gerarResumo(status, nomeCanal, dataRecVal, dias, prazoMax, acao, crm);
        }

        function gerarResumo(status, canal, dataRec, dias, prazoMax, acao, crm) {
            let script = `[ANÁLISE PÓS-RECEBIMENTO T&D]\n`;
            script += `Canal: ${canal}\n`;
            if (dataRec) {
                script += `Data Recebimento: ${dataRec.split('-').reverse().join('/')} (${dias} dias decorridos)\n`;
                script += `Prazo Permitido: ${prazoMax} dias\n`;
                const fotos = document.getElementById("possuiFotos").value;
                if (fotos) script += `Possui Fotos: ${fotos === 'SIM' ? 'Sim' : 'Não'}\n`;
            }
            script += `\n[DIRECIONAMENTO]\n`;
            script += `Status: ${status}\n`;
            script += `Ação Aplicada no CRM: \n${crm.replace('-> Ação: ', '')}`;
            
            document.getElementById("textoResumoCRM").value = script;
            document.getElementById("resultadoFinal").classList.remove("hidden");
        }

        function copiarResumo() {
            const txt = document.getElementById("textoResumoCRM");
            txt.select();
            navigator.clipboard.writeText(txt.value).then(() => {
                const btn = document.getElementById("btnCopiar");
                btn.textContent = "✅ Copiado!";
                btn.style.background = "var(--verde)";
                setTimeout(() => {
                    btn.textContent = "📋 Copiar Script";
                    btn.style.background = "var(--azul)";
                }, 2500);
            });
        }
    </script>
</body>
</html>
