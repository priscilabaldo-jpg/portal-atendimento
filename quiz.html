<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Metas - Leveros</title>
    
    <!-- Biblioteca SheetJS para gerar o Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <style>
        /* Tabela de cores Leveros */
        :root {
            --verde-1: #002D32;
            --verde-2: #005A64;
            --azul: #4CDDDD;
            --verde-3: #6FFFAF;
            --verde-4: #CEFFAE;
            --amarelo: #FFCE00;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--verde-1);
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* TELAS DE ABERTURA E FINALIZAÇÃO */
        #intro-screen, #end-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--verde-1);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }

        #end-screen {
            display: none;
            opacity: 0; 
            transform: translateY(20px);
            overflow-y: auto;
            padding: 40px 20px;
        }

        .screen-content h1 {
            color: var(--amarelo);
            font-size: 3.5em;
            margin-bottom: 10px;
        }

        .screen-content p {
            color: var(--verde-4);
            font-size: 2em;
            margin-bottom: 30px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        /* Animações */
        .fade-in-up {
            opacity: 0;
            transform: translateY(40px);
            animation: fadeInUpAnim 1s forwards;
        }
        .delay-1 { animation-delay: 0.5s; }
        .delay-2 { animation-delay: 1s; }

        @keyframes fadeInUpAnim {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Botões */
        button.action-btn {
            background-color: var(--amarelo);
            color: var(--verde-1);
            border: 2px solid var(--amarelo);
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        button.action-btn:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        }
        button.action-btn.secondary-btn {
            background-color: transparent;
            color: var(--amarelo);
        }
        button.action-btn.secondary-btn:hover {
            background-color: var(--amarelo);
            color: var(--verde-1);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        
        button.delete-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8em;
            margin-left: 10px;
            transition: 0.2s;
        }
        button.delete-btn:hover {
            background-color: #cc0000;
        }

        /* Placar no End Screen */
        #leaderboard-container {
            background: var(--verde-2);
            border: 2px solid var(--azul);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
            max-height: 350px;
            overflow-y: auto;
            text-align: left;
        }
        #leaderboard-container h3 {
            margin-top: 0;
            color: var(--verde-3);
            text-align: center;
        }

        /* LAYOUT PRINCIPAL DO QUIZ */
        header {
            margin-bottom: 30px;
            text-align: center;
            margin-top: 20px;
        }
        header h1 {
            color: var(--amarelo);
            margin: 0;
            font-size: 2.5em;
        }

        .container {
            display: flex;
            justify-content: center;
            width: 100%;
            max-width: 800px;
        }

        /* Seção do Quiz */
        .quiz-section {
            width: 100%;
            background-color: var(--verde-2);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            border: 2px solid var(--azul);
            position: relative;
        }

        #timer-display {
            position: absolute;
            top: 20px;
            right: 30px;
            background-color: var(--verde-1);
            color: var(--amarelo);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            border: 1px solid var(--verde-3);
        }

        #question-text {
            color: var(--verde-4);
            margin-top: 20px;
            margin-bottom: 25px;
            font-size: 1.4em;
            line-height: 1.4;
            padding-right: 100px; /* Evitar sobreposição com o timer */
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: transparent;
            border: 2px solid var(--azul);
            color: white;
            padding: 15px;
            font-size: 1.1em;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .option-btn:hover {
            background-color: var(--azul);
            color: var(--verde-1);
            font-weight: bold;
        }
        .option-btn.correct {
            background-color: var(--verde-3);
            border-color: var(--verde-3);
            color: var(--verde-1);
            font-weight: bold;
        }
        .option-btn.wrong {
            background-color: #ff6b6b;
            border-color: #ff6b6b;
            color: white;
        }

        .actions {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
        }

        @media (max-width: 768px) {
            .screen-content h1 { font-size: 2.2em; }
            .screen-content p { font-size: 1.5em; }
            #timer-display {
                position: relative;
                top: 0;
                right: 0;
                display: inline-block;
                margin-bottom: 10px;
            }
            #question-text { padding-right: 0; }
        }
    </style>
</head>
<body>

    <!-- TELA DE ABERTURA -->
    <div id="intro-screen">
        <div class="screen-content">
            <h1 class="fade-in-up">Agora vamos ao nosso quiz!</h1>
            <p class="fade-in-up delay-1">Desejo a todos boa sorte 🍀</p>
            
            <button id="btn-start" class="action-btn fade-in-up delay-2" onclick="startApp()">
                <!-- Ícone do Google -->
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Entrar com Google para Jogar
            </button>
        </div>
    </div>

    <!-- TELA FINAL -->
    <div id="end-screen">
        <div class="screen-content" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            <h1 id="end-title">Parabéns! 🚀</h1>
            <p id="end-text">O primeiro passo para bater a meta é o conhecimento!</p>
            
            <!-- Container do Placar -->
            <div id="leaderboard-container" class="fade-in-up delay-1">
                <h3>🏆 Carregando Placar...</h3>
            </div>

            <div class="button-group fade-in-up delay-2">
                <button class="action-btn" onclick="restartQuiz()">Voltar ao Início</button>
                <button class="action-btn secondary-btn" onclick="voltarApresentacao()">Voltar à Apresentação</button>
                
                <!-- Botão de Download Excel - Ficará oculto por padrão -->
                <button id="btn-export-excel" class="action-btn" style="background-color: var(--verde-3); color: var(--verde-1); display: none;" onclick="baixarExcel()">Baixar Excel (Admin)</button>
            </div>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL DO QUIZ -->
    <header>
        <h1>CX | Perguntas e Respostas - Metas</h1>
    </header>

    <main class="container">
        <section class="quiz-section">
            <div id="timer-display">Tempo: 0.0s</div>
            <div id="question-container">
                <h2 id="question-text">Carregando pergunta...</h2>
            </div>
            <div id="options-container" class="options"></div>
            <div class="actions">
                <button id="next-btn" class="action-btn" style="display:none;" onclick="nextQuestion()">Próxima Pergunta</button>
            </div>
        </section>
    </main>

    <!-- SCRIPT TIPO MÓDULO PARA IMPORTAR O FIREBASE -->
    <script type="module">
        // Importando também o signInWithPopup
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, where, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getAuth, GoogleAuthProvider, onAuthStateChanged, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getStorage } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

        // AS SUAS CREDENCIAIS DO FIREBASE
        const firebaseConfig = {
            apiKey:      "AIzaSyA6WjOoM-KCi-Yl4E5rwKbOulF8tBYEClo",
            authDomain:  "portal-atendimento-541ae.firebaseapp.com",
            projectId:   "portal-atendimento-541ae",
            storageBucket: "portal-atendimento-541ae.appspot.com"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const provider = new GoogleAuthProvider();

        // =========================================================
        // VALIDAÇÃO DE ADMIN 
        // =========================================================
        const ADMIN_EMAILS = [
            'priscila.baldo@leveros.com.br', 
            'matheus.mendes@leveros.com.br', 
            'arinay.santos@leveros.com.br'
        ];
        
        window.isAdmin = false;

        onAuthStateChanged(auth, (user) => {
            const btnExcel = document.getElementById('btn-export-excel');
            if (user && user.email && ADMIN_EMAILS.includes(user.email.toLowerCase())) {
                window.isAdmin = true;
                if (btnExcel) btnExcel.style.display = 'inline-block'; 
            } else {
                window.isAdmin = false;
                if (btnExcel) btnExcel.style.display = 'none'; 
            }
        });

        // =========================================================
        // VARIÁVEIS GLOBAIS DO QUIZ
        // =========================================================
        let currentQuestion = 0;
        let userName = "";
        let userEmail = "";
        let userScore = 0;
        let todosResultados = []; 
        
        // Variáveis de Tempo
        let totalTimeMs = 0;
        let questionStartTime = 0;
        let timerInterval;

        const questions = [
            {
                question: "1. GPTW & CLIMA: Qual é a meta de adesão para manter o selo GPTW?",
                options: [
                    "A) 100% de adesão",
                    "B) ≥ 96% de adesão",
                    "C) 85% de adesão",
                    "D) ≥ 90% de adesão"
                ],
                answer: 1 
            },
            {
                question: "2. CSAT: No indicador de Satisfação no Atendimento (CSAT), qual foi o resultado atingido no mês de setembro frente à meta de 78%?",
                options: [
                    "A) 75%",
                    "B) 78%",
                    "C) 81%",
                    "D) 85%"
                ],
                answer: 2
            },
            {
                question: "3. DESPESAS G&A: Qual o status e o percentual gasto da meta de Despesas do Canal (G&A) no mês de setembro?",
                options: [
                    "A) Meta não atingida, com gasto de 105%.",
                    "B) Meta em andamento, com gasto de 50%.",
                    "C) Meta atingida parcialmente, com gasto de 85%.",
                    "D) Meta atingida, com gasto de 75,70% do orçamento estipulado."
                ],
                answer: 3
            },
            {
                question: "4. T&D: A meta de T&D (Trocas e Devoluções) foi Atingida Parcialmente (85%). Qual dos seus componentes NÃO atingiu o objetivo estipulado?",
                options: [
                    "A) T&D Geral",
                    "B) T&D Pós Vendas",
                    "C) Casos de Exceção",
                    "D) Nenhuma das alternativas, todas foram atingidas."
                ],
                answer: 2
            },
            {
                question: "5. DEPÓSITO DEFEITO FABRICANTE: O indicador tem como meta zerar o saldo. Quantos volumes foram registrados no mês de setembro?",
                options: [
                    "A) 0 volumes",
                    "B) 342 volumes",
                    "C) 821 volumes",
                    "D) 1.590 volumes"
                ],
                answer: 2
            },
            {
                question: "6. RECUPERAÇÃO DE VALORES: Qual é o principal objetivo da meta 'Recuperação de Valores Perdidos'?",
                options: [
                    "A) Recuperar o cliente que cancelou a compra após o prazo.",
                    "B) Recuperar valor de vendas onde o cliente fica com o produto e o dinheiro simultaneamente.",
                    "C) Cobrar juros de clientes que atrasaram o pagamento do boleto.",
                    "D) Reembolsar o cliente por produtos enviados com avarias."
                ],
                answer: 1
            }
        ];

        // =========================================================
        // FUNÇÕES DO QUIZ
        // =========================================================
        window.startApp = async function() {
            const btnStart = document.getElementById('btn-start');
            const originalText = btnStart.innerHTML;
            btnStart.disabled = true;
            btnStart.innerHTML = "A autenticar aguarde...";

            try {
                // 1. Força o login com o Google
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                
                userName = user.displayName || "Operador";
                userEmail = user.email;

                // 2. Verifica se o E-MAIL já jogou (Verificação segura)
                const qCheck = query(collection(db, "quiz_resultados"), where("email", "==", userEmail));
                const checkSnapshot = await getDocs(qCheck);
                
                if (!checkSnapshot.empty) {
                    alert(`Olá ${userName}, você já realizou este quiz! Cada utilizador só pode jogar uma vez.`);
                    btnStart.disabled = false;
                    btnStart.innerHTML = originalText;
                    return;
                }

                // Inicia o Quiz
                userScore = 0; 
                totalTimeMs = 0;
                currentQuestion = 0;
                
                const introScreen = document.getElementById('intro-screen');
                introScreen.style.opacity = '0';
                introScreen.style.transform = 'translateY(-20px)';
                
                setTimeout(() => {
                    introScreen.style.display = 'none';
                    loadQuestion();
                }, 800);

            } catch(error) {
                console.error("Erro na autenticação: ", error);
                alert("Foi cancelado ou ocorreu uma falha no login com o Google. É obrigatório fazer login para jogar.");
                btnStart.disabled = false;
                btnStart.innerHTML = originalText;
            }
        };

        window.voltarApresentacao = function() {
            window.location.href = "https://docs.google.com/presentation/d/1EysZ3n1mbWNOwfNGxFUsi5tCQMPOvSEFAMqyJWRm_V4/edit?slide=id.g3ed44f0caa6_0_12#slide=id.g3ed44f0caa6_0_12";
        };

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('question-text').innerText = q.question;
            const optionsContainer = document.getElementById('options-container');
            
            optionsContainer.innerHTML = '';
            
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => window.selectAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
            
            document.getElementById('next-btn').style.display = 'none';

            // Inicia o temporizador
            questionStartTime = Date.now();
            document.getElementById('timer-display').innerText = "Tempo: 0.0s";
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const diff = (Date.now() - questionStartTime) / 1000;
                document.getElementById('timer-display').innerText = `Tempo: ${diff.toFixed(1)}s`;
            }, 100);
        }

        window.selectAnswer = function(selectedIndex, btnElement) {
            // Para o temporizador e contabiliza o tempo desta questão
            clearInterval(timerInterval);
            const timeTaken = Date.now() - questionStartTime;
            totalTimeMs += timeTaken;

            const correctIndex = questions[currentQuestion].answer;
            const buttons = document.querySelectorAll('.option-btn');
            
            buttons.forEach(b => b.disabled = true);
            
            if (selectedIndex === correctIndex) {
                btnElement.classList.add('correct');
                userScore++; 
            } else {
                btnElement.classList.add('wrong');
                buttons[correctIndex].classList.add('correct');
            }
            
            const nextBtn = document.getElementById('next-btn');
            nextBtn.style.display = 'inline-block';
            
            if (currentQuestion >= questions.length - 1) {
                nextBtn.innerText = 'Finalizar Quiz';
            } else {
                nextBtn.innerText = 'Próxima Pergunta';
            }
        };

        window.nextQuestion = function() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                loadQuestion();
            } else {
                showEndScreen();
            }
        };

        async function showEndScreen() {
            const endScreen = document.getElementById('end-screen');
            const title = document.getElementById('end-title');
            
            title.innerText = `Parabéns, ${userName}! 🚀`;
            document.getElementById('end-text').innerText = `Acertaste ${userScore} de ${questions.length} perguntas em ${(totalTimeMs/1000).toFixed(2)}s.`;

            endScreen.style.display = 'flex';
            setTimeout(() => {
                endScreen.style.opacity = '1';
                endScreen.style.transform = 'translateY(0)';
            }, 50);

            // Grava os resultados, agora incluindo o E-MAIL para bloqueio seguro
            try {
                await addDoc(collection(db, "quiz_resultados"), {
                    nome: userName,
                    email: userEmail,
                    acertos: userScore,
                    total: questions.length,
                    tempoTotal: totalTimeMs,
                    dataHora: new Date().toISOString()
                });
                console.log("Resultado salvo com sucesso no Firebase!");
            } catch (e) {
                console.error("Erro ao salvar no Firebase: ", e);
            }

            await carregarPlacar();
        }

        window.carregarPlacar = async function() {
            const leaderboardDiv = document.getElementById('leaderboard-container');
            
            try {
                // Consulta base: ordena apenas por acertos no Firestore
                const q = query(collection(db, "quiz_resultados"), orderBy("acertos", "desc"));
                const querySnapshot = await getDocs(q);
                
                let resultadosBrutos = [];
                
                querySnapshot.forEach((doc) => {
                    const dados = doc.data();
                    resultadosBrutos.push({
                        id: doc.id,
                        nome: dados.nome,
                        email: dados.email,
                        acertos: dados.acertos,
                        total: dados.total,
                        tempoTotal: dados.tempoTotal || 999999999, // Fallback se o tempo não existir
                        dataHora: dados.dataHora
                    });
                });

                // Ordenação local (Desempate por tempo)
                resultadosBrutos.sort((a, b) => {
                    if (b.acertos !== a.acertos) {
                        return b.acertos - a.acertos; // Quem acertou mais fica acima
                    }
                    return a.tempoTotal - b.tempoTotal; // Em caso de empate, quem fez em menos tempo fica acima
                });
                
                todosResultados = []; 
                let html = "<h3>🏆 Placar Geral da Equipe</h3><ul style='list-style: none; padding: 0;'>";
                
                let posicao = 1;
                resultadosBrutos.forEach((dados) => {
                    todosResultados.push({
                        "Posição": posicao + "º",
                        "Nome": dados.nome,
                        "E-mail": dados.email,
                        "Acertos": dados.acertos,
                        "Tempo (Segundos)": (dados.tempoTotal / 1000).toFixed(2),
                        "Data/Hora": new Date(dados.dataHora).toLocaleString('pt-BR')
                    });

                    let badge = posicao === 1 ? "🥇" : posicao === 2 ? "🥈" : posicao === 3 ? "🥉" : `<b>${posicao}º</b>`;
                    
                    // Botão de Excluir EXCLUSIVO para Admins
                    let adminBtnHtml = window.isAdmin 
                        ? `<button class="delete-btn" onclick="deletarResultado('${dados.id}')">Excluir</button>` 
                        : '';

                    html += `
                        <li style="padding: 10px; margin: 5px 0; background: var(--verde-1); border-radius: 5px; border: 1px solid var(--verde-3); display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <span>${badge} &nbsp; ${dados.nome}</span>
                                ${adminBtnHtml}
                            </div>
                            <div style="text-align: right;">
                                <span style="color: var(--amarelo); font-weight: bold; display:block;">${dados.acertos} pts</span>
                                <span style="color: #aaa; font-size: 0.8em;">${(dados.tempoTotal / 1000).toFixed(1)}s</span>
                            </div>
                        </li>
                    `;
                    posicao++;
                });
                
                html += "</ul>";
                leaderboardDiv.innerHTML = html;

            } catch (e) {
                console.error("Erro ao carregar placar: ", e);
                leaderboardDiv.innerHTML = "<h3>Erro ao carregar o placar. Ocorreu uma falha de conexão.</h3>";
            }
        }

        window.restartQuiz = function() {
            const endScreen = document.getElementById('end-screen');
            endScreen.style.opacity = '0';
            endScreen.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                endScreen.style.display = 'none';
                
                const introScreen = document.getElementById('intro-screen');
                introScreen.style.display = 'flex';
                
                setTimeout(() => {
                    introScreen.style.opacity = '1';
                    introScreen.style.transform = 'translateY(0)';
                }, 50);

                currentQuestion = 0;
            }, 800);
        };

        // =========================================================
        // FUNÇÕES ADMINISTRATIVAS E EXPORTAÇÃO
        // =========================================================
        window.deletarResultado = async function(docId) {
            if(confirm("Tem a certeza de que deseja excluir esta tentativa? Ao confirmar, o e-mail deste operador será libertado para ele poder jogar novamente.")) {
                try {
                    await deleteDoc(doc(db, "quiz_resultados", docId));
                    alert("A tentativa foi excluída com sucesso.");
                    await carregarPlacar(); // Recarrega o placar após apagar
                } catch(e) {
                    alert("Erro ao excluir: " + e.message);
                }
            }
        };

        window.baixarExcel = function() {
            if (todosResultados.length === 0) {
                alert("Nenhum dado disponível para descarregar ainda.");
                return;
            }
            const worksheet = XLSX.utils.json_to_sheet(todosResultados);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Ranking");
            XLSX.writeFile(workbook, "Ranking_Quiz_Leveros.xlsx");
        };

    </script>
</body>
</html>
