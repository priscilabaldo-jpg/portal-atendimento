<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Metas - Leveros</title>
    
    <!-- Biblioteca SheetJS para gerar o Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <style>
        /* Tabela de cores Leveros */
        :root {
            --verde-1: #002D32;
            --verde-2: #005A64;
            --azul: #4CDDDD;
            --verde-3: #6FFFAF;
            --verde-4: #CEFFAE;
            --amarelo: #FFCE00;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--verde-1);
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* TELAS DE ABERTURA E FINALIZAÇÃO */
        #intro-screen, #end-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--verde-1);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }

        #end-screen {
            display: none;
            opacity: 0; 
            transform: translateY(20px);
            overflow-y: auto;
            padding: 40px 20px;
        }

        .screen-content h1 {
            color: var(--amarelo);
            font-size: 3.5em;
            margin-bottom: 10px;
        }

        .screen-content p {
            color: var(--verde-4);
            font-size: 2em;
            margin-bottom: 30px;
        }

        /* Input do nome */
        #user-name {
            padding: 15px;
            font-size: 1.2em;
            border-radius: 8px;
            border: 2px solid var(--azul);
            background-color: var(--verde-2);
            color: white;
            margin-bottom: 25px;
            width: 100%;
            max-width: 350px;
            text-align: center;
        }
        #user-name::placeholder {
            color: #aaa;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        /* Animações */
        .fade-in-up {
            opacity: 0;
            transform: translateY(40px);
            animation: fadeInUpAnim 1s forwards;
        }
        .delay-1 { animation-delay: 0.5s; }
        .delay-2 { animation-delay: 1s; }

        @keyframes fadeInUpAnim {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Botões */
        button.action-btn {
            background-color: var(--amarelo);
            color: var(--verde-1);
            border: 2px solid var(--amarelo);
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button.action-btn:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        }
        button.action-btn.secondary-btn {
            background-color: transparent;
            color: var(--amarelo);
        }
        button.action-btn.secondary-btn:hover {
            background-color: var(--amarelo);
            color: var(--verde-1);
        }

        /* Placar no End Screen */
        #leaderboard-container {
            background: var(--verde-2);
            border: 2px solid var(--azul);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
            max-height: 250px;
            overflow-y: auto;
            text-align: left;
        }
        #leaderboard-container h3 {
            margin-top: 0;
            color: var(--verde-3);
            text-align: center;
        }

        /* LAYOUT PRINCIPAL DO QUIZ */
        header {
            margin-bottom: 30px;
            text-align: center;
            margin-top: 20px;
        }
        header h1 {
            color: var(--amarelo);
            margin: 0;
            font-size: 2.5em;
        }

        .container {
            display: flex;
            gap: 30px;
            width: 100%;
            max-width: 1100px;
            flex-wrap: wrap;
        }

        /* Seção do Quiz */
        .quiz-section {
            flex: 2;
            background-color: var(--verde-2);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            border: 2px solid var(--azul);
            min-width: 300px;
        }

        #question-text {
            color: var(--verde-4);
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 1.4em;
            line-height: 1.4;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: transparent;
            border: 2px solid var(--azul);
            color: white;
            padding: 15px;
            font-size: 1.1em;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .option-btn:hover {
            background-color: var(--azul);
            color: var(--verde-1);
            font-weight: bold;
        }
        .option-btn.correct {
            background-color: var(--verde-3);
            border-color: var(--verde-3);
            color: var(--verde-1);
            font-weight: bold;
        }
        .option-btn.wrong {
            background-color: #ff6b6b;
            border-color: #ff6b6b;
            color: white;
        }

        .actions {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
        }

        /* Seção do Sorteador */
        .sorteador-section {
            flex: 1;
            background-color: var(--verde-2);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid var(--verde-3);
            min-width: 250px;
        }
        .sorteador-section h2 {
            color: var(--verde-3);
            margin-top: 0;
            text-align: center;
        }

        .roleta-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 30px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .roleta-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                var(--azul) 0deg 90deg, 
                var(--verde-4) 90deg 180deg, 
                var(--azul) 180deg 270deg, 
                var(--verde-4) 270deg 360deg
            );
            border: 6px solid var(--verde-1);
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        #numero-sorteado {
            position: relative;
            z-index: 2;
            background-color: var(--verde-1);
            color: var(--amarelo);
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.8em;
            font-weight: bold;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        .pointer {
            position: absolute;
            top: -20px;
            font-size: 2.5em;
            color: var(--amarelo);
            z-index: 3;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .screen-content h1 { font-size: 2.2em; }
            .screen-content p { font-size: 1.5em; }
        }
    </style>
</head>
<body>

    <!-- TELA DE ABERTURA -->
    <div id="intro-screen">
        <div class="screen-content">
            <h1 class="fade-in-up">Agora vamos ao nosso quiz!</h1>
            <p class="fade-in-up delay-1">Desejo a todos boa sorte 🍀</p>
            
            <input type="text" id="user-name" class="fade-in-up delay-1" placeholder="Digite seu nome (Obrigatório)" required>
            <br>
            <button class="action-btn fade-in-up delay-2" onclick="startApp()">Começar</button>
        </div>
    </div>

    <!-- TELA FINAL -->
    <div id="end-screen">
        <div class="screen-content" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            <h1 id="end-title">Parabéns! 🚀</h1>
            <p id="end-text">O primeiro passo para bater a meta é o conhecimento!</p>
            
            <!-- Container do Placar -->
            <div id="leaderboard-container" class="fade-in-up delay-1">
                <h3>🏆 Carregando Placar...</h3>
            </div>

            <div class="button-group fade-in-up delay-2">
                <button class="action-btn" onclick="restartQuiz()">Jogar Novamente</button>
                <button class="action-btn secondary-btn" onclick="voltarApresentacao()">Voltar à Apresentação</button>
                
                <!-- Botão de Download Excel - Ficará oculto por padrão -->
                <button id="btn-export-excel" class="action-btn" style="background-color: var(--verde-3); color: var(--verde-1); display: none;" onclick="baixarExcel()">Baixar Excel (Admin)</button>
            </div>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL DO QUIZ -->
    <header>
        <h1>CX | Perguntas e Respostas - Metas</h1>
    </header>

    <main class="container">
        <section class="quiz-section">
            <div id="question-container">
                <h2 id="question-text">Carregando pergunta...</h2>
            </div>
            <div id="options-container" class="options"></div>
            <div class="actions">
                <button id="next-btn" class="action-btn" style="display:none;" onclick="nextQuestion()">Próxima Pergunta</button>
            </div>
        </section>

        <section class="sorteador-section">
            <h2>Sorteador<br>de Operadores</h2>
            <div class="roleta-container">
                <div class="pointer">▼</div>
                <div id="roleta-bg" class="roleta-bg"></div>
                <div id="numero-sorteado">?</div>
            </div>
            <button class="action-btn" onclick="spinRoleta()">Girar Roleta</button>
        </section>
    </main>

    <!-- SCRIPT TIPO MÓDULO PARA IMPORTAR O FIREBASE -->
    <script type="module">
        // Importando o SDK Firebase v9+ e as ferramentas (Firestore e Auth)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getAuth, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getStorage } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

        // AS SUAS CREDENCIAIS DO FIREBASE
        const firebaseConfig = {
            apiKey:      "AIzaSyA6WjOoM-KCi-Yl4E5rwKbOulF8tBYEClo",
            authDomain:  "portal-atendimento-541ae.firebaseapp.com",
            projectId:   "portal-atendimento-541ae",
            storageBucket: "portal-atendimento-541ae.appspot.com"
        };

        // Inicializa o Firebase e os serviços
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const provider = new GoogleAuthProvider();

        // =========================================================
        // VALIDAÇÃO DE ADMIN PARA O BOTÃO DO EXCEL
        // =========================================================
        const ADMIN_EMAILS = [
            'priscila.baldo@leveros.com.br', 
            'matheus.mendes@leveros.com.br', 
            'arinay.santos@leveros.com.br'
        ];

        // Escuta as mudanças de autenticação do usuário
        onAuthStateChanged(auth, (user) => {
            const btnExcel = document.getElementById('btn-export-excel');
            
            // Se o usuário estiver logado e for um dos Admins
            if (user && user.email && ADMIN_EMAILS.includes(user.email.toLowerCase())) {
                if (btnExcel) btnExcel.style.display = 'inline-block'; // Mostra o botão
            } else {
                if (btnExcel) btnExcel.style.display = 'none'; // Esconde o botão
            }
        });

        // =========================================================
        // VARIÁVEIS GLOBAIS DO QUIZ
        // =========================================================
        let currentQuestion = 0;
        let isSpinning = false;
        const totalOperadores = 50; 
        
        let userName = "";
        let userScore = 0;
        let todosResultados = []; 

        const questions = [
            {
                question: "1. META DE CSAT (>= 78%): Como o operador garante que essa meta de satisfação seja alcançada?",
                options: [
                    "A) Desligando a chamada o mais rápido possível.",
                    "B) Garantindo um atendimento ágil, empático e resolutivo logo no primeiro contato.",
                    "C) Focando apenas em ler os procedimentos técnicos sem ouvir o cliente.",
                    "D) Não informando prazos para não gerar expectativas."
                ],
                answer: 1 
            },
            {
                question: "2. META DE FCR: O que é fundamental para resolver a solicitação do cliente na primeira ligação?",
                options: [
                    "A) Pedir para ele ligar novamente no dia seguinte para confirmar o status.",
                    "B) Transferir para outro departamento sempre que a dúvida for complexa.",
                    "C) Investigar a causa raiz e fornecer a solução completa e correta de forma imediata.",
                    "D) Abrir um chamado e não acompanhar o caso."
                ],
                answer: 2
            },
            {
                question: "3. META DE TMA: Qual a melhor forma de atingir a meta sem prejudicar a qualidade?",
                options: [
                    "A) Conduzir o atendimento com objetividade, dominando os sistemas e processos da Leveros.",
                    "B) Falar rápido e interromper o cliente enquanto ele explica o problema.",
                    "C) Pular as etapas de verificação e segurança para ganhar tempo.",
                    "D) Fazer o cliente esperar em silêncio na linha enquanto busca informações."
                ],
                answer: 0
            },
            {
                question: "4. META DE QUALIDADE: Para tirar a nota máxima, o que é indispensável?",
                options: [
                    "A) Ser informal demais para parecer 'amigo' do cliente.",
                    "B) Pular a saudação padrão para ir direto ao assunto.",
                    "C) Seguir os procedimentos, manter a cordialidade e registrar todas as informações.",
                    "D) Fazer apenas o que o cliente manda, ignorando regras da empresa."
                ],
                answer: 2
            },
            {
                question: "5. META DE ADERÊNCIA: Como a equipe ajuda a manter esse indicador saudável?",
                options: [
                    "A) Entrando em pausa todos no mesmo horário.",
                    "B) Atrasando alguns minutos na volta do intervalo, pois não impacta o sistema.",
                    "C) Cumprindo rigorosamente seus horários de login, logout e pausas programadas.",
                    "D) Deslogando do sistema sem avisar o supervisor."
                ],
                answer: 2
            }
        ];

        // =========================================================
        // FUNÇÕES DO QUIZ (Expostas no objeto global window)
        // =========================================================
        window.startApp = function() {
            const inputElement = document.getElementById('user-name');
            userName = inputElement.value.trim();
            
            if (userName === "") {
                alert("Por favor, digite seu nome para começar!");
                inputElement.focus();
                return;
            }

            userScore = 0; 
            
            const introScreen = document.getElementById('intro-screen');
            introScreen.style.opacity = '0';
            introScreen.style.transform = 'translateY(-20px)';
            
            setTimeout(() => {
                introScreen.style.display = 'none';
                loadQuestion();
            }, 800);
        };

        window.voltarApresentacao = function() {
            window.location.href = "https://docs.google.com/presentation/d/1EysZ3n1mbWNOwfNGxFUsi5tCQMPOvSEFAMqyJWRm_V4/edit?slide=id.g3ed44f0caa6_0_12#slide=id.g3ed44f0caa6_0_12";
        };

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('question-text').innerText = q.question;
            const optionsContainer = document.getElementById('options-container');
            
            optionsContainer.innerHTML = '';
            
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => window.selectAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
            
            document.getElementById('next-btn').style.display = 'none';
        }

        window.selectAnswer = function(selectedIndex, btnElement) {
            const correctIndex = questions[currentQuestion].answer;
            const buttons = document.querySelectorAll('.option-btn');
            
            buttons.forEach(b => b.disabled = true);
            
            if (selectedIndex === correctIndex) {
                btnElement.classList.add('correct');
                userScore++; 
            } else {
                btnElement.classList.add('wrong');
                buttons[correctIndex].classList.add('correct');
            }
            
            const nextBtn = document.getElementById('next-btn');
            nextBtn.style.display = 'inline-block';
            
            if (currentQuestion >= questions.length - 1) {
                nextBtn.innerText = 'Finalizar Quiz';
            } else {
                nextBtn.innerText = 'Próxima Pergunta';
            }
        };

        window.nextQuestion = function() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                loadQuestion();
                resetRoleta();
            } else {
                showEndScreen();
            }
        };

        async function showEndScreen() {
            const endScreen = document.getElementById('end-screen');
            const title = document.getElementById('end-title');
            
            title.innerText = `Parabéns, ${userName}! 🚀`;
            document.getElementById('end-text').innerText = `Você acertou ${userScore} de ${questions.length} perguntas.`;

            endScreen.style.display = 'flex';
            setTimeout(() => {
                endScreen.style.opacity = '1';
                endScreen.style.transform = 'translateY(0)';
            }, 50);

            // 1. Salva no Firestore usando o DB configurado
            try {
                await addDoc(collection(db, "quiz_resultados"), {
                    nome: userName,
                    acertos: userScore,
                    total: questions.length,
                    dataHora: new Date().toISOString()
                });
                console.log("Resultado salvo com sucesso no Firebase!");
            } catch (e) {
                console.error("Erro ao salvar no Firebase: ", e);
            }

            // 2. Carrega o Placar de todos
            await carregarPlacar();
        }

        async function carregarPlacar() {
            const leaderboardDiv = document.getElementById('leaderboard-container');
            
            try {
                const q = query(collection(db, "quiz_resultados"), orderBy("acertos", "desc"));
                const querySnapshot = await getDocs(q);
                
                todosResultados = []; 
                
                let html = "<h3>🏆 Placar Geral da Equipe</h3><ul style='list-style: none; padding: 0;'>";
                
                let posicao = 1;
                querySnapshot.forEach((doc) => {
                    const dados = doc.data();
                    
                    todosResultados.push({
                        "Posição": posicao + "º",
                        "Nome": dados.nome,
                        "Acertos": dados.acertos,
                        "Total Perguntas": dados.total,
                        "Data/Hora": new Date(dados.dataHora).toLocaleString('pt-BR')
                    });

                    let badge = posicao === 1 ? "🥇" : posicao === 2 ? "🥈" : posicao === 3 ? "🥉" : `<b>${posicao}º</b>`;
                    
                    html += `
                        <li style="padding: 10px; margin: 5px 0; background: var(--verde-1); border-radius: 5px; border: 1px solid var(--verde-3); display: flex; justify-content: space-between; align-items: center;">
                            <span>${badge} &nbsp; ${dados.nome}</span>
                            <span style="color: var(--amarelo); font-weight: bold;">${dados.acertos} pts</span>
                        </li>
                    `;
                    posicao++;
                });
                
                html += "</ul>";
                leaderboardDiv.innerHTML = html;

            } catch (e) {
                console.error("Erro ao carregar placar: ", e);
                leaderboardDiv.innerHTML = "<h3>Erro ao carregar o placar. Ocorreu uma falha de conexão.</h3>";
            }
        }

        window.baixarExcel = function() {
            if (todosResultados.length === 0) {
                alert("Nenhum dado disponível para baixar ainda.");
                return;
            }

            const worksheet = XLSX.utils.json_to_sheet(todosResultados);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Ranking");

            XLSX.writeFile(workbook, "Ranking_Quiz_Leveros.xlsx");
        };

        window.restartQuiz = function() {
            const endScreen = document.getElementById('end-screen');
            endScreen.style.opacity = '0';
            endScreen.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                endScreen.style.display = 'none';
                
                const introScreen = document.getElementById('intro-screen');
                document.getElementById('user-name').value = ''; 
                introScreen.style.display = 'flex';
                
                setTimeout(() => {
                    introScreen.style.opacity = '1';
                    introScreen.style.transform = 'translateY(0)';
                }, 50);

                currentQuestion = 0;
                resetRoleta();
            }, 800);
        };

        // =========================================================
        // CÓDIGO DA ROLETA 
        // =========================================================
        window.spinRoleta = function() {
            if(isSpinning) return;
            isSpinning = true;
            
            const roletaBg = document.getElementById('roleta-bg');
            const numSpan = document.getElementById('numero-sorteado');
            
            const numeroVencedor = Math.floor(Math.random() * totalOperadores) + 1;
            
            roletaBg.style.transition = 'transform 3s cubic-bezier(0.25, 0.1, 0.25, 1)';
            const randomSpins = Math.floor(Math.random() * 5) + 5; 
            const targetRotation = (randomSpins * 360) + Math.floor(Math.random() * 360);
            roletaBg.style.transform = `rotate(${targetRotation}deg)`;
            
            let interval = setInterval(() => {
                numSpan.innerText = Math.floor(Math.random() * totalOperadores) + 1;
            }, 80);

            setTimeout(() => {
                clearInterval(interval);
                numSpan.innerText = numeroVencedor;
                isSpinning = false;
            }, 3000);
        };

        function resetRoleta() {
            const roletaBg = document.getElementById('roleta-bg');
            const numSpan = document.getElementById('numero-sorteado');
            
            roletaBg.style.transition = 'none';
            roletaBg.style.transform = `rotate(0deg)`;
            numSpan.innerText = "?";
        }

    </script>
</body>
</html>
