<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Metas - Leveros</title>
    <style>
        /* Tabela de cores Leveros */
        :root {
            --verde-1: #002D32;
            --verde-2: #005A64;
            --azul: #4CDDDD;
            --verde-3: #6FFFAF;
            --verde-4: #CEFFAE;
            --amarelo: #FFCE00;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--verde-1);
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            margin-bottom: 30px;
            text-align: center;
        }

        header h1 {
            color: var(--amarelo);
            margin: 0;
            font-size: 2.5em;
        }

        /* Layout Principal */
        .container {
            display: flex;
            gap: 30px;
            width: 100%;
            max-width: 1100px;
            flex-wrap: wrap;
        }

        /* Seção do Quiz (Esquerda) */
        .quiz-section {
            flex: 2;
            background-color: var(--verde-2);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            border: 2px solid var(--azul);
            min-width: 300px;
        }

        #question-text {
            color: var(--verde-4);
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 1.4em;
            line-height: 1.4;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: transparent;
            border: 2px solid var(--azul);
            color: white;
            padding: 15px;
            font-size: 1.1em;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .option-btn:hover {
            background-color: var(--azul);
            color: var(--verde-1);
            font-weight: bold;
        }

        /* Classes para acerto e erro */
        .option-btn.correct {
            background-color: var(--verde-3);
            border-color: var(--verde-3);
            color: var(--verde-1);
            font-weight: bold;
        }

        .option-btn.wrong {
            background-color: #ff6b6b;
            border-color: #ff6b6b;
            color: white;
        }

        .actions {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
        }
        
        button.action-btn {
            background-color: var(--amarelo);
            color: var(--verde-1);
            border: none;
            padding: 12px 24px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button.action-btn:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        /* Seção do Sorteador (Direita) */
        .sorteador-section {
            flex: 1;
            background-color: var(--verde-2);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid var(--verde-3);
            min-width: 250px;
        }

        .sorteador-section h2 {
            color: var(--verde-3);
            margin-top: 0;
            text-align: center;
        }

        /* Estilos da Roleta */
        .roleta-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 30px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .roleta-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                var(--azul) 0deg 90deg, 
                var(--verde-4) 90deg 180deg, 
                var(--azul) 180deg 270deg, 
                var(--verde-4) 270deg 360deg
            );
            border: 6px solid var(--verde-1);
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        #numero-sorteado {
            position: relative;
            z-index: 2;
            background-color: var(--verde-1);
            color: var(--amarelo);
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.8em;
            font-weight: bold;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .pointer {
            position: absolute;
            top: -20px;
            font-size: 2.5em;
            color: var(--amarelo);
            z-index: 3;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>CX | Perguntas e Respostas - Metas 26'27</h1>
    </header>

    <main class="container">
        <!-- Seção da Esquerda (Quiz) -->
        <section class="quiz-section">
            <div id="question-container">
                <h2 id="question-text">Carregando pergunta...</h2>
            </div>
            <div id="options-container" class="options">
                <!-- Botões gerados via JS -->
            </div>
            <div class="actions">
                <button id="next-btn" class="action-btn" style="display:none;" onclick="nextQuestion()">Próxima Pergunta</button>
            </div>
        </section>

        <!-- Seção da Direita (Sorteador) -->
        <section class="sorteador-section">
            <h2>Sorteador<br>de Operadores</h2>
            
            <div class="roleta-container">
                <div class="pointer">▼</div>
                <div id="roleta-bg" class="roleta-bg"></div>
                <div id="numero-sorteado">?</div>
            </div>

            <button class="action-btn" onclick="spinRoleta()">Girar Roleta</button>
        </section>
    </main>

    <script>
        // Banco de perguntas focadas nas diferentes Metas
        const questions = [
            {
                // META 1: CSAT
                question: "1. META DE CSAT (>= 78%): Como o operador garante que essa meta de satisfação seja alcançada?",
                options: [
                    "A) Desligando a chamada o mais rápido possível.",
                    "B) Garantindo um atendimento ágil, empático e resolutivo logo no primeiro contato.",
                    "C) Focando apenas em ler os procedimentos técnicos sem ouvir o cliente.",
                    "D) Não informando prazos para não gerar expectativas."
                ],
                answer: 1 
            },
            {
                // META 2: FCR (First Contact Resolution / Resolução no Primeiro Contato)
                question: "2. META DE FCR: O que é fundamental para resolver a solicitação do cliente na primeira ligação?",
                options: [
                    "A) Pedir para ele ligar novamente no dia seguinte para confirmar o status.",
                    "B) Transferir para outro departamento sempre que a dúvida for complexa.",
                    "C) Investigar a causa raiz e fornecer a solução completa e correta de forma imediata.",
                    "D) Abrir um chamado e não acompanhar o caso."
                ],
                answer: 2
            },
            {
                // META 3: TMA (Tempo Médio de Atendimento)
                question: "3. META DE TMA: Qual a melhor forma de atingir a meta de tempo médio sem prejudicar a qualidade?",
                options: [
                    "A) Conduzir o atendimento com objetividade, dominando os sistemas e processos da Leveros.",
                    "B) Falar rápido e interromper o cliente enquanto ele explica o problema.",
                    "C) Pular as etapas de verificação e segurança para ganhar tempo.",
                    "D) Fazer o cliente esperar em silêncio na linha enquanto busca informações."
                ],
                answer: 0
            },
            {
                // META 4: Qualidade do Atendimento
                question: "4. META DE QUALIDADE: Para tirar a nota máxima na monitoria de qualidade, o que é indispensável?",
                options: [
                    "A) Ser informal demais para parecer 'amigo' do cliente.",
                    "B) Pular a saudação padrão para ir direto ao assunto.",
                    "C) Seguir os procedimentos/roteiros, manter a cordialidade e registrar todas as informações de forma clara.",
                    "D) Fazer apenas o que o cliente manda, mesmo que fuja das regras da empresa."
                ],
                answer: 2
            },
            {
                // META 5: Aderência à Escala (Absenteísmo/Pausas)
                question: "5. META DE ADERÊNCIA: Como a equipe ajuda a manter o indicador de aderência e tempo de fila saudável?",
                options: [
                    "A) Entrando em pausa todos no mesmo horário.",
                    "B) Atrasando alguns minutos na volta do intervalo, pois não impacta o sistema.",
                    "C) Cumprindo rigorosamente seus horários de login, logout e pausas programadas.",
                    "D) Deslogando do sistema sem avisar o supervisor."
                ],
                answer: 2
            }
        ];

        let currentQuestion = 0;
        let isSpinning = false;
        const totalOperadores = 50; // Ajuste para o número de pessoas da sua equipe

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('question-text').innerText = q.question;
            const optionsContainer = document.getElementById('options-container');
            
            optionsContainer.innerHTML = '';
            
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => selectAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
            
            document.getElementById('next-btn').style.display = 'none';
        }

        function selectAnswer(selectedIndex, btnElement) {
            const correctIndex = questions[currentQuestion].answer;
            const buttons = document.querySelectorAll('.option-btn');
            
            buttons.forEach(b => b.disabled = true);
            
            if (selectedIndex === correctIndex) {
                btnElement.classList.add('correct');
            } else {
                btnElement.classList.add('wrong');
                buttons[correctIndex].classList.add('correct');
            }
            
            const nextBtn = document.getElementById('next-btn');
            nextBtn.style.display = 'inline-block';
            
            if (currentQuestion >= questions.length - 1) {
                nextBtn.innerText = 'Reiniciar Quiz';
            } else {
                nextBtn.innerText = 'Próxima Pergunta';
            }
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                loadQuestion();
                resetRoleta();
            } else {
                currentQuestion = 0;
                loadQuestion();
                resetRoleta();
            }
        }

        function spinRoleta() {
            if(isSpinning) return;
            isSpinning = true;
            
            const roletaBg = document.getElementById('roleta-bg');
            const numSpan = document.getElementById('numero-sorteado');
            
            const numeroVencedor = Math.floor(Math.random() * totalOperadores) + 1;
            
            roletaBg.style.transition = 'transform 3s cubic-bezier(0.25, 0.1, 0.25, 1)';
            const randomSpins = Math.floor(Math.random() * 5) + 5; 
            const targetRotation = (randomSpins * 360) + Math.floor(Math.random() * 360);
            roletaBg.style.transform = `rotate(${targetRotation}deg)`;
            
            let interval = setInterval(() => {
                numSpan.innerText = Math.floor(Math.random() * totalOperadores) + 1;
            }, 80);

            setTimeout(() => {
                clearInterval(interval);
                numSpan.innerText = numeroVencedor;
                isSpinning = false;
            }, 3000);
        }

        function resetRoleta() {
            const roletaBg = document.getElementById('roleta-bg');
            const numSpan = document.getElementById('numero-sorteado');
            
            roletaBg.style.transition = 'none';
            roletaBg.style.transform = `rotate(0deg)`;
            numSpan.innerText = "?";
        }

        window.onload = loadQuestion;
    </script>
</body>
</html>
